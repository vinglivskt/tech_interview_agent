scenarios:
  - id: url-shortener
    title: URL Shortener
    level: junior
    summary: >
      Продуктовая команда запускает публичный сервис коротких ссылок.
      Пользователь вставляет длинный URL, получает короткий адрес и по нему происходит редирект.
    requirements:
      - Создание короткой ссылки для длинного URL
      - Быстрый редирект по короткому коду
      - Базовая статистика переходов
    nfr:
      - p99 редиректа не более 100 мс
      - Высокая доступность чтений
    constraints:
      - Короткий код должен быть уникальным
      - Статистика может обновляться асинхронно
    baseline_load:
      rps: 1500
      dau: 100000
      storage_gb: 100
    topics: [api, db, cache, consistency, monitoring]
    steps:
      - id: clarify
        title: Уточнение требований
        prompt: >
          Какие 5–8 вопросов вы зададите о продукте, масштабе, SLA и границах первой версии?
          После ответов кратко зафиксируйте свои допущения.
        expected_points:
          - Функциональные требования
          - SLO и доступность
          - Границы и ограничения
        rubric_weights:
          reqs: 0.7
          tradeoffs: 0.3
        hint: Разделите требования на функциональные, NFR и то, что не входит в первую версию.
      - id: hla
        title: High-level архитектура
        prompt: >
          Нарисуйте high-level схему и пройдите по write path (создание ссылки)
          и read path (редирект). Объясняйте назначение каждого компонента.
        expected_points:
          - API и балансировщик
          - Stateless-приложение
          - Кэш перед БД
          - Отдельный поток статистики
        rubric_weights:
          arch: 0.7
          scale: 0.3
        hint: Начните со схемы Client → LB → App → Cache → DB.
