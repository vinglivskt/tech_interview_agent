    steps: []
    acceptance_criteria:
      - Решение fan-out и проблему celebrity
      - Кэширование таймлайна
      - Ранжирование
    evolution: []
    failure_questions:
      - Твит звезды рассылается на 100 млн лент. Как не уронить кластер?
      - Новый подписчик звезды. Как заполнить ленту прошлыми твитами?
      - Таймлайн отвечает медленно. Как ускорить кэшированием?
    advanced_questions:
      - Как совместить real-time и устаревающий кэш таймлайнов?
      - Как считать «горячие» тренды и подмешивать в ленту?

  - id: like-counter
    title: "Like Counter"
    level: middle
    category: social
    primary_pattern: distributed-counter-batch
    summary: >
      Высоконагруженный счётчик лайков: распределённый счётчик, eventual
      consistency, батчинг и шардирование «горячих» ключей.
    requirements:
      - Инкремент/декремент лайков
      - Отображение точного счёта
      - Очень высокая конкурентность
    nfr:
      - Принимать миллионы лайков/сек
      - Отображать счёт с малой задержкой
    constraints:
      - Один «горячий» ключ поста
      - Eventual consistency допустима
    baseline_load:
      likes_per_sec: 1000000
      posts: 100000000
    topics: [distributed_counter, eventual_consistency, batching, sharding, redis]
    steps: []
    acceptance_criteria:
      - Шардирование счётчика
      - Батчинг записи
      - Округление/восстановление счёта
    evolution: []
    failure_questions:
      - Пост набрал миллион лайков за минуту. Как шардировать счётчик?
      - Redis потерял часть инкрементов. Как восстановить точный счёт?
      - Пользователь лайкнул и отменил 3 раза. Как отразить без гонки?
    advanced_questions:
      - Как строить иерархическую агрегацию и периодическую персистенцию?

  - id: follow-system
    title: "Follow System"
    level: middle
    category: social
    primary_pattern: graph-storage
    summary: >
      Граф подписок: follower graph, хранение, пагинация списков подписчиков,
      рекомендации и актуальность.
    requirements:
      - Подписка/отписка
      - Списки подписчиков и подписок
      - Рекомендации «кого читать»
    nfr:
      - Списки из миллионов подписчиков открываются быстро
      - Консистентность подписок
    constraints:
      - Граф огромный (миллиарды рёбер)
      - Рекомендации могут быть приблизительными
    baseline_load:
      users: 500000000
      edges: 100000000000
    topics: [follower_graph, graph_storage, pagination, recommendations, sharding]
    steps: []
    acceptance_criteria:
      - Модель хранения графа
      - Пагинация списков
      - Рекомендации
    evolution: []
    failure_questions:
      - У звезды 100 млн подписчиков. Как открыть их список без зависания?
      - Подписка совершена, но рекомендации не обновились. Как объяснить?
      - Как защитить пагинацию при добавлении новых подписчиков?
    advanced_questions:
      - Как строить рекомендации «кого читать» эффективно по графу?
      - Как хранить граф (user:following vs user:followers) и выбрать направление?

  # ==========================================================================
  # 11. ГЕОЛОКАЦИОННЫЕ СИСТЕМЫ
  # ==========================================================================

  - id: uber-like
    title: "Uber-like System"
    level: senior
    category: geo
    primary_pattern: geospatial-matching
    summary: >
      Сервис такси: водители/пассажиры, геолокация, подбор (matching), WebSocket,
      пространственные индексы, Redis Geo и Kafka.
    requirements:
      - Обновление позиций водителей
      - Подбор ближайшего водителя к пассажиру
      - Общение/трекинг поездки
    nfr:
      - Подбор за сотни мс
      - Отслеживание позиций тысяч водителей в реальном времени
    constraints:
      - Данные геолокации поступают непрерывно и быстро устаревают
      - Нужен пространственный поиск по многим пользователям
    baseline_load:
      drivers_online: 300000
      ride_requests_per_sec: 1000
      location_updates_per_sec: 1000000
    topics: [drivers, passengers, geolocation, matching, websocket, spatial_index, redis_geo, kafka]
    steps: []
    acceptance_criteria:
      - Приём и хранение геодезических данных
      - Пространственный индекс для поиска
      - Matching и коммуникация
    evolution: []
    failure_questions:
      - Пассажир запросил поездку точно на пике. Как не сломать подбор?
      - Водитель перестал слать координаты. Как понять, что он ещё онлайн?
      - Позиции водителей устарели. Как избежать «иллюзии близости»?
    advanced_questions:
      - Как настроить пространственный индекс под High-Churn апдейтов (Redis GEO vs PostGIS)?
      - Как строить динамический подбор с учётом цен и пожеланий пассажира?

  - id: food-delivery
    title: "Food Delivery"
    level: senior
    category: geo
    primary_pattern: order-courier-matching
    summary: >
      Деливери еды: рестораны, курьеры, заказы, подбор курьера к заказу
      и отслеживание в реальном времени.
    requirements:
      - Размещение заказа у ресторана
      - Подбор свободного курьера рядом
      - Трекинг доставки
    nfr:
      - Заказ и курьер подбираются быстро
      - Трекинг с минимальной задержкой
    constraints:
      - Курьер движется и целевой пункт важен
      - Многие заказы параллельно
    baseline_load:
      couriers: 100000
      orders_per_sec: 500
    topics: [restaurants, couriers, orders, matching, tracking]
    steps: []
    acceptance_criteria:
      - Подбор курьера по расстоянию/времени
      - Трекинг позиций
      - Управление заказами
    evolution: []
    failure_questions:
      - Отмена заказа после отказа курьера. Как вернуть к выбору?
      - Курьер пропал в заторе. Как перерассчитать время доставки?
      - Пик заказов в обед. Как балансировать курьеров?
    advanced_questions:
      - Как оптимизировать подбор (match) при множестве одновременных заказов?
      - Как прогнозировать время доставки с учётом трафика?

  - id: location-tracking
    title: "Location Tracking (1 млн машин)"
    level: senior
    category: geo
    primary_pattern: gps-event-stream
    summary: >
      Отслеживание миллиона автомобилей в реальном времени: GPS-события,
      Kafka, WebSocket, геопространственная индексация, агрегация и retention.
    requirements:
      - Приём GPS-событий от большого парка
      - Отображение живого трекинга
      - История поездок и агрегация
    nfr:
      - Приём десятков тысяч событий/сек
      - Задержка отображения < 2 c
    constraints:
      - Телеметрия массовая и непрерывная
      - Хот-данные vs исторические
    baseline_load:
      vehicles: 1000000
      events_per_sec: 50000
      stream_latency_s: 2
    topics: [gps_events, kafka, websocket, geospatial_indexing, aggregation, retention]
    steps: []
    acceptance_criteria:
      - Пайплайн приёма GPS через Kafka
      - Живая трансляция положений
      - Агрегация и хранение истории
    evolution: []
    failure_questions:
      - Всплеск телеметрии в 10 раз. Как буферизовать без потери?
      - Клиент теряет соединение. Как долго буферизовать события?
      - Как строить полигональные запросы «все машины в районе» под нагрузкой?
    advanced_questions:
      - Как партиционировать события по транспорту и времени для быстрых запросов?

  - id: nearby-search
    title: "Proximity Service / Nearby Search"
    level: middle
    category: geo
    primary_pattern: geohash-r-tree
    summary: >
      Поиск ближайших объектов (рестораны, АЗС, такси, магазины): геохаш,
      R-tree, QuadTree, S2-ячейки, пространственная БД, Redis Geo и кэш
      «горячих» клеток.
    requirements:
      - Поиск ближайших объектов по точке, радиусу и топ-N
      - Поддержка широты/долготы, точность и скорость ответа
      - Обновление позиций и каталога объектов
    nfr:
      - p99 поиска < 100 мс
      - Точность радиуса и границ
    constraints:
      - Результаты должны быть корректны около границ геохаша
      - Миллионы POI на регион; «горячие» плотности (центр города)
      - Данные частично статичны, частично живые (позиции)
    baseline_load:
      places: 10000000
      queries_per_sec: 30000
      radius_km_default: 5
    topics: [proximity, geohash, s2_cells, grid_index, r_tree, quadtree, spatial_db, redis_geo, spatial_query, precomputed_index, latitude_longitude]
    steps: []
    acceptance_criteria:
      - Выбор пространственного индекса (геохаш/R-tree/S2)
      - Геохаш и его граничные проблемы
      - Гибрид с кэшем и предподсчитанным топ-N
    evolution:
      - id: l1
        name: Полный скан
        summary: Таблица POI с координатами; запрос — фильтр по bounding box и distance.
        diagram: "SQL: WHERE lat BETWEEN .. AND lng BETWEEN .. ORDER BY dist"
        prompts:
          - Почему bbox-скан медленный при миллионах POI?
          - Какой индекс помогает и почему геохаш-префикс лучше простого bbox?
      - id: l2
        name: Геохаш
        summary: Индекс по строке геохаша; ближние ячейки — префиксный поиск плюс соседи.
        diagram: "POI → geohash string → prefix index → query по окрестности"
        prompts:
          - Как выбрать длину префикса геохаша под радиус поиска?
          - Что происходит с объектом на границе двух ячеек?
      - id: l3
        name: S2 / ячейки верхнего уровня
        summary: Иерархическая структура ячеек и предподсчитанные топ-N по клеткам.
        diagram: "S2 tree → окрестные cells → кэш топ-N"
        prompts:
          - В чём преимущество S2 над геохашем по равномерности ячеек?
          - Как построить кэш «горячих» клеток для центра города?
      - id: l4
        name: Масштабирование
        summary: Шардирование индекса по S2-диапазонам, реплики чтения, региональная маршрутизация.
        diagram: "LB → API → шардовые workers по S2-диапазонам → кэш"
        prompts:
          - Как выбрать ключ шардирования, чтобы не было «горячих» ячеек?
          - Как ответить, когда запрос попадает на границу шардов?
    failure_questions:
      - Точка на границе двух геохашей. Как не потерять ближайший объект?
      - Позиция объекта меняется часто. Как поддерживать индекс в актуальности?
      - Запрос ищет в радиусе 50 км на всём городе. Как не делать full-scan?
      - Хот-ячейка заливается запросами. Как кэшировать и не уронить БД?
    advanced_questions:
      - Как комбинировать geohash и репликацию индекса?
      - Как совместить grid/S2 с разными радиусами и плотностями?
      - Как строить локально-распределённый поиск по регионам?

  # ==========================================================================
  # 12. API и GATEWAY
  # ==========================================================================

  - id: api-gateway
    title: "API Gateway"
    level: middle
    category: api
    primary_pattern: gateway-routing
    summary: >
      Единая точка входа: маршрутизация, аутентификация, rate limiting,
      балансировка, трансформация запросов и агрегация.
    requirements:
      - Маршрутизация к сервисам
      - Аутентификация/авторизация на границе
      - Rate limiting и балансировка
    nfr:
      - Простая конфигурация путей
      - Минимальный оверхед gateway
    constraints:
      - Gateway не должен стать single point of failure
      - Трансформация запросов ограничена
    baseline_load:
      requests_per_sec: 500000
      upstream_services: 50
    topics: [routing, authentication, authorization, rate_limiting, load_balancing, request_transformation]
    steps: []
    acceptance_criteria:
      - Маршрутизация и трансформация
      - Аутентификация на границе
      - Rate limiting и HA gateway
    evolution: []
    failure_questions:
      - Gateway упал — все сервисы недоступны. Как обеспечить резервирование?
      - Запрос к CORS с разными origin. Как обрабатывать?
      - Rate limiting на gateway vs сервисе. Как разграничить?
    advanced_questions:
      - Как строить sidecar vs gateway вариант и когда использовать?
      - Как кешировать ответы и защитить нижележащие сервисы?

  - id: authentication-service
    title: "Authentication Service"
    level: middle
    category: api
    primary_pattern: jwt-refresh
    summary: >
      Аутентификация: логин, access/refresh token, JWT, сессии, ротация,
      отзыв и SSO.
    requirements:
      - Регистрация и логин
      - Access/refresh token
      - Отзыв сессий
    nfr:
      - Быстрая проверка токена
      - Компрометация токена минимизируется ротацией
    constraints:
      - Stateless JWT vs server-side session
      - Нужен механизм отзыва
    baseline_load:
      logins_per_sec: 200
      active_tokens: 100000000
    topics: [login, access_token, refresh_token, jwt, session, token_rotation, revocation]
    steps: []
    acceptance_criteria:
      - Формат и срок жизни токенов
      - Ротация refresh
      - Отзыв и logout
    evolution: []
    failure_questions:
      - Refresh token украли. Как ограничить ущерб?
      - Пользователь сменил пароль. Как отозвать все его токены?
      - JWT без revocation лист. Как быстро блокировать компрометированный?
    advanced_questions:
      - Как строить стек SSO (OIDC) поверх auth-сервиса?
      - Как обеспечить zero-trust проверку токенов в микросервисах?

  - id: oauth-system
    title: "OAuth / Authorization Code"
    level: senior
    category: api
    primary_pattern: oauth1-authorization-code
    summary: >
      OAuth-флоу: authorization code, access/refresh token, scopes,
      client credentials и безопасность.
    requirements:
      - Авторизация сторонних приложений
      - Authorization code flow
      - Scopes и ограничение прав
    nfr:
      - Корректная валидация и время жизни токенов
      - Минимальные привилегии (scopes)
    constraints:
      - Нужен PKCE и защита от CSRF/interception
      - Refresh token ротация
    baseline_load:
      auth_requests_per_sec: 300
      clients: 10000
    topics: [authorization_code, access_token, refresh_token, scopes, client_credentials]
    steps: []
    acceptance_criteria:
      - Authorization code flow
      - Scopes и их выдача
      - Безопасность (PKCE, ротация)
    evolution: []
    failure_questions:
      - Клиент получил authorization code дважды? Как защититься от replay?
      - Токен истёк во время запроса. Как обновить прозрачно?
      - Мини-скоп забыли удалить. Как вести аудит выданных токенов?
    advanced_questions:
      - Как строить RFC 6749 и OIDC-совместимый сервер с PKCE?

  - id: session-management
    title: "Session Management"
    level: middle
    category: api
    primary_pattern: server-session-redis
    summary: >
      Управление сессиями: server-side сессии, Redis, sticky sessions,
      stateless JWT, истечение и масштабирование.
    requirements:
      - Хранение состояния сессии
      - Проверка авторизации на каждом запросе
      - Масштабируемость и истечение
    nfr:
      - Истёкшие сессии автоматически удаляются
      - Любой API-инстанс может проверить сессию
    constraints:
      - Несколько инстансов не должны держать session в памяти
      - Stateless JWT vs server-side tradeoff
    baseline_load:
      active_sessions: 50000000
      auth_checks_per_sec: 100000
    topics: [server_side_sessions, redis, sticky_sessions, stateless_jwt, token_expiration]
    steps: []
    acceptance_criteria:
      - Хранение сессий в общем хранилище
      - Stateless vs stateful
      - Истечение и отзыв
    evolution: []
    failure_questions:
      - Redis с сессиями упал. Все пользователи разлогинены?
      - Sticky sessions мешают балансировке. Как уйти в stateless?
      - Пользователь на двух устройствах. Как управлять независимыми сессиями?
    advanced_questions:
      - Как строить взвешенный компромисс между JWT-stateless и server-side sessions?

  - id: multi-tenant-saas
    title: "Multi-Tenant SaaS"
    level: senior
    category: api
    primary_pattern: tenant-isolation
    summary: >
      Мультиарендный SaaS: изоляция тенантов (db/schema/shared), тенант-aware
      кэш, квоты и rate limits.
    requirements:
      - Разделение данных между клиентами
