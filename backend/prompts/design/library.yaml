      - Тенанты разного масштаба
    baseline_load:
      tenants: 100000
      max_tenant_size_gb: 100
    topics: [tenant_isolation, database_per_tenant, schema_per_tenant, shared_database, tenant_aware_caching, quotas, rate_limits]
    steps: []
    acceptance_criteria:
      - Модели изоляции и их tradeoff
      - Тенант-aware кэш и квоты
      - Масштабирование тенантов
    evolution: []
    failure_questions:
      - Один тенант генерит запросы в 100 раз больше остальных. Как изолировать?
      - Переехать с shared DB на DB-per-tenant. Как мигрировать?
      - Кэш не учитывает тенанта, утечка данных. Как защититься?
    advanced_questions:
      - Как автоматически мигрировать тенант между схемами по размеру?

  # ==========================================================================
  # 13. НАДЁЖНОСТЬ И ОТКАЗОУСТОЙЧИВОСТЬ
  # ==========================================================================

  - id: high-availability-api
    title: "Highly Available API"
    level: middle
    category: reliability
    primary_pattern: failover-healthcheck
    summary: >
      Отказоустойчивый API: несколько инстансов, балансировщик, health checks,
      реплики и failover.
    requirements:
      - Обслуживать запросы при отказе инстанса
      - Автоматическое обнаружение и вывод из ротации
      - Резервирование БД
    nfr:
      - Доступность > 99.9%
      - Автоматическое восстановление
    constraints:
      - Нет single point of failure
      - Health checks должны отличать живого от зависшего
    baseline_load:
      instances: 10
      availability_target: 99.9
    topics: [multiple_instances, load_balancer, health_checks, replicas, failover]
    steps: []
    acceptance_criteria:
      - Балансировка и health checks
      - Репликация БД и failover
      - Graceful shutdown
    evolution: []
    failure_questions:
      - Один API-инстанс перестал отвечать. Как система это обнаружит?
      - Liveness OK, но сервис отдаёт ошибки. Как различить readiness?
      - Primary БД умер. Как переключиться на реплику без простоя?
    advanced_questions:
      - Как строить лидирующий/пассивный failover и рулонные обновления?

  - id: multi-region-app
    title: "Multi-Region Application"
    level: senior
    category: reliability
    primary_pattern: active-active-replication
    summary: >
      Приложение в нескольких регионах: active-active / active-passive,
      geo-маршрутизация, репликация и разрешение конфликтов.
    requirements:
      - Обслуживание клиентов из разных регионов
      - Резервирование на уровне дата-центра
      - Синхронизация данных между регионами
    nfr:
      - Низкая задержка из любого региона
      - DR при потере региона
    constraints:
      - Репликация между регионами асинхронна
      - Конфликты записи нужно разрешать
    baseline_load:
      regions: 3
      write_qps: 20000
      cross_region_lag: 5s
    topics: [active_active, active_passive, geo_routing, replication, conflict_resolution, disaster_recovery]
    steps: []
    acceptance_criteria:
      - Модель активных/пассивных регионов
      - Репликация и конфликт-резолюция
      - DR-план
    evolution: []
    failure_questions:
      - Запись сделана в регион A, прочитана в B с лагом. Как объяснить пользователю?
      - В двух регионах обновили одну строку. Как слить без потерь (LWW/vector clock)?
      - Регион A целиком недоступен. Как переключить трафик без потери записи?
    advanced_questions:
      - Как строить глобальную маршрутизацию (GeoDNS/Anycast) с балансом?

  - id: disaster-recovery
    title: "Disaster Recovery"
    level: senior
    category: reliability
    primary_pattern: rpo-rto
    summary: >
      План восстановления: бэкапы, репликация, RPO/RTO, failover и restore,
      регулярные учения.
    requirements:
      - Бэкап и восстановление данных
      - Определение RPO/RTO
      - Переключение на резервный центр
    nfr:
      - RTO в пределах целевого времени
      - RPO в пределах целевой потери данных
    constraints:
      - Бэкапы регулярные и проверяемые
      - Восстановление отработано на учениях
    baseline_load:
      data_tb: 50
      target_rto_min: 60
      target_rpo_min: 15
    topics: [backup, replication, rpo, rto, failover, restore]
    steps: []
    acceptance_criteria:
      - Стратегия бэкапов и репликации
      - Метрики RPO/RTO
      - План failover и учений
    evolution: []
    failure_questions:
      - Основной центр сгорел. Как уложиться в RTO?
      - Бэкап повреждён. Как проверить восстанавливаемость заранее?
      - Данные между бэкапами потеряны (RPO). Как минимизировать?
    advanced_questions:
      - Как строить пилотируемые упражнения (chaos drill) без остановки проды?

  - id: global-app
    title: "Global Application"
    level: senior
    category: reliability
    primary_pattern: cdn-geo-regions
    summary: >
      Сервис для пользователей Европы, США и Азии: CDN, geo DNS, регионы,
      репликация, локальность данных и failover.
    requirements:
      - Низкая задержка для всех регионов
      - Локальность данных (регуляторика)
      - Отказ региона не роняет остальных
    nfr:
      - p95 < 100 мс из любого региона
      - Доступность > 99.95%
    constraints:
      - Данные могут требовать проживания в конкретном регионе
      - Глобальная репликация дорога
    baseline_load:
      regions: 4
      traffic_share: {eu: 40, us: 40, asia: 20}
    topics: [cdn, geo_dns, regions, replication, data_locality, failover]
    steps: []
    acceptance_criteria:
      - Маршрутизация по регионам и CDN
      - Репликация и локальность
      - Глобальный failover
    evolution: []
    failure_questions:
      - Азиатский узел CDN сбоит. Трафик пошёл в США. Что с задержкой?
      - GDPR требует хранить данные ЕС в ЕС. Как разделить?
      - Вся зона AWS us-east-1 легла. Как пережить всем мировым трафиком?
    advanced_questions:
      - Как строить мультирегиональную консистентность и локальный шардинг?

  - id: chaos-engineering
    title: "Chaos Engineering"
    level: senior
    category: reliability
    primary_pattern: fault-injection
    summary: >
      Сознательное внесение отказов: падение сервисов/БД, network partition,
      сбой Redis/Kafka, latency spike и packet loss, чтобы проверить устойчивость.
    requirements:
      - Эксперименты по внесению отказов
      - Отслеживание SLO во время эксперимента
      - Автоматическая изоляция ущерба
    nfr:
      - Эксперименты не роняют прод целиком
      - Быстрый откат
    constraints:
      - Нужен мониторинг и автоматические митигации
      - Эксперименты в проде контролируются
    baseline_load:
      experiments_per_month: 20
      blast_radius_min: 5
    topics: [chaos, fault_injection, network_partition, latency_spike, packet_loss, fallback]
    steps: []
    acceptance_criteria:
      - План chaos-экспериментов
      - Метрики/алерты для детектирования
      - Митигации и откат
    evolution: []
    failure_questions:
      - Внесли 30% packet loss к сервису X. Что должно сработать?
      - Полезная нагрузка (chaos) сама сломала мониторинг. Как избежать?
      - Как гарантировать, что эксперимент в проде не превратится в реальную аварию?
    advanced_questions:
      - Как строить гейко (Gremlin/Litmus) с фазой «пристрелки» и валидацией SLO?

  # ==========================================================================
  # 14. CONSISTENCY И CAP
  # ==========================================================================

  - id: consistency-cap
    title: "Consistency & CAP (теория)"
    level: senior
    category: consistency
    primary_pattern: cap-pacelc
    summary: >
      Фундаментальные основы: strong vs eventual consistency, CAP, PACELC,
      репликация и разрешение конфликтов (vector clocks, logical timestamps).
    requirements:
      - Понимание моделей консистентности
      - CAP и PACELC классификация
      - Выбор компромиссов под конкретный сервис
    nfr:
      - Осознанный выбор C/A/P под нагрузку
      - Понимание последствий
    constraints:
      - Нет бесплатных сильной консистентности и доступности одновременно
      - Компромиссы явные
    baseline_load:
      variety_cases: true
    topics: [strong_consistency, eventual_consistency, cap, pacelc, replication, conflict_resolution, vector_clocks, lamport_clocks, network_partition, split_brain, consensus, raft, paxos]
    steps: []
    acceptance_criteria:
      - Объяснение CAP и PACELC на примерах
      - Vector/Lamport clocks и конфликт-резолюция
      - Понимание split brain и консенсуса
    evolution: []
    failure_questions:
      - Network partition произошла. Что выбираете: доступность или консистентность?
      - Как vector clock определяет причинность между двумя записями?
      - Приводит ли quorum без строгого выбора к stale reads? Как R+W>N помогает?
    advanced_questions:
      - Как отличить logical timestamp от real time и их роли?
      - Почему Raft даёт линейную консистентность, а Dyanmo - нет?

  # ==========================================================================
  # 15. OBSERVABILITY
  # ==========================================================================

  - id: logging-system
    title: "Centralized Logging"
    level: middle
    category: observability
    primary_pattern: log-aggregation
    summary: >
      Централизованный сбор логов: Fluent Bit, Kafka, Elasticsearch, retention
      и индексация.
    requirements:
      - Сбор логов со всех сервисов
      - Размер неограниченного объёма
      - Поиск и retention
    nfr:
      - Задержка индексации < 30 с
      - Поиск по логу быстрый
    constraints:
      - Объём логов огромный и varied
      - Retention ограничен бюджетом
    baseline_load:
      log_volume_gb_per_day: 5000
      services: 100
    topics: [centralized_logging, fluent_bit, kafka, elasticsearch, retention, indexing]
    steps: []
    acceptance_criteria:
      - Пайплайн сбора и буферизации
      - Индексация и retention
      - Correlation ID между сервисами
    evolution: []
    failure_questions:
      - Один сервис заваливает логами Kafka. Как шаперонировать?
      - Много дубликатов логов. Как дедуплицировать?
      - Как строить дешевый холодный сторадж старых логов?
    advanced_questions:
      - Как строить подсистему трассировочных и структурированных логов?

  - id: metrics-system
    title: "Metrics System (Prometheus-like)"
    level: middle
    category: observability
    primary_pattern: time-series
    summary: >
      Система метрик: counters, gauges, histograms, счётчики по тагам, сбор
      через Pull, хранение временных рядов (TSDB), агрегация, даунсэмплинг
      и интеграция с алертами.
    requirements:
      - Метрики разных типов (counters/gauges/histograms)
      - Сбор и хранение временных рядов по меткам
      - Запросы агрегации и дашборды
      - Экспорт алертов по правилам
    nfr:
      - Масштабируемое хранение рядов
      - Быстрые запросы даже с даунсэмплингом
    constraints:
      - Кардинальность метрик ограничена (лавина серий)
      - Pull-сбор требует target discovery
      - Нужны и сырые данные, и долгоживущая гранулярность
    baseline_load:
      series: 10000000
      samples_per_sec: 1000000
      retention_days: 30
    topics: [counters, gauges, histograms, prometheus, aggregation, time_series_db, labels, cardinality, target_discovery, downsampling, retention]
    steps: []
    acceptance_criteria:
      - Типы метрик: когда какой (counters/gauge/histogram/summary)
      - Сбор (pull/push), хранение и шардирование рядов
      - Запросы, cardinality и политика retention
    evolution:
      - id: l1
        name: Сбор из приложений
        summary: Приложение шлёт метрики прямо в сервис (push) или сервис опрашивает (pull).
        diagram: "App → Metrics pipeline (push) / Metrics → App (pull)"
        prompts:
          - Чем pull отличается от push и где что удобнее?
          - Как устроены счетчики в приложении (экспорт, буферизация)?
      - id: l2
        name: Хранение TSDB
        summary: Временные ряды хранятся с индексом по меткам; запросы агрегируют.
        diagram: "Samples → TSDB (labels → series) → Queries"
        prompts:
          - Как устроено хранение: чанки, индекс, блоки? Что такое series-алог?
          - Почему cardinality критична (память, saмple-rate, компакция)?
      - id: l3
        name: Шардирование и даунсэмплинг
        summary: Горизонтальное шардирование по рядам/времени и снижение гранулярности старых данных.
        diagram: "Shards (по времени/меткам) → агрегация → старые ряды downsampled"
        prompts:
          - Как шардировать метрики, чтобы запросы «весь кластер» работали быстро?
          - Как хранить «молодые» ряды детально, а «старые» — даунсэмплированными?
      - id: l4
        name: Алерты и наблюдаемость
        summary: Правила алертов по агрегатам; интеграция с метриками сервиса.
        diagram: "метрики → alert rules → уведомления"
        prompts:
          - Как избежать шумных алертов (дедупликация, троттлинг)?
          - Какие SLO на само хранилище метрик вы бы задали?
    failure_questions:
      - Кардинальность метрик выросла и заняла все ресурсы. Что делать?
      - Прометей не видит новый под (service discovery). Как строить target discovery?
      - Хочется sum по всем подам. Как строить агрегацию без потери гранулярности?
      - Запрос к старым данным тормозит из-за миллиона серий. Как даунсэмплировать?
    advanced_questions:
      - Как строить компактное хранение временных рядов (TSDB) с шардированием?
      - Как совместить долгосрочное хранение и быстрые запросы (сплит hot/cold)?
      - Как строить иерархическую агрегацию (инстанс → кластер → регион)?

  - id: distributed-tracing
    title: "Distributed Tracing"
    level: senior
    category: observability
    primary_pattern: trace-id-context
    summary: >
      Трейсинг: trace ID, span, context propagation, семплинг и анализ
      распределённых задержек.
    requirements:
      - Прослеживание запроса через сервисы
      - Связывание спанов в трассу
      - Семплирование для масштаба
    nfr:
      - Минимальный оверхед на трассировку
      - Пропускная способность трейсов
    constraints:
      - Context propagation через все сервисы и очереди
      - Нельзя трейсить 100% под большой нагрузкой
    baseline_load:
      spans_per_sec: 5000000
      sampling_rate: 0.01
    topics: [trace_id, span, context_propagation, sampling]
    steps: []
    acceptance_criteria:
      - Формат трейса и спанов
      - Сквозная передача context
      - Стратегия семплирования
    evolution: []
    failure_questions:
      - Как передать trace_id через Kafka consumer и дальше?
      - Семплирование дало 1% — как искать редкие ошибки?
      - Оверхед трейсинга вырос. Как снизить?
    advanced_questions:
      - Как строить корреляцию трейсов, логов и метрик в едином стеке?

  - id: alerting-system
    title: "Alerting System"
    level: middle
    category: observability
    primary_pattern: anomaly-detection-dedup
    summary: >
      Система алертов: пороги, детект аномалий, каналы уведомлений,
      дедупликация, группировка и эскалация.
    requirements:
      - Пороговые и аномальные алерты
      - Уведомления в разные каналы
      - Группировка и дедупликация
    nfr:
      - Без спама алертов
      - Важная проблема не теряется
    constraints:
      - Нельзя алертить каждые 30 с по одной проблеме
      - Группировка по инциденту
    baseline_load:
      active_metrics: 1000000
      alerts_per_min: 50
    topics: [thresholds, anomaly_detection, notification_channels, deduplication, alert_grouping]
    steps: []
    acceptance_criteria:
      - Правила порогов и аномалий
      - Дедупликация и группировка
      - Эскалация
    evolution:
      - id: l1
        name: Пороги на метриках
        summary: Правила вида «метрика > порог» на сырых метриках; алерт шлётся при срабатывании.
        diagram: "метрика → правило порога → алерт"
        prompts:
          - Почему фиксированный порог ломается при росте нагрузки?
          - Как избежать срабатывания на разовых всплесках (возврат к норме)?
      - id: l2
        name: Аномалии и идемпотентность
        summary: Статистическое определение «нормы»; алерт об одном инциденте шлётся один раз.
        diagram: "метрика → baseline/аномалия → дедупликация → алерт"
        prompts:
          - Как отличить анемию базовой линии от реальной проблемы?
          - Как дедуплицировать повторные срабатывания по одному инциденту?
      - id: l3
        name: Группировка и эскалация
        summary: Группировка по инциденту, каналы уведомлений, эскалация по давности.
        diagram: "алерты → группировка в инцидент → каналы → эскалация"
        prompts:
          - Как группировать алерты одной проблемы в один инцидент?
          - Как строить эскалацию, если инцидент не закрыт вовремя?
      - id: l4
        name: Масштаб и самоконтроль
        summary: Алерты из правила по самим компонентам; SLO и надёжность самого алертинга.
        diagram: "метрики → правила → уведомления; алертинги на алертинг"
        prompts:
          - Какие метрики здоровья у самого алертинга?
          - Как не потерять критичный алерт при падении канала уведомлений?
    failure_questions:
      - Многодневный негативный тренд, а порога нет. Как детектить аномалию?
      - 100 алертов об одной проблеме. Как сгруппировать в один инцидент?
      - Канал уведомлений упал. Как не потерять критичный алерт?
    advanced_questions:
      - Как строить самоконтроль системы алертинга (alert on alerting system down)?
      - Как комбинировать пороги и machine-learning детект аномалий?
      - Как строить SLA/SLO-based алерты вместо чистых порогов?

  # ==========================================================================
  # 16. CDN И CONTENT DELIVERY
  # ==========================================================================

  - id: cdn-architecture
    title: "CDN Architecture"
    level: middle
    category: cdn
    primary_pattern: edge-origin-cache
    summary: >
      CDN: edge серверы, origin, кэш, TTL, инвалидация и cache warming.
    requirements:
      - Раздача статики с edge
      - Кэш и инвалидация
      - Обработка промахов и warm-up
    nfr:
      - p95 TTFB < 50 мс
      - Высокий cache hit
    constraints:
      - TTL и инвалидация влияют на свежесть
      - Холодный кэш надо прогревать
    baseline_load:
      edge_pop: 200
      hits_per_sec: 1000000
    topics: [edge_servers, origin, cache, ttl, invalidation, cache_warming]
    steps: []
    acceptance_criteria:
      - Структура edge/региональных/origin слоёв
      - TTL и инвалидация
      - Cache warming под события
    evolution: []
    failure_questions:
      - Mass-инвалидация обрушила origin. Как ограничить?
      - Контент изменился, а CDN отдаёт старое. Как ускорить?
      - Пре-прожариваем контент под событие. Как прогревать корректно?
    advanced_questions:
      - Как строить purge-сеть и валидацию до push в edge?

  - id: video-cdn
    title: "Video CDN"
    level: senior
    category: cdn
    primary_pattern: chunked-edge-cdn
    summary: >
      Раздача видео через CDN: чанкованные сегменты, adaptive bitrate,
      горячо-кэшируемые сегменты и экономия бюджета.
    requirements:
      - Раздача сегментов HLS/DASH
      - Адаптивный битрейт
      - Хот-кэширование популярных видео
    nfr:
      - Старт воспроизведения < 3 c
      - Высокая доступность раздачи
    constraints:
      - Трафик видео огромный, CDN дорог
      - Нельзя кэшировать всё
    baseline_load:
      plays_per_sec: 50000
      segments_per_video: 500
    topics: [chunked_cdn, abr, edge, hot_cache, origin]
    steps: []
    acceptance_criteria:
      - Кэширование сегментов
      - Адаптивный битрейт/селекция качества
      - Стратегия cold vs hot
    evolution: []
    failure_questions:
      - Огромный спрос на сегмент у одного edge. Как не перегрузить origin?
      - Пользователь переключает качество. Как кэш сегментов реагирует?
      - Бюджет CDN горит. Как снизить стоимость без ухудшения UX?
    advanced_questions:
      - Как строить предсказание популярности и prefetch сегментов?

  - id: static-cdn
    title: "Static Assets CDN"
    level: junior
    category: cdn
    primary_pattern: hash-naming-cache
    summary: Раздача статики (JS/CSS/картинок) через CDN с hash-naming, долгим TTL и инвалидацией.
    requirements:
      - Раздача статики с edge
      - Бесконфликтное обновление версий
      - Минимальный hit-origin-miss
    nfr:
      - p95 TTFB < 50 мс
      - Cache hit rate высокий
    constraints:
      - Имя файла содержит хэш контента -> immutable TTL
      - Инвалидация почти не требуется при hash-naming
    baseline_load:
      assets_per_sec: 500000
      cache_ttl_days: 365
    topics: [cdn, hash_naming, cache, ttl, static]
    steps: []
    acceptance_criteria:
      - Hash-naming для immutable кэша
      - Стратегия инвалидации
      - Edge/origin структура
    evolution:
      - id: l1
        name: Базовый CDN
        summary: Отдаём статику с edge; origin держит исходные файлы.
        diagram: "Client → CDN Edge → Origin"
        prompts:
          - Что хранится на edge, что на origin?
          - Какой TTL для скомпиленных ассетов?
    failure_questions:
      - Релиз прошёл, но браузеры кэшируют старую версию. Как hash-naming решает?
      - Origin упал, а CDN-кэш горячий. Продолжаем раздавать?
      - HTML не должен кэшироваться долго, а статика да. Как развести TTL?
    advanced_questions:
      - Как строить client-hint кэширование и предзагрузку критического CSS?

  - id: image-cdn
    title: "Image CDN"
    level: middle
    category: cdn
    primary_pattern: on-the-fly-optimization
    summary: >
      CDN для изображений: on-the-fly ресайз/конвертация на edge, кэш
      вариантов, WebP/AVIF и сигнатурные URL.
    requirements:
      - Запрос изображения с параметрами (ширина, формат)
      - Кэш сгенерированных вариантов
      - Авто-выбор лучшего формата для браузера
    nfr:
      - Генерация варианта на лету за миллисекунды
      - Высокий hit rate вариантов
    constraints:
      - Один оригинал -> множество вариантов
      - Нужен whitelist параметров от злоупотреблений
    baseline_load:
      image_requests_per_sec: 300000
      variants_per_orig: 8
    topics: [cdn, image_processing, webp, avif, cache, signature_url]
    steps: []
    acceptance_criteria:
      - On-the-fly оптимизация и параметры
      - Кэширование вариантов
      - Защита от перегрузки origin
    evolution: []
    failure_questions:
      - Злоумышленник шлёт вариации размеров бесконечно. Как защититься?
      - Edge генерит варианты и забивает CPU. Как ограничить?
      - Оригинал обновился, варианты протухли. Как инвалидировать все ресайзы?
    advanced_questions:
      - Как строить сигнатуру URL и allowlist параметров трансформации?

  - id: global-content-delivery
    title: "Global Content Delivery"
    level: senior
    category: cdn
    primary_pattern: multi-tier-origin
    summary: >
      Глобальная раздача контента: multi-tier кэш (edge -> regional -> origin),
      GeoDNS/Anycast, мультирегиональность и reduce origin load.
    requirements:
      - Обслуживание трафика из всех регионов
      - Многоуровневый кэш
      - Минимизация нагрузки на origin
    nfr:
      - TTFB близко к нулю глобально
      - Origin-нагрузка минимальна
    constraints:
      - Multi-tier cache инвалидация сложнее
      - Бюджет CDN ограничен
    baseline_load:
      regions: 8
      tier_capacity_x: 100
    topics: [multi_tier_cache, geopdns, anycast, edge, regional, origin, load_reduction]
    steps: []
    acceptance_criteria:
      - Иерархия кэша edge->regional->origin
      - Маршрутизация трафика
      - Инвалидация и warm-up
    evolution: []
    failure_questions:
      - Популярный контент раздул regional-кэш. Как сбалансировать tier-ы?
      - GeoDNS сместил трафик на перегруженный регион. Как перераспределить?
      - Полная инвалидация по всему миру. Как не обрушить origin?
    advanced_questions:
      - Как строить capacity planning для вундеркинда вирусного контента?

  # ==========================================================================
  # 17. SECURITY
