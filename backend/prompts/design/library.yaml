    evolution: []
    failure_questions:
      - Событие пришло поздно (late). Как корректировать агрегат?
      - Окно огромное, ключей много. Как шардировать агрегацию?
      - Дубль события. Как дедуплицировать до агрегации?
    advanced_questions:
