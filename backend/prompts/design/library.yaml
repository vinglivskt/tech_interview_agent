    evolution: []
    failure_questions:
      - Два юзера одновременно вставили текст в одну позицию. Как согласовать?
      - Операция потеряна из-за ретрая. Как откатить/переслать?
      - Сетевой лаг высокий. Как сохранить UX при OT?
    advanced_questions:
      - Почему OT требует центральный сервер, а CRDT позволяет P2P?

  - id: slack-like
    title: "Slack-like Messaging"
    level: senior
    category: realworld
    primary_pattern: channels-realtime
    summary: >
      Рабочий мессенджер: каналы, приватные/групповые чаты, real-time доставка,
      поиск по истории, интеграции и push.
    requirements:
      - Каналы и DM
      - Доставка в реальном времени
      - Поиск по истории и интеграции
    nfr:
      - Задержка доставки < 300 мс
      - Поиск по многолетней истории
    constraints:
      - Каналы могут иметь тысячи участников
      - Интеграции ботов и webhook
    baseline_load:
      users: 100000000
      messages_per_sec: 50000
      history_retention_years: 10
    topics: [channels, realtime, search, history, integrations, push]
    steps: []
    acceptance_criteria:
      - Доставка сообщений в канал
      - Поиск по истории
      - Интеграции и вебхуки
    evolution: []
    failure_questions:
      - Канал с 10k участников, сообщение должно дойти всем. Как fan-out?
      - Поиск по старым сообщениям медленен. Как индексировать?
      - Бот шлёт огромный поток сообщений. Как rate limit-ить?
    advanced_questions:
      - Как строить суммаризацию канала и inbox для каждого юзера?

  - id: amzn-ecommerce
    title: "Amazon-like E-commerce"
    level: senior
    category: realworld
    primary_pattern: full-ecommerce-stack
    summary: >
      Полный e-commerce стек: каталог, корзина, заказы, платежи, склад,
      доставка, рекомендации, поиск в одном масштабе.
    requirements:
      - Каталог и поиск товаров
      - Корзина, заказ, оплата, склад
      - Рекомендации и персонализация
    nfr:
      - Маленькая задержка всех ключевых операций
      - Надёжность и масштабируемость
    constraints:
      - Каждый домен развивается независимо
      - Платежи и склад строго консистентны
    baseline_load:
      sku: 500000000
      orders_per_day: 1000000
      search_qps: 30000
    topics: [catalog, cart, order, payment, inventory, recommendations, search]
    steps: []
    acceptance_criteria:
      - Архитектура доменов
      - Сквозной флоу заказа+оплаты+склада
      - Поиск и рекомендации
    evolution: []
    failure_questions:
      - Как деградировать по частям, если поиск упал, а остальное живо?
      - Рекомендации перегрузили каталог? Как изолировать домены?
      - Платёж завис, склад зарезервировал товар. Как таймаутить резерв?
    advanced_questions:
      - Как строить событийную связку доменов и компенсации?

  - id: github-like
    title: "GitHub-like Platform"
    level: senior
    category: realworld
    primary_pattern: git-hosting-ci
    summary: >
      Платформа для кода: хостинг репозиториев, PR, CI/CD, поиск кода,
      issues и микро-сервисы вокруг git.
    requirements:
      - Хранение и коллаборация репозиториев
      - Pull requests и ревью
      - CI/CD пайплайны
    nfr:
      - Быстрый clone/push крупных репозиториев
      - Масштабируемый поиск кода
    constraints:
      - Git push/merge сложно консистентны
      - CI-очередь огромная
    baseline_load:
      repos: 400000000
      pushes_per_sec: 5000
      ci_jobs_per_min: 20000
    topics: [git, pr, ci_cd, code_search, issues, microservices]
    steps: []
    acceptance_criteria:
      - Хранение git-объектов и push flow
      - Управление PR/merge
      - CI/CD и код-поиск
    evolution: []
    failure_questions:
      - Крупный репозиторий клонируется медленно. Как ускорить (GIT LFS, partial clone)?
      - Merge PR конфликтует автоматически. Как строить merge queue?
      - Поиск кода по всему репозиторию медленный. Как индексировать?
    advanced_questions:
      - Как строить масштабируемый git-сервер (shards by repo) и CI-оркестрацию?

  - id: stackoverflow-like
    title: "Stack Overflow-like Q&A"
    level: middle
    category: realworld
    primary_pattern: qa-voting-search
    summary: >
      Платформа вопросов и ответов: вопросы, ответы, голосование, принятые
      ответы, поиск и рейтинги.
    requirements:
      - Задание/ответы и голосование
      - Принятый ответ и рейтинг
      - Поиск по тегам и тексту
    nfr:
      - Быстрый поиск
      - Чтение преобладает над записью
    constraints:
      - Голосование ограничено репутацией
      - Поиск по тегам
    baseline_load:
      questions: 30000000
      qps_read: 500000
    topics: [qa, voting, search, reputation, tags, caching]
    steps: []
    acceptance_criteria:
      - Модель вопросов/ответов/голосования
      - Репутация и модерация
      - Поиск и кэш
    evolution: []
    failure_questions:
      - Огромный вопрос с сотнями ответов. Как пейджить и ранжировать ответы?
      - Голосование конкурентно. Как предотвратить накрутку?
      - Поиск по тегам и тексту одновременно. Как индексировать?
    advanced_questions:
      - Как строить репутационные правила и детект злоупотреблений?

  # ==========================================================================
  # 19. ПАТТЕРН-ЗАДАЧИ
  # ==========================================================================

  - id: pattern-id-generation
    title: "Паттерн: ID Generation"
    level: junior
    category: pattern
    primary_pattern: id-generation
    summary: >
      Узкий кейс на генерацию идентификаторов: последовательные, UUID, Snowflake,
      коллизии, упорядоченность, масштаб.
    requirements:
      - Генерация уникальных ID без коллизий
      - Масштабируемость (миллионы/сек)
      - Приблизительная временная упорядоченность
    nfr:
      - ID не зависят от единой БД
      - Переживают распределение нод
    constraints:
      - Запрет автогенерации одной БД
      - Порядок приблизительный
    baseline_load:
      ids_per_sec: 1000000
      nodes: 500
    topics: [id, uuid, snowflake, auto_increment, sequence]
    steps: []
    acceptance_criteria:
      - Сравнение подходов
      - Формат Snowflake
      - Обработка clock drift
    evolution: []
    failure_questions:
      - Нода «поехала» по часам. Как не сломать уникальность ID?
      - Нужна упорядоченность ID для индексов. Какой вариант выбрать?
      - Как создать ID в офлайн-режиме без сервера?
    advanced_questions:
      - Как встроить регион/тип в ID для роутинга?

  - id: pattern-fanout
    title: "Паттерн: Fan-out"
    level: middle
    category: pattern
    primary_pattern: fan-out
    summary: >
      Узкий кейс: распространение одного события многим подписчикам — fan-out
      on write/read/hybrid, celebrity problem.
    requirements:
      - Доставка события множеству потребителей
      - Управление нагрузкой при массовом фан-ауте
    nfr:
      - Свежесть у всех подписчиков
      - Экономичность
    constraints:
      - Некоторые подписчики «звезды» с миллионами фанов
      - Eventual consistency допустима
    baseline_load:
      fanout_peak: 100000000
      latency_target_ms: 300
    topics: [fan_out, celebrity, write, read, hybrid]
    steps: []
    acceptance_criteria:
      - Сравнение стратегий fan-out
      - Решение celebrity
      - Гигиена данных лент
    evolution: []
    failure_questions:
      - Одно событие фан-аута на 100 млн подписчиков. Как не уронить?
      - Подписка появилась после события. Как догнать историю?
      - Как решить, кому on write, а кому pull?
    advanced_questions:
      - Как строить статистику доставки fan-out из Kafka?

  - id: pattern-idempotency
    title: "Паттерн: Idempotency"
    level: middle
    category: pattern
    primary_pattern: idempotency
    summary: >
      Узкий кейс: защита от повторных операций — идемпотентные ключи,
      дедупликация, повторная доставка в банках/заказах.
    requirements:
      - Повторный запрос не даёт второй эффект
      - Хранение результатов операций
    nfr:
      - Дубликаты невозможны побочно
      - Прозрачность для клиента
    constraints:
      - Каналы могут дублировать запросы
      - Нужно возвращать одинаковый результат повторно
    baseline_load:
      ops_per_sec: 5000
      dedup_ttl_days: 30
    topics: [idempotency, deduplication, retry, duplicate]
    steps: []
    acceptance_criteria:
      - Где брать идемпотентный ключ
      - Хранение и конфликты
      - Повторный ответ клиенту
    evolution: []
    failure_questions:
      - Дубль запроса попал в два инстанса. Как гарантировать?
      - Запись операции потеряна, и дубль прошёл. Как защититься?
      - Как долго хранить ключи для дедупликации?
    advanced_questions:
      - Как строить распределённую дедупликацию с гарантией на уровне DB уникальности?

  - id: pattern-saga
    title: "Паттерн: Saga"
    level: senior
    category: pattern
    primary_pattern: saga
    summary: >
      Узкий кейс на распределённую транзакцию сагой с компенсациями.
    requirements:
      - Выполнение процесса через несколько сервисов
      - Компенсации при сбое
    nfr:
      - Отказ шага компенсируется автоматически
      - Нет долгой блокировки
    constraints:
      - No ACID между сервисами
      - Компенсации идемпотентны
    baseline_load:
      sagas_per_sec: 300
    topics: [saga, compensation, orchestration, choreography]
    steps: []
    acceptance_criteria:
      - Концепция компенсации
      - Оркестрация vs хореография
      - Обработка отказа и DLQ
    evolution: []
    failure_questions:
      - Компенсация сама не удалась. Что дальше (DLQ, повтор)?
      - Дубль компенсации. Как сделать идемпотентной?
      - Как долго сага «висит» между шагами при недоступности сервиса?
    advanced_questions:
      - Как строить долгоживущую оркестрируемую сагу с контрольными точками?

  - id: pattern-outbox
    title: "Паттерн: Transactional Outbox"
    level: senior
    category: pattern
    primary_pattern: outbox
    summary: >
      Надёжная публикация событий из транзакции БД атомарно.
    requirements:
      - Событие и бизнес-запись атомарны
      - Публикация в брокер гарантирована
    nfr:
      - Отсутствие потерь и дублей
      - Малый лаг публикации
    constraints:
      - Реле публикует из outbox
      - Потребители идемпотентны
    baseline_load:
      events_per_sec: 10000
    topics: [outbox, cdc, atomicity, broker]
    steps: []
    acceptance_criteria:
      - Атомарность записи
      - Реле (CDC/воркер) публикации
      - Идемпотентность потребителя
    evolution: []
    failure_questions:
      - Реле упало. Как догнать by по времени (ordering)?
      - Как избежать публикации некоммитнутых событий?
      - Две записи в outbox одного ID. Бах?
    advanced_questions:
      - CDC по binlog vs поллинг outbox: задержки и надёжность?

  - id: pattern-snowflake
    title: "Паттерн: Snowflake ID"
    level: middle
    category: pattern
    primary_pattern: snowflake
    summary: >
      Генерация упорядоченных уникальных ID форматом Snowflake с 64-бит.
    requirements:
      - 64-бит ID с временной упорядоченностью
      - Масштабирование по worker id
    nfr:
      - Миллионы ID/сек
      - Устойчивость к clock drift
    constraints:
      - Битовая раскладка строгая
      - worker id ограничен
    baseline_load:
      ids_per_sec: 1000000
      worker_bits: 10
    topics: [snowflake, timestamp, sequence, worker, bits]
    steps: []
    acceptance_criteria:
      - Раскладка 64 бит
      - Обработка переполнения sequence
      - Drift gestion
    evolution: []
    failure_questions:
      - Sequence переполняется за мс. Как поступить?
      - Часы назад. Дубликат?
      - Окончание эпохи. Как менять?
    advanced_questions:
      - Как использовать ID для роутинга на шард?

  - id: pattern-inverted-index
    title: "Паттерн: Inverted Index"
    level: middle
    category: pattern
    primary_pattern: inverted-index
    summary: >
      Построение поискового inverted index: токенизация, posting lists,
      merge, сжатие и поиск.
    requirements:
      - Индексация документов в term->postings
      - Быстрый поиск по терминам
    nfr:
      - Индекс строится быстро
      - Поиск по многим терминам эффективен
    constraints:
      - Память и сжатие posting
      - Обновление индекса
    baseline_load:
      docs: 1000000000
      terms: 500000000
    topics: [inverted_index, tokenization, posting, compression, merge]
    steps: []
    acceptance_criteria:
      - Структура inverted index
      - Обновление и merge
      - Последовательность поиска
    evolution: []
    failure_questions:
      - Обновление документа не отражается в индексе. Почему?
      - Много лог-ячейка занимает память. Как сжимать posting?
      - Анд-запрос по 10 терминам. Как эффективно пересечь?
    advanced_questions:
      - Как строить phrase search и faceted по inverted index?

  - id: pattern-object-storage
    title: "Паттерн: Object Storage"
    level: middle
    category: pattern
    primary_pattern: object-storage
    summary: >
      Паттерн объектного хранилища: бакеты, ключи, атомарные записи,
      версионирование и CDN.
    requirements:
      - Хранение неструктурированных объектов
      - Атомарная запись/чтение по ключу
      - Версионирование и lifecycle
    nfr:
      - Масштабирование до петабайт
      - Высокая доступность
    constraints:
      - Объекты иммутабельны и крупные
      - Ключ = ид объектного хранилища
    baseline_load:
      objects: 1000000000
      total_pb: 20
    topics: [object_storage, bucket, key, versioning, lifecycle, cdn]
    steps: []
    acceptance_criteria:
      - Модель бакетов и ключей
      - Версионирование и lifecycle
      - Раздача через CDN
    evolution: []
    failure_questions:
      - Ключ переиспользуется для перезаписи. Как с версионированием?
      - Огромный объект заливается долго. Как multipart?
      - Как строить lifecycle-переходы hot->cold->delete?
    advanced_questions:
      - Как строить согласованность списков и точек восстановления?

  - id: pattern-websocket
    title: "Паттерн: WebSocket"
    level: middle
    category: pattern
    primary_pattern: websocket
    summary: >
      Паттерн двусторонней связи в реальном времени через WebSocket: соединения,
      pub/sub, reconnect, backpressure.
    requirements:
      - Поддержка миллиона живых соединений
      - Публикация события подключённым клиентам
    nfr:
      - Низкая задержка доставки
      - Переживание reconnect
    constraints:
      - Соединения удерживаются долго
      - Backpressure при медленном клиенте
    baseline_load:
      concurrent_connections: 1000000
      events_per_sec: 100000
    topics: [websocket, connection_pool, pubsub, reconnect, backpressure]
    steps: []
    acceptance_criteria:
      - Управление соединениями и шардинг
      - Pub/sub маршрутизация
      - Reconnect и последовательность
    evolution: []
    failure_questions:
      - Сервер с соединениями упал. Клиенты потеряны?
      - Медленный клиент блокирует канал. Как применить backpressure?
      - Как маршрутизировать событие конкретному клиенту в кластере?
    advanced_questions:
      - Как строить sticky-роутинг и failover соединений без потери состояния?

  - id: pattern-cache-aside
    title: "Паттерн: Cache-Aside"
    level: junior
    category: pattern
    primary_pattern: cache-aside
    summary: >
      Классический cache-aside: чтение через кэш с провалом на БД, запись
      с инвалидацией/обновлением кэша.
    requirements:
      - Чтение попадает в кэш
      - Промах -> загрузка из БД и заполнение
      - Инвалидация при записи
    nfr:
      - Высокий hit rate
      - Staleness контролируется TTL
    constraints:
      - Нельзя читать устаревшие данные в критичных сценариях
      - Кэш и БД не атомарны
    baseline_load:
      read_qps: 1000000
      hit_rate: 0.95
    topics: [cache, cache_aside, ttl, invalidation, stampede]
    steps: []
    acceptance_criteria:
      - Флоу cache-aside read/write
      - Стратегия TTL/инвалидации
      - Консистентность при записи
    evolution: []
    failure_questions:
      - Запись в БД прошла, но кэш не обновился. Когда устаревшие данные?
      - Множество промахов одновременно -> stampede. Как защититься?
      - Что удалять при апдейте: ключ или обновлять значение?
    advanced_questions:
      - Как строить write-through/write-behind поверх cache-aside?

  - id: pattern-sharding
    title: "Паттерн: Sharding"
    level: senior
    category: pattern
    primary_pattern: sharding
    summary: >
      Горизонтальное партиционирование: выбор shard key, hash/range, hot spot,
      resharding.
    requirements:
      - Распределение данных по шардам
      - Баланс нагрузки
    nfr:
      - Минимум cross-shard
      - Resharding без простоя
    constraints:
      - Shard key фиксирован
      - Глобальная уникальность/индексы проблематичны
    baseline_load:
      shards: 32
      data_tb: 10
    topics: [shard_key, hash, range, hotspot, resharding]
    steps: []
    acceptance_criteria:
      - Выбор shard key
      - Способы шардирования
      - Resharding
    evolution: []
    failure_questions:
      - Неравномерное распределение данных. Как найти hot spot и fix?
      - Пришлось добавить шарды. Как мигрировать без простоя?
      - Запрос по не-shard-ключу. Как спроектировать обход?
    advanced_questions:
      - Как строить lookup-индексы поверх шардов для глобальных запросов?

  - id: pattern-geospatial
    title: "Паттерн: Geospatial Index"
    level: middle
    category: pattern
    primary_pattern: geospatial
    summary: >
      Пространственная индексация: геохаш, R-tree, QuadTree, Redis GEO,
      поиск ближайших.
    requirements:
