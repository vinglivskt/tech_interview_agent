      - Транскодинг задерживается, зрители не видят новый контент. Как приоритизировать?
      - Одновременный всплеск просмотров. Как масштабировать раздачу без потери качества?
    advanced_questions:
      - Как строить рекомендации онлайн и офлайн (batch + real-time)?

  - id: youtube-like
    title: "YouTube-like Video Platform"
    level: senior
    category: realworld
    primary_pattern: upload-transcode-search
    summary: >
      Видеоплатформа: загрузка и обработка видео (транскодинг, адаптивный
      битрейт), поиск, рекомендации, лайки/комменты, CDN-раздача, хот-видео
      через CQRS и аналитика в масштабе.
    requirements:
      - Загрузка и обработка видео (потоки битрейтов)
      - Поиск, рекомендации и «похожие видео»
      - Раздача, комментарии и лайки
      - Аналитика просмотров
    nfr:
      - Загрузка не блокирует просмотр
      - Старт воспроизведения < 3 с (prefetch, сжатые файлы)
      - Быстрый поиск и рекомендации
    constraints:
      - Медиа-обработка и аналитика должны быть асинхронными
      - Огромный каталог и «горячие» видео с пиковыми всплесками
      - Хранение видео дешевле в холодном, а отдача — через CDN
    baseline_load:
      videos: 1000000000
      hourly_views: 100000000
      bitrates: 8
    topics: [upload, transcoding, abr, search, recommendations, cdn, comments, likes, hot_videos, cqrs, analytics, metadata]
    steps: []
    acceptance_criteria:
      - Асинхронная обработка видео (этапы: загрузка → транскод → публикация)
      - Поиск/рекомендации и хот-видео через CQRS/кэш
      - CDN, аналитика и мониторинг просмотров
    evolution:
      - id: l1
        name: Прямая загрузка
        summary: Видео загружается в объектное хранилище, метаданные в БД, отдача напрямую.
        diagram: "Upload → Object storage → Play"
        prompts:
          - Какие проблемы прямого проигрывания (размер, битрейт, сети)?
          - Почему нужно разбить загрузку на части (resumable)?
      - id: l2
        name: Обработка через очередь
        summary: Событие загрузки ставится в очередь; воркеры транскодируют и генерируют битрейты.
        diagram: "Upload → Kafka → transcode workers → разные битрейты → publish"
        prompts:
          - Какие этапы обработки и почему они асинхронные?
          - Как обрабатывать провалы транскодера (ретраи, DLQ)?
      - id: l3
        name: Поиск и рекомендации (CQRS)
        summary: "Отдельные read-модели: индекс поиска, кэш хот-видео, лента рекомендаций."
        diagram: "видео-события → projections (search/hot/feed) → чтение"
        prompts:
          - Почему read-модели нужны отдельно от write-модели (метаданных)?
          - Как кэшировать самые горячие видео, чтобы не бить в БД?
      - id: l4
        name: CDN и аналитика
        summary: Раздача через CDN/edge, аналитика просмотров потоком в отчётность.
        diagram: "Play → CDN → аналитика (Kafka) → витрины"
        prompts:
          - Как прогреть CDN под ожидаемый хайп?
          - Как считать просмотры надёжно (дедупликация, exactly-once)?
      - id: l5
        name: Масштаб и наблюдаемость
        summary: Глобальная маршрутизация, DR, качество стрима (bitrate ladder) под устройства.
        diagram: "Регионы → CDN; мониторинг качества воспроизведения"
        prompts:
          - Как подбирать битрейт под устройство и сеть (ABR)?
          - Какие метрики качества и как строить SLO на воспроизведение?
    failure_questions:
      - Видео заливается часами. Как реализовать resumable и очередь обработки?
      - Поисковый индекс отстал, видео не находится. Как снизить влияние?
      - Аналитик просмотров приходит миллионами. Как считать надёжно и без двойного счёта?
      - Хот-тайтл одновременно смотрели миллионы. Как не уронить инфраструктуру раздачи?
    advanced_questions:
      - Как строить рекомендации и «похожие видео» при огромном каталоге?
      - Как реализовать адаптивный битрейт (ABR/HLS-dash) и выбор сегментов?
      - Как построить CQRS-проекции: синхронизация поиска и хот-кэша без потери свежести?

  - id: spotify-like
    title: "Spotify-like Music Streaming"
