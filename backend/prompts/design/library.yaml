      - Retention/archiving
    evolution: []
    failure_questions:
      - Агрегация по месяцу по гигантскому ряду. Как оптимизировать?
      - Частота сэмплов огромная. Как сжимать (delta-of-delta)?
      - Retention удаляет нужные данные. Как балансировать?
    advanced_questions:
      - Как строить downsampling и гранулярности (raw->5m->1h)?

  - id: pattern-event-streaming
    title: "Паттерн: Event Streaming"
    level: senior
    category: pattern
