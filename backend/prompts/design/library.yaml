      - Авто-освобождение по lease/TTL
    nfr:
      - Block не висит вечно
      - Защита от false ownership
    constraints:
      - Lease истекает
      - Fencing token необходим
    baseline_load:
      locks_per_sec: 1000
    topics: [lock, lease, ttl, fencing_token]
    steps: []
    acceptance_criteria:
      - Механизм lease
      - Fencing token
      - Проблемы Redlock
    evolution: []
    failure_questions:
      - Владелец завис на GC. Block истёк, клиент-продолжение получил право. Как?
      - Сеть разделилась. Два владельца. Как изолировать ущерб?
      - Нужно продлить lease во время долгой работы. Как продлевать атомарно?
    advanced_questions:
      - Как строить fencing token с участием переработанного state store?

  - id: pattern-log-search
    title: "Паттерн: Log Search (append-only + indexing)"
    level: middle
    category: pattern
    primary_pattern: log-index
    summary: >
      Поиск по логам через append-only журнал и индекс (Loki-style).
    requirements:
      - Запись логов append-only
      - Поиск по времени и фильтрам
    nfr:
      - Ингрест волной
      - Быстрый поиск по окну
    constraints:
      - Хранение дешёвое
      - Индексация ограничена (labels/ключи)
    baseline_load:
      logs_per_sec: 2000000
    topics: [logs, append_only, index, retention, ingestion]
    steps: []
    acceptance_criteria:
      - Формат логов и потока
      - Стратегия индексации (label vs full-text)
      - Retention
    evolution: []
    failure_questions:
      - Поиск по телу лога медленный (нет full-text индекса). Как решать?
      - Всплеск логов. Как буферизовать до индекса?
      - Как искать по label без потери гранулярности?
    advanced_questions:
      - Как строить дешёвый log storage с блочным сжатием и query по блокам?

  - id: pattern-leader-election
    title: "Паттерн: Leader Election"
    level: senior
    category: pattern
    primary_pattern: leader-election
    summary: >
      Выбор лидера в кластере для управления общей задачей/блокировкой.
    requirements:
      - Единственный лидер в кластере
      - Автоматическое переизбрание
    nfr:
      - Короткое время выбора
      - Не допускать двух лидеров
    constraints:
      - Split brain опасен
      - Лидер может упасть
    baseline_load:
      nodes: 10
      election_ms: 500
    topics: [leader_election, consensus, raft, heartbeat]
    steps: []
    acceptance_criteria:
      - Механизм выбора лидера
      - Обнаружение отказа лидера
      - Split brain защита
    evolution: []
    failure_questions:
      - Лидер умер молниеносно. Как быстро переизбрать и не потерять работу?
      - Два лидера из-за network partition. Как защититься (quorum)?
      - Кто хранит состояние после переизбрания?
    advanced_questions:
      - Как строить Raft/etcd-подобный consensus для выборов?

  - id: pattern-singleflight
    title: "Паттерн: Single-flight / Cache stampede"
    level: middle
    category: pattern
    primary_pattern: singleflight
    summary: >
      Защита от cache stampede: единый запрос под один ключ при массовом промахе.
    requirements:
      - Многие клиенты просят один ключ при промахе
      - Только один выполняет дорогую загрузку
    nfr:
      - Никогда не дублировать дорогую операцию
      - Клиенты получают результат вовремя
    constraints:
      - Под одновременный промах только один воркер
      - Защита от истёкшего фонового загруза
    baseline_load:
      stampede_scale: 1000
    topics: [singleflight, stampede, cache, mutex]
    steps: []
    acceptance_criteria:
      - Механизм single-flight
      - Пробабилистический TTL
      - Mutex/leader
    evolution: []
    failure_questions:
      - Множество клиентов одновременно промахиваются. Как объединить?
      - Фоновое обновление истекло, все ломятся в БД. Как?
      - Отказ одного дорогого вычисления влияет на всех ждущих. Как вернуть ошибку?
    advanced_questions:
      - Как строить single-flight поверх микросервисов (не в одном процессе)?

  - id: pattern-queue-competing
    title: "Паттерн: Competing Consumers (очередь задач)"
    level: middle
    category: pattern
    primary_pattern: competing-consumers
    summary: >
      Конкурентные потребители одной очереди задач с правильной обработкой.
    requirements:
      - Воркеры берут задачи из общей очереди
      - Каждая задача выполняется одним воркером
    nfr:
      - Высокая пропускная способность
      - Никакой задачи не пропадает
    constraints:
      - Acknowledgement и visibility timeout
      - Ретраи и DLQ
    baseline_load:
      tasks_per_sec: 5000
      workers: 50
    topics: [queue, consumer, ack, visibility, retry, dlq]
    steps: []
    acceptance_criteria:
      - Конкурирующее потребление
      - Ack и timeout
      - Retry/DLQ
    evolution: []
    failure_questions:
      - Воркер упал после взятия задачи. Как задача вернётся?
      - Two consumers взяли одну задачу. Почему это возможно и как не допустить?
      - Одна «плохая» задача зацикливает retry. Как изолировать в DLQ?
    advanced_questions:
      - Как обеспечить приоритет и отложенные задачи поверх очереди?

  - id: pattern-cqrs-read-model
    title: "Паттерн: CQRS / Eventual Consistency"
    level: senior
    category: pattern
    primary_pattern: cqrs
    summary: >
      Разделение read/write моделей и eventual consistency проекций.
    requirements:
      - Write model команд
      - Read model оптимизированная под запросы
    nfr:
      - Чтение/запись масштабируются раздельно
      - Проекции обновляются асинхронно
    constraints:
      - Eventual consistency
      - Необходима перестройка проекций
    baseline_load:
      command_qps: 500
      query_qps: 20000
    topics: [cqrs, read_model, write_model, event, projection]
    steps: []
    acceptance_criteria:
      - Две модели
      - Синхронизация событиями
      - Перестройка проекций
    evolution: []
    failure_questions:
      - Проекция устарела. Пользователь видит старые данные. Как объяснить/SLO?
      - Как перестроить проекцию без простоя?
      - Если событие потеряно, read model расходится. Как восстановить?
    advanced_questions:
      - Как строить идемпотентные обновления проекций на основе потока событий?
