      - Рекомендации строятся офлайн. Как обновлять плейлист пользователя без задержки?
      - Лицензионный трек стал недоступен в регионе. Как мгновенно скрыть везде?
    advanced_questions:
      - Как строить стриминг аудио с низкой задержкой и адаптивным битрейтом?

  - id: dropbox-like
    title: "Dropbox / Google Drive File Sync"
    level: senior
    category: realworld
    primary_pattern: file-sync-versioning
    summary: >
      Облачная файловая синхронизация уровня Dropbox/Google Drive: загрузка,
      кросс-девайс синхронизация, разрешение конфликтов, версионирование,
      блоковая дедупликация и дельты.
    requirements:
      - Синхронизация файлов между устройствами
      - Разрешение конфликтов при офлайн-правках
      - История версий и восстановление
      - Уведомления об изменениях другим клиентам
    nfr:
      - Синхронизация почти в реальном времени
      - Конфликты разрешаются детерминированно
    constraints:
      - Нужна блоковая дедупликация и дельта-передача
      - Множество одновременных редакторов/устройств
      - Ограничение: файлы могут быть очень большими (десятки ГБ)
    baseline_load:
      users: 500000000
      files_total: 10000000000
      sync_events_per_sec: 10000
    topics: [file_sync, dedup, versioning, conflict_resolution, chunking, delta, cdc, metadata, websocket, push]
    steps: []
    acceptance_criteria:
      - Блоковая дедупликация и дельта-синхронизация
      - Версионирование и восстановление
      - Разрешение конфликтов при офлайн-правках
    evolution:
      - id: l1
        name: Полные файлы
        summary: Клиент загружает файл целиком; сервер хранит копию и версию.
        diagram: "Client → Upload whole file → Metadata DB + Blob storage"
        prompts:
          - Какие проблемы: размер файла, расход трафика, скорость синхронизации?
          - Почему при больших файлах нужны части и дельты?
      - id: l2
        name: Блоки и дедупликация
        summary: Файл режется на блоки; дубли блоков выявляются и переиспользуются.
        diagram: "file → блоки (дедупликация по хешу) → облако"
        prompts:
          - Как разбивать файл (фиксированный размер против content-defined chunking)?
          - Как дедуплицировать блоки глобально (счётчик ссылок, GC)?
      - id: l3
        name: Изменения и версии
        summary: Клиент шлёт дельту изменений; сервер накапливает версии ревизий.
        diagram: "delta (изменения) → метаданные ревизии → версия"
        prompts:
          - Как детектировать изменения (mtime, hash, inotify) и передавать только дельту?
          - Как хранить версии, чтобы история была дешёвой (snapshot + deltas)?
      - id: l4
        name: Синхронизация в реалтайме
        summary: Уведомления другим устройствам (WebSocket/push) и детерминированное слияние конфликтов.
        diagram: "изменение → сервер → notify другие устройства → pull/marge"
        prompts:
          - Как устроен канал уведомлений об изменениях?
          - Как разрешать конфликты (последний победитель, ветки, копия)?
          - Как масштабировать sync-события на десятки тысяч/сек?
    failure_questions:
      - Два устройства изменили один файл офлайн. Как разрешить конфликт?
      - Файл на 10 ГБ синхронизируется медленно. Как дельта дедупликации помогает?
      - Один блок файла испорчен. Как восстановить только его?
      - Устройство долго не было онлайном. Как выстроить очередь изменений без потерь?
    advanced_questions:
      - Как строить CRDT/OT-совместимую синхронизацию для документов?
      - Как строить CDC-уведомления и очереди изменений для реалтайм-синхронизации?
      - Как обеспечивать целостность данных между метаданными и блоками (без единой точки)?

