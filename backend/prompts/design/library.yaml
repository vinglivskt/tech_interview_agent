  - id: scaling-fundamentals
    title: "Scaling: от монолита к распределённой системе"
    level: middle
    category: basics
    primary_pattern: lb-replica-shard
    summary: >
      Эволюция масштабирования сервиса: вертикальное -> горизонтальное,
      балансировщик, stateless-приложение, реплики, кэш, шардирование
      и что ломается на каждом этапе.
    requirements:
      - Приём растущей нагрузки без деградации
      - Горизонтальное масштабирование приложений и данных
      - Отказоустойчивость и предсказуемая задержка
    nfr:
      - p95 задержки сохраняется при росте нагрузки x100
      - Доступность 99.99% без единой точки отказа
    constraints:
      - Сначала самые дешёвые меры (вертикаль/реплики/кэш)
      - Шардирование — последний инструмент, он усложняет запросы
    baseline_load:
      dau: 1000000
      qps_growth: 100
      expect_availability_pct: 99.99
    topics: [vertical_scaling, horizontal_scaling, load_balancer, stateless, read_replica, cache, sharding, availability, single_point_of_failure]
    steps: []
    acceptance_criteria:
      - Чёткий порядок мер scale-up -> scale-out
      - Понимание, почему stateless-приложение масштабируется горизонтально
      - Когда реплики/кэш перестают помогать и нужен шардинг
    evolution:
      - id: l1
        name: Одна машина
        summary: "Всё на одном сервере: приложение и БД вместе. Просто, но ограниченно."
        diagram: "Client → Server (app + DB)"
        prompts:
          - Какие ресурсы заканчиваются первыми на одной машине?
          - Когда вертикальное масштабирование перестаёт окупаться?
      - id: l2
        name: Балансировщик + stateless
        summary: Несколько инстансов приложения за балансировщиком; состояние вынесено наружу.
        diagram: "Client → LB → App(xN) → DB"
        prompts:
          - Что надо вынести из приложения, чтобы оно стало stateless?
          - Какой компонент теперь остаётся единственной точкой отказа?
      - id: l3
        name: Реплики БД и кэш
        summary: Read-реплики и кэш разгружают БД от чтений.
        diagram: "Client → LB → App(xN) → (Cache) → PG primary + replicas"
        prompts:
          - Как устроен failover при падении primary?
          - Чем опасен лаг репликации и stale-чтения?
      - id: l4
        name: Шардирование
        summary: Данные партиционируются по ключу (user_id) по шардам.
        diagram: "Client → LB → App(xN) → Shard A / Shard B / Shard C"
        prompts:
          - Как выбрать ключ шардирования и что будет с запросами не по ключу?
          - Как решается проблема «горячего» шарда?
      - id: l5
        name: Мультирегион
        summary: Трафик и данные распределяются по регионам; прорабатываются DR-сценарии.
        diagram: "Region1 (LB+App+DB) <---> Region2 (LB+App+DB)"
        prompts:
          - Что вы пообещаете по RPO/RTO и что переживёт failover?
          - Как прокидывать изменения между регионами и с какой задержкой?
    failure_questions:
      - Primary-база упала. Что произойдёт с приложением в первую секунду и первую минуту?
      - Один инстанс держит транзакцию слишком долго. Что происходит с очередью запросов?
      - Мы добавили кэш, но всё равно много запросов в БД. Как искать причину?
      - Шард стал «горячим» и упирается в CPU. Как смягчить?
    advanced_questions:
      - Как посчитать момент перехода от реплик к шардированию (нагрузка, объём данных, хот-ключи)?
      - Как сбалансировать CAP в конкретном сценарии масштабирования?
      - Как измерять узкое место (мониторинг, профилирование) до принятия решения о масштабировании?

  - id: back-of-envelope-estimation
    title: "Back-of-envelope оценка ёмкости"
    level: middle
    category: basics
    primary_pattern: capacity-planning
    summary: >
      Задача-оценка: посчитать QPS, пиковые нагрузки, объём хранения,
      полосу пропускания и количество серверов для заданного сервиса
      на основе порядка магнитуды и явных допущений.
    requirements:
      - Оценка трафика (средний QPS, пиковый QPS)
      - Оценка объёма хранения и полосы пропускания
      - Оценка числа узлов под нагрузку
    nfr:
      - Оценка с точностью «порядок магнитуды»
      - Быстрое моделирование в уме без калькулятора
    constraints:
      - Нужно явно фиксировать допущения (read/write ratio, retention, peak/avg)
      - Оценка должна проверять дизайн, а не подменять его
    baseline_load:
      dau: 1000000
      read_write_ratio: 100
      retention_days: 365
    topics: [estimation, qps, storage, bandwidth, requests_per_second, capacity_planning, power_of_two, growth_projection]
    steps: []
    acceptance_criteria:
      - Структурированный расчёт: трафик -> хранение -> сеть -> серверы
      - Явные допущения и обоснование каждого
      - Как оценка влияет на выбор архитектуры
    evolution:
      - id: l1
        name: Трафик
        summary: "Переводим DAU в RPS: входящие/исходящие запросы и пиковый множитель."
        diagram: "DAU → средний QPS → пиковый QPS"
        prompts:
          - Какие допущения делаете о поведении пользователя в сутки?
          - Зачем домножать на пиковый множитель и какой он примерно?
      - id: l2
        name: Хранение
        summary: Считаем объём данных на запись, retention и итоговый размер БД.
        diagram: "Размер записи x RPS записи x retention = TB"
        prompts:
          - Сколько байт занимает типичная запись?
          - Как копии/реплики влияют на физический объём хранения?
      - id: l3
        name: Сеть и серверы
        summary: Оцениваем полосу пропускания и число машин под нагрузку.
        diagram: "RPS x размер ответа = bandwidth; RPS / ёмкость узла = узлы"
        prompts:
          - На какой порядок хватает одной машины (CPU, ввод-вывод)?
          - Как слабые допущения ломают вывод про число серверов?
      - id: l4
        name: Оценка как проверка дизайна
        summary: Возвращаемся к архитектуре и смотрим, где цифры заставляют менять компоненты.
        diagram: "Оценка → узкие места → изменения в дизайне"
        prompts:
          - Где расчёты показали, что кэш/очередь/шардинг обязательны?
          - Какой шаг дизайна надо пересчитать после уточнения требований?
    failure_questions:
      - Вы дали цифры на полтора порядка. Как быстро проверить их адекватность?
      - Пиковый множитель 10 против среднего. Как это влияет на sizing серверов?
      - Хранилище на 5 лет retention не влезает в бюджет. Как сократить?
      - Вы забыли про копии метаданных, и объём склада вырос. Как перепроверить?
    advanced_questions:
      - Как строить прогноз роста на 3 года и когда он потребует шардирования?
      - Как сравнить два дизайна по стоимости (SLA против бюджета)?
      - Как оформлять оценку так, чтобы интервьюер засчитал допущения и расчёты?

  - id: system-design-framework
    title: "Фреймворк системного дизайна"
    level: middle
    category: basics
    primary_pattern: sdi-framework
    summary: >
      Методика решения дизайн-задачи: уточнение требований -> оценка ->
      High-Level архитектура -> датамодель -> масштабирование -> компромиссы.
      Отрабатывается как полноценная интервью-лесенка на абстрактном продукте.
    requirements:
      - Последовательно пройти все этапы фреймворка
      - Зафиксировать требования и допущения явно
      - Защитить выбор архитектуры и компромиссы
    nfr:
      - Ни один этап не «проваливается» без объяснения
      - Решения обосновываются данными из оценки масштаба
    constraints:
      - Время интервью ограничено — нужна приоритизация этапов
      - Фреймворк не заменяет глубокие знания компонентов
    baseline_load:
      dau: 1000000
      interview_minutes: 45
    topics: [framework, requirements, capacity_planning, high_level_architecture, data_model, scaling, tradeoffs, interview_skills]
    steps: []
    acceptance_criteria:
      - Понятный порядок: requirements -> estimation -> HLA -> data -> scale
      - Явные допущения и возвращение к ним
      - Осознанные компромиссы вместо «так принято»
    evolution: []
    failure_questions:
      - Кандидат застрял на уточнении требований. Как перейти к архитектуре?
      - Вопрос про миграцию схемы. Как встроить ответ в фреймворк?
      - Интервьюер спрашивает про бэкапы и RPO. На каком этапе это живёт?
      - Не хватило времени на компромиссы. Как уплотнить ранние этапы?
    advanced_questions:
      - Как подстраивать фреймворк под конкретное интервью (стартап против enterprise)?
      - Как проверять гипотезы дизайна через back-of-envelope оценку?
      - Как балансировать глубину: где уместен один абзац, а где схема на пять минут?

  - id: web-crawler
    title: "Web Crawler"
    level: middle
    category: search
    primary_pattern: frontier-politeness-dedup
    summary: >
      Распределённый краулер: очередь URL (frontier), политика вежливости
      (robots.txt, rate-limit), дедупликация страниц, извлечение контента,
      циклы и переиндексация.
    requirements:
      - Сбор страниц по URL из frontier
      - Соблюдение robots.txt и ограничений хоста
      - Дедупликация уже скачанных страниц
      - Выдача контента в downstream (индекс/поиск)
    nfr:
      - Собирать миллионы страниц в сутки
      - Оставаться «вежливым»: не долбить один хост
    constraints:
      - Ограничения сервера нельзя превышать
      - Страницы могут дублироваться; циклы и зеркала существуют
      - Смена содержимого требует повторного обхода (frequency)
    baseline_load:
      pages_per_day: 10000000
      concurrent_hosts: 10000
      crawl_frequency_hours: 8760
    topics: [url_frontier, robots_txt, politeness, dedup, bloom_filter, priority_queue, distributed_crawling, cycle_detection, content_extraction, refresh]
    steps: []
    acceptance_criteria:
      - Frontier и приоритеты (URL, важность)
      - Политика вежливости и ограничение запросов по хостам
      - Дедупликация и обработка циклов
    evolution:
      - id: l1
        name: Один краулер
        summary: Один процесс скачивает страницы, извлекает ссылки и складывает их обратно в очередь.
        diagram: "Seed URLs → deque → fetch → parse → новые URL"
        prompts:
          - Как избежать зацикливания на одной и той же странице?
          - Что происходит с «вежливостью», если узкий канал и много страниц одного хоста?
      - id: l2
        name: Политика вежливости
        summary: Отдельная задержка на каждый хост (rate limiter на домен) и учёт robots.txt.
        diagram: "Frontier → crawler workers → host rate limiter → fetch"
        prompts:
          - Как гарантировать, что один хост получает не более N запросов/сек?
          - Как разбить очередь так, чтобы медленные хосты не блокировали весь краулер?
      - id: l3
        name: Распределённый краулер
        summary: Несколько краулеров делят frontier через очередь; дедупликация через Bloom-фильтр.
        diagram: "URL frontier (очередь) → worker pool → fetch → parse → ссылки → фильтр"
        prompts:
          - Как распределить очередь между воркерами без потерь?
          - Как построить Bloom-фильтр на миллиарды URL и что с ложно-положительными?
          - Как детектировать циклы и бесконечную пагинацию?
      - id: l4
        name: Переобход и свежесть
        summary: Приоритизация по важности и частоте изменений; управление бюджетом обхода.
        diagram: "Frontier с приоритетами + scheduler частот → обход"
        prompts:
          - Как ранжировать важность страниц для порядка обхода?
          - Как выбрать частоту переобхода между свежестью и бюджетом трафика?
    failure_questions:
      - Сайт-мишень отвечает 429 (rate limited). Как не усугубить ситуацию?
      - Два воркера скачали одну и ту же страницу. Как дедуплицировать на лету?
      - Страница генерирует бесконечные пагинационные ссылки. Как не уйти в цикл?
      - Очередь frontier выросла в 100 раз. Как приоритизировать и не потерять важные URL?
    advanced_questions:
      - Как построить распределённый frontier так, чтобы порядок по важности сохранялся?
      - Как масштабировать дедупликацию без единой точки отказа?
      - Как обеспечить полиси «вежливости» на уровне кластера, а не одного воркера?

  - id: nearby-friends
    title: "Nearby Friends (кто из друзей рядом)"
    level: senior
    category: geo
    primary_pattern: location-push-notify
    summary: >
      Сервис «кто из друзей рядом»: периодические GPS-обновления, поиск друзей
      в радиусе, push-уведомления «друг рядом», приватность и батарея.
    requirements:
      - Пользователь делится или скрывает свою позицию
      - Поиск друзей в радиусе X
      - Уведомление при входе друга в радиус
      - Приватность: видимость только по friend list
    nfr:
      - Обновления и запросы в реальном времени (секунды)
      - Экономия батареи: не слать GPS слишком часто
    constraints:
      - Позиции обновляются постоянно -> нужен поток событий
      - Уведомления «друг рядом» редки, но важны
      - Приватность и согласие пользователя обязательны
    baseline_load:
      users: 50000000
      location_updates_per_sec: 500000
      friends_per_user: 100
    topics: [location_updates, spatial_index, geofencing, push_notifications, gps, privacy, streaming, geohash, mobility]
    steps: []
    acceptance_criteria:
      - Поток обновлений позиций и его масштабирование
      - Пространственный индекс для «друзья в радиусе»
      - Механика уведомлений с учётом батареи и приватности
    evolution:
      - id: l1
        name: Pull-модель
        summary: Клиент периодически шлёт позицию; сервер хранит последние позиции в Redis.
        diagram: "Client → API → Redis (последние positions)"
        prompts:
          - Как хранить «последнюю позицию» на пользователя?
          - Как отвечать на запрос «друзья в радиусе» без тяжёлых сканов?
      - id: l2
        name: Пространственный индекс
        summary: Позиции в гео-индексе; поиск ведётся только по списку друзей пользователя.
        diagram: "positions в GEO index → query по списку друзей"
        prompts:
          - Почему достаточно искать только по списку друзей?
          - Что делать, если у пользователя 5000 друзей в одном городе?
      - id: l3
        name: Поток обновлений
        summary: Позиции идут потоком (Kafka), инкрементальное обновление текущих позиций.
        diagram: "Mobile → LB → Position service → Kafka → Redis GEO / worker"
        prompts:
          - Как строить поток обновлений и отсекать «устаревшие» позиции?
          - Как снизить частоту GPS-отправки без потери смысла (dead reckoning, threshold by distance)?
      - id: l4
        name: Геофенсы и уведомления
        summary: Проверка входа в радиус через геофенсы; push-уведомления дедуплицируются.
        diagram: "Position change → geofence check → Push (APNs/FCM)"
        prompts:
          - Какие стратегии геофенсинга (клиент/сервер) и их плюсы?
          - Как не заспамить push при движении в толпе?
          - Как защитить приватность при проверке радиуса?
    failure_questions:
      - Позиция пользователя не обновлялась 2 часа. Как понять, что он выключил GPS?
      - Пуш «друг рядом» прилетел 5 раз за минуту. Как дедуплицировать?
      - Redis с позициями стал «горячим» и падает. Что делать?
      - Пользователь отключил шаринг позиции. Как уверенно удалить данные и уведомления?
    advanced_questions:
      - Как балансировать батарею и свежесть позиций (частота, порог расстояния)?
      - Как строить геофенсы на миллионы пользователей без спама push?
      - Как обеспечить приватность (точность позиции, «приблизительное» положение)?

  - id: google-maps
    title: "Google Maps (карты, маршруты, ETA)"
    level: senior
    category: geo
    primary_pattern: tiles-graph-routing
    summary: >
      Картографический сервис: векторные тайлы, дорожный граф, построение
      маршрутов (скоростные алгоритмы), пробки, ETA и навигация в реальном
      времени.
    requirements:
      - Отображение карты (тайлы/векторы)
      - Построение маршрута между точками
      - Оценка времени прибытия с учётом трафика
      - Навигация с обновлением по дороге
    nfr:
      - Тайлы рендерятся < 100 мс
      - Маршрут по стране — сотни миллисекунд
      - ETA не устаревает сильнее чем на 2–5 минут
    constraints:
      - Дороги — это граф на миллионы вершин
      - Пробки меняются непрерывно -> динамические веса
      - Офлайн-карты и слабая мобильная связь
    baseline_load:
      users: 1000000000
      route_requests_per_sec: 10000
      map_tiles_per_sec: 1000000
      graph_edges: 500000000
    topics: [vector_tiles, road_graph, dijkstra, astar, contraction_hierarchies, traffic, eta, navigation, geospatial, precomputation, offload]
    steps: []
    acceptance_criteria:
      - Тайлинг и рендер карты
      - Хранение дорожного графа и предвычисления
      - Маршрутизация + трафик + ETA
    evolution:
      - id: l1
        name: Статическая карта
        summary: Изображение карты из предподготовленных растровых тайлов.
        diagram: "Client → MapTile API → тайлы (static)"
        prompts:
          - Как устроен тайлинг (z/x/y) и где живут изображения?
          - Почему векторные тайлы лучше растровых для зума и скролла?
      - id: l2
        name: Дорожный граф и маршрут
        summary: Граф дорог; маршрут по Dijkstra/A*.
        diagram: "Graph DB → route service → путь"
        prompts:
          - Как хранить граф дорог и веса на рёбрах?
          - Почему чистого Dijkstra не хватит для страны с миллиардами рёбер?
      - id: l3
        name: Скоростные алгоритмы
        summary: Contraction Hierarchies и предвычисленные таблицы для быстрых запросов маршрута.
        diagram: "offline precompute → CH → быстрый запрос маршрута"
        prompts:
          - Как работает Contraction Hierarchies и что предвычисляется офлайн?
          - Как разбить граф на регионы и шардировать?
      - id: l4
        name: Трафик и ETA
        summary: Веса рёбер обновляются данными трафика; ETA учитывает время суток и пробки.
        diagram: "traffic feed → update weights → ETA service"
        prompts:
          - Как обновлять веса рёбер без остановки сервиса маршрутов?
          - Как считать ETA для маршрута, меняющегося во время движения?
          - Навигация пересчитывает путь при отклонении: какой логики требует это?
    failure_questions:
      - Пробка образовалась после построения маршрута. Как пересчитать ETA?
      - Сеть потеряна на середине навигации. Как продолжить (офлайн-граф)?
      - Нода с предвычисленными данными перегружена. Как отдать ETA без неё?
      - Дорога закрыта (авария). Как оперативно обновить граф и маршруты?
    advanced_questions:
      - Как строить офлайн-навигацию без потери точности ETA?
      - Как шардировать граф дорог и пересекать границы шардов при маршруте?
      - Как учитывать время суток в предвычисленных таблицах без потери качества?

  - id: distributed-message-queue
    title: "Distributed Message Queue (Kafka-like)"
    level: senior
    category: kafka
    primary_pattern: log-partition-replication
    summary: >
      Распределённая очередь: топики, партиции, commit log, consumer groups,
      репликация, гарантии доставки (at-least-once/exactly-once), порядок
      и retention.
    requirements:
      - Приём и выдача сообщений по топикам
      - Партиционирование и параллельное потребление
      - Гарантии доставки и порядок в рамках партиции
      - Переживать отказы брокеров
    nfr:
      - Пропускная способность миллионы сообщений в секунду
      - Задержка доставки — миллисекунды
    constraints:
      - Данные пишутся в логи (append-only)
      - Разные гарантии доставки под разных потребителей
    baseline_load:
      messages_per_sec: 10000000
      brokers: 50
      partitions_per_topic: 100
    topics: [kafka, partition, commit_log, consumer_group, replication, isr, at_least_once, exactly_once, ordering, retention, offset]
    steps: []
    acceptance_criteria:
      - Топик, партиции, offset и commit log
      - Consumer group и ребалансировка
      - Гарантии доставки и репликация
    evolution:
      - id: l1
        name: Точка-точка
        summary: Продюсер напрямую шлёт потребителю (возможно через redis list/pubsub).
        diagram: "Producer → Consumer"
        prompts:
          - Что ломается при множестве потребителей и при отказе?
          - Зачем нужна буферизация между продюсером и потребителем?
      - id: l2
        name: Очередь с партициями
        summary: Топик разбит на партиции; каждая партиция — упорядоченный лог.
        diagram: "Producer → topic(partitions) → consumers"
        prompts:
          - Как выбирается ключ партиционирования и почему порядок — только в партиции?
          - Что происходит с offset при падении потребителя?
      - id: l3
        name: Репликация и лидер-фолловер
        summary: Брокеры-реплики, leader/follower, ISR и выбор лидера.
        diagram: "broker A (leader) <-replication-> broker B, C (follower)"
        prompts:
          - Что такое ISR и зачем подтверждения от реплик (acks)?
          - Почему обычно нужно минимум 3 брокера для отказоустойчивости?
      - id: l4
        name: Идемпотентность и транзакции
        summary: Idempotent producer, транзакции продюсер-потребитель, exactly-once.
        diagram: "idempotent producer → log; consumer → идемпотентный потребитель"
        prompts:
          - Как достичь exactly-once при чтении из Kafka и записи в БД?
          - В чём разница at-least-once и exactly-once на практике?
          - Как обрабатывать ребалансировку без потери обработки?
    failure_questions:
      - Брокер-лидер партиции умер. Что произойдёт с продюсерами и потребителями?
      - Потребитель упал с незакоммиченным offset. Сколько сообщений повторится?
      - Продюсер повторил сообщение. Как потребитель отфильтрует дубликат?
      - Один ключ нагружает одну партицию («хот-кей»). Как решить?
    advanced_questions:
      - Почему Kafka строит хранение как commit log с сегментами?
      - Как строить георепликацию топиков между регионами?
      - Как обеспечить низкий tail latency при пиках записи?

  - id: ad-click-aggregation
    title: "Ad Click Event Aggregation (агрегация кликов)"
    level: senior
    category: kafka
    primary_pattern: stream-window-aggregation
    summary: >
      Сбор рекламных кликов и агрегация в отчётность: поток событий, окна
      агрегации, дедупликация, шардирование по кампаниям и real-time витрины.
    requirements:
      - Приём кликов (миллиарды в сутки) и сквозная доставка
      - Агрегация по кампании за окна (минуты/часы/дни)
      - Быстрая выдача агрегированных дашбордов
      - Исключение дублей и фрод-кликов
    nfr:
      - Агрегации видны в течение секунд после события
      - Поток — миллионы событий в секунду
    constraints:
      - События приходят из многих источников с опозданиями (late events)
      - Точность сумм важна, eventual consistency допустима
    baseline_load:
      events_per_sec: 5000000
      time_window_sec: 60
      campaigns: 100000
    topics: [advertising, click_stream, aggregation, windowing, kafka_streams, dedup, realtime_dashboard, late_events, percentile]
    steps: []
    acceptance_criteria:
      - Пайплайн приёма и агрегации событий
      - Модель окон и обработка опоздавших событий
      - Шардирование агрегатов и выдача дашбордов
    evolution:
      - id: l1
        name: Batch (ночь)
        summary: Клики копятся в лог; ночью batch-счёт по SQL для отчётов.
        diagram: "click log → ночная агрегация → витрины"
        prompts:
          - Какие ограничения batch-подхода (свежесть, сложность)?
          - В каком случае batch-витрин достаточно для продукта?
      - id: l2
        name: Stream + окна
        summary: Клики идут в Kafka Streams; оконная агрегация (tumbling/sliding) пишет счётчики.
        diagram: "clicks → Kafka → windowed aggregation → counts"
        prompts:
          - Почему окна, а не один «вечный» счётчик на кампанию?
          - Как обрабатывать late events и watermark?
      - id: l3
        name: Шардирование и дедупликация
        summary: Агрегаты шардируются по campaign_id; дубликаты фильтруются по event_id.
        diagram: "clicks → dedup (event_id) → sharded counters → read api"
        prompts:
          - Как гарантировать отсутствие двойного счёта (идемпотентная запись)?
          - Как выбрать ключ шардирования счётчиков?
          - Как читать агрегаты, разбросанные по шардам?
      - id: l4
        name: Real-time и масштаб
        summary: Поддержка лагов и повторных данных; горячий кэш для топ-кампаний.
        diagram: "stream → counters → hot-cache для топ-campaign → realtime dashboard"
        prompts:
          - Как держать метрики топ-кампаний с минимальной задержкой?
          - Как обновить витрины при повторе исторического периода?
          - Какие показатели SLA по лагу агрегации вы предложите?
    failure_questions:
      - Дубль клика не отфильтрован, счётчик завышен. Как починить и предотвратить?
      - Поток кликов пришёл с задержкой 30 минут. Как корректно обновить витрины?
      - Кампания стала «горячей» при атаке ботов. Что делать?
      - Один счётчик на сотни миллионов кликов. Как партиционировать агрегат?
    advanced_questions:
      - Как строить идемпотентные дедупликацию и запись в счётчики?
      - Как совмещать real-time и batch (lambda/kappa паттерны)?
      - Как отсекать фрод-клики внутри конвейера без потери легитимных событий?

  - id: hotel-reservation
    title: "Hotel Reservation System"
    level: senior
    category: ecommerce
    primary_pattern: inventory-reservation-lock
    summary: >
      Бронирование комнат: конкурентные запросы на один номер, защита от
      double-booking, временная резервация с TTL, overbooking и отмена.
    requirements:
      - Поиск доступных комнат на даты
      - Резервирование комнаты
      - Оплата/отмена и освобождение
      - Конкурентные брони одного номера
    nfr:
      - Никаких двух броней на один номер на одни даты
      - Резервация (hold) на время оплаты с таймаутом
    constraints:
      - Ключ = отель + номер + даты
      - Высокая конкурентность на «горячие» даты
      - Overbooking возможен сознательно (страховка от no-show)
    baseline_load:
      hotels: 100000
      bookings_per_sec: 500
      avg_stay_days: 3
    topics: [inventory, double_booking, reservation, ttl, lock, overbooking, cancellation, availability_calendar, deadlock_avoidance]
    steps: []
    acceptance_criteria:
      - Инвентарная модель номеров и календарь занятости
      - Атомарная резервация без double-booking
      - Освобождение при неоплате и политика overbooking
    evolution:
      - id: l1
        name: Простой инвентарь
        summary: На каждую дату счётчик свободных комнат; бронь — декремент с проверкой.
        diagram: "availability(nights) → reserve → decrement"
        prompts:
          - Что модель «счётчик на дату» считает некорректно при длинных проживаниях?
          - Как гарантировать атомарность декремента?
      - id: l2
        name: Атомарные операции и лок
        summary: Резервация через атомарный UPDATE с условием или пессимистичные блокировки строк.
        diagram: "UPDATE availability SET free = free - 1 WHERE free > 0"
        prompts:
          - Как conditional UPDATE предотвращает двойное бронирование?
          - Когда нужен SELECT ... FOR UPDATE и как избежать deadlock'ов?
      - id: l3
        name: Временная резервация + TTL
        summary: Бронь держит комнату на время оплаты (hold), при таймауте — автоматическое освобождение.
        diagram: "reserve → hold (TTL) → pay → confirmed / expire"
        prompts:
          - Как освобождать просроченные hold (retry, кроны, очередь)?
          - Что происходит, если платёж подтверждён после истечения hold?
      - id: l4
        name: Масштабирование и overbooking
        summary: Шардирование инвентаря по отелям и осознанная продажа «лишнего» на случай no-show.
        diagram: "отель → шард → инвентарь + overbooking policy"
        prompts:
          - Как выбрать ключ шардирования и что с запросами «по городу»?
          - Как считаются риски overbooking?
          - Как обрабатывать каскад отмен и повторное освобождение?
    failure_questions:
      - Два пользователя в одну секунду бронируют последний номер. Кто и как выиграет?
      - Hold закончился, но платёж подтверждён позже, а комната уже продана. Что делаем?
      - Overbooking дал «лишних» клиентов на одну дату. Как урегулировать?
      - Шард популярного отеля перегружен. Как ребалансировать?
    advanced_questions:
      - Как моделировать классы номеров (room types) в агрегированном инвентаре?
      - Как строить отмену и возврат средств без потери согласованности инвентаря?
      - Как обновлять календарь занятости без пересчёта всех дат при больших проживаниях?

  - id: realtime-leaderboard
    title: "Real-time Gaming Leaderboard (рейтинг игроков)"
    level: senior
    category: realtime
    primary_pattern: zset-sharded-topk
    summary: >
      Рейтинг игроков в реальном времени: топ-N, позиция игрока, обновление
      очков на высокой скорости, шардирование sorted set и приблизительные
      оценки при огромной конкурентности.
    requirements:
      - Обновление очков игрока
      - Выдача топ-N игроков и позиции игрока
      - Обновление почти в реальном времени
    nfr:
      - Миллионы обновлений в секунду; чтение топа < 100 мс
      - Предсказуемые ничьи и тайбрейки
    constraints:
      - Один игрок может обновляться очень часто
      - Top-N читается значительно чаще, чем пишется
      - Точное место важно в топе, дальше — приблизительное
    baseline_load:
      players: 50000000
      updates_per_sec: 2000000
      top_n: 100
    topics: [redis, sorted_set, zadd, zrevrange, leaderboard, sharding, consistency, topk, approximate, ties]
    steps: []
    acceptance_criteria:
      - Структура sorted set и операции топ-N/ранг
      - Шардирование счётчиков и согласованность
      - Приближённый top-k при миллиардах игроков
    evolution:
      - id: l1
        name: БД и сортировка по запросу
        summary: Список игроков с очками; топ-N через ORDER BY по score.
        diagram: "Плеер → score; TOP-N = SELECT ... ORDER BY score DESC LIMIT N"
        prompts:
          - Почему ORDER BY на 1 млрд игроков медленный даже с индексом?
          - Как обновлять score без блокировок?
      - id: l2
        name: Redis Sorted Set
        summary: zadd обновляет место за O(log N); топ и ранг читаются мгновенно.
        diagram: "Game → Redis zset (player→score) → topN/rank"
        prompts:
          - Какие операции и их сложности (ZADD, ZREVRANGE, ZRANK)?
          - Что будет при исчерпании памяти, если каждый игрок — элемент zset?
      - id: l3
        name: Шардирование
        summary: Zset разбит на шарды по диапазону очков; топ-N собирается из шардов.
        diagram: "shard A (топ) / shard B / shard C → merge top-N"
        prompts:
          - Как выбрать ключи шардирования (диапазон очков против хеша)?
          - Как посчитать ранг игрока по merge мест в шардах?
          - Как масштабировать записи при «горячем» шарде топ-игроков?
      - id: l4
        name: Approximate top-k
        summary: Segment/tiered хранение; приблизительные места ниже топа.
        diagram: "events → сегментированные counters → места (приблизительно ниже топа)"
        prompts:
          - Зачем нужна точность точного места на 1000-м рейтинге, если важен топ-10?
          - Как tiered-хранение (горячие очки в памяти) решает проблему масштаба?
    failure_questions:
      - Обновления идут через Kafka, в топ-N виден лаг. Как его сократить?
      - Один игрок делает 100 апдейтов в секунду. Как шардировать «горячий» ключ?
      - Ничья в топ-10. Как детерминированно упорядочить игроков?
      - При решардинге нужно пересчитать ранги без простоя. Как?
    advanced_questions:
      - Как совмещать с ежедневной игрой и сезонным сбросом очков?
      - Как обеспечить точный ранг в топе и приблизительный у дальних игроков с приёмлемой ценой?
      - Как строить eventual-запись (Redis → durable storage) и восстановление?

  - id: digital-wallet
    title: "Digital Wallet (электронный кошелёк)"
    level: senior
    category: ecommerce
    primary_pattern: ledger-double-entry
    summary: >
      Кошелёк: баланс пользователя, переводы, double-entry учёт, идемпотентность
      транзакций, конкурентные списания и сверка с внешними системами.
    requirements:
      - Пополнение, выплата, перевод средств
      - Точный баланс и история операций
      - Защита от двойного списания (double-spend)
      - Идемпотентные операции по request_id
    nfr:
      - Никаких потерянных или двойных транзакций
      - Перевод должен быть атомарным (пара записей)
    constraints:
      - Деньги нельзя «ронять»: персистентность и транзакции обязательны
      - High consistency важнее availability (обычно)
      - Шардирование по user_id не должно ломать транзакции переводов
    baseline_load:
      users: 10000000
      transactions_per_sec: 5000
      avg_balance: 1000
    topics: [wallet, balance, ledger, double_entry, transaction, idempotency, request_id, locking, sharding, reconciliation, currency, decimal]
    steps: []
    acceptance_criteria:
      - Модель баланса и двойная запись в журнале
      - Атомарный перевод без double-spend
      - Идемпотентность по request_id и восстановление
    evolution:
      - id: l1
        name: Простой баланс
        summary: Обновление поля balance у пользователя в транзакции.
        diagram: "user.balance = balance ± amount (UPDATE)"
        prompts:
          - Какие гонки у простого UPDATE баланса?
          - Почему мутабельный баланс плох для аудита?
      - id: l2
        name: Двойная запись
        summary: Каждая операция — пара записей (debit/credit) в журнале; баланс — агрегат журнала.
        diagram: "Ledger rows: (sender, -100), (receiver, +100)"
        prompts:
          - В чём преимущество журнала перед мутабельным балансом (audit, проводка)?
          - Как считать баланс: материализованный против суммы по журналу?
      - id: l3
        name: Идемпотентность и блокировки
        summary: request_id уникален; списание атомарно; перевод через блокировки строк.
        diagram: "request_id (unique) → check → debit/credit → commit"
        prompts:
          - Как защититься от повторной отправки одного request_id?
          - Как поступать с «горячей» строкой одного пользователя?
          - Как обновить баланс двух сторон атомарно и не получить deadlock?
      - id: l4
        name: Масштабирование
        summary: Шардирование по user_id; кросс-шардовые переводы через saga или транзакционный журнал.
        diagram: "user shards → перевод между шардами (saga / 2-phase)"
        prompts:
          - Какие проблемы с переводом между шардами?
          - Где вы сознательно выбираете консистентность над доступностью?
          - Как строить сверку (reconciliation) с банками и эквайрингами?
    failure_questions:
      - Два запроса одновременно списывают сумму с одного баланса. Как не уйти в минус?
      - Перевод подтверждён отправителю, но получатель не увидел. Как восстановить?
      - Повторный вызов перевода с тем же request_id, но другой суммой. Что делать?
      - Баланс и история разошлись после сбоя. Как пересчитать и зафиксировать?
    advanced_questions:
      - Как строить double-entry с корректным учётом валют (decimal, локализация)?
      - Как зафиксировать CAP-решение и SLO для wallet против других сервисов?
      - Как строить журнал аудита и восстановление без потери транзакций?

  - id: stock-exchange
    title: "Stock Exchange (торговая площадка)"
    level: senior
    category: realtime
    primary_pattern: matching-engine-orderbook
    summary: >
      Биржевая система: приём ордеров, order book по символам, matching engine
      (price-time priority), FIX-протокол, market data, отказоустойчивость
      и минимальная задержка.
    requirements:
      - Приём и валидация ордеров (limit/market)
      - Матчинг по цене и времени (price-time priority)
      - Публикация рыночных сделок и котировок (market data)
      - Расчёт позиций и клиринг (пост-трейд)
    nfr:
      - Matching latency — микросекунды-миллисекунды
      - Тысячи ордеров на символ в секунду
      - Никаких потерянных сделок и «тёмных» ордеров
    constraints:
      - Книга ордеров в памяти ради задержки; персистентность через WAL
      - Символы независимы -> шардирование по символу
      - При одинаковой цене порядок определяется временем приёма
    baseline_load:
      symbols: 5000
      orders_per_sec: 100000
      matching_latency_us: 500
    topics: [order_book, matching_engine, price_priority, time_priority, fix_protocol, market_data, memory_system, wal, sharding_by_symbol, clock_sync, circuit_breaker]
    steps: []
    acceptance_criteria:
      - Структура order book и алгоритм матчинга
      - Приоритеты price-time и идемпотентность повторов
      - Персистентное состояние и восстановление после сбоя
    evolution:
      - id: l1
        name: Обычная БД
        summary: Ордера в БД, матчинг по SQL-запросам.
        diagram: "order → DB → match via query"
        prompts:
          - Почему matching через БД не выдерживает высокочастотную нагрузку?
          - Где БД ещё уместна (пост-трейд, отчёты)?
      - id: l2
        name: In-memory matching
        summary: Order book в памяти; изменение состояния — в транзакциях с WAL.
        diagram: "order → orderbook (memory) → match → event → WAL"
        prompts:
          - Какие структуры данных используем для order book в памяти?
          - Как обеспечить персистентность без потери скорости?
          - Как консистентно обрабатывать отмены и модификации ордеров?
      - id: l3
        name: Шардирование по символам
        summary: Каждый символ на отдельном движке; глобальная последовательность сделок через sequencing.
        diagram: "symbol A engine / symbol B engine → market data service"
        prompts:
          - Как шардировать биржу между символами без потери общего порядка?
          - Кто формирует глобальный sequence сделок и референсную цену?
      - id: l4
        name: Инфраструктура
        summary: FIX-шлюзы, market data broadcast, защита от аномальных ордеров, failover без потерь.
        diagram: "участники → FIX gateway → matching → market data → участники"
        prompts:
          - Как добиться малой задержки end-to-end (размещение, TCP/UDP multicast)?
          - Как выполнить failover активного движка без потери состояния?
          - Какие защитные механизмы («kill switch», лимиты на ордер) предусмотреть?
    failure_questions:
      - Matching engine упал посреди обработки пакета. Как гарантировать персистентность сделки?
      - Часы двух движков разошлись. Как сохранить честный time priority?
      - Поток ордеров вырос в 50 раз. Как избежать переполнения очередей?
      - Дубликат ордера пришёл повторно (сетевой retry). Как защититься?
    advanced_questions:
      - Как построить отказоустойчивый matching engine с exactly-once обработкой ордеров?
      - Как публиковать market data с минимальной задержкой (multicast, sequence)?
      - Как совместить распределённое исполнение и единый sequence для пост-трейда?