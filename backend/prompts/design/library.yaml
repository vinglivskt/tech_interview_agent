      - Корзина и оформление заказа
      - Оплата, инвентарь и доставка
    nfr:
      - Заказ не должен теряться при сбоях
      - Платёж и склад должны быть консистентны
    constraints:
      - Платёж внешний и идемпотентный
      - Инвентарь ограничен
    baseline_load:
      orders_per_day: 100000
      catalog_sku: 5000000
    topics: [users, products, cart, orders, payments, inventory]
    steps: []
    acceptance_criteria:
      - Модель заказа и состояния
      - Связка платёж/склад
      - Идемпотентность оплат
    evolution: []
    failure_questions:
      - Платёж списан, но склад не уменьшился. Как прийти к консистентности?
      - Пользователь снова нажал «Оплатить». Как избежать двойного списания?
      - Сервис инвентаря упал. Удержать ли возможность оформления заказа?
    advanced_questions:
      - Как строить сагу оформления заказа и какая стратегия складских резервов?

  - id: shopping-cart
    title: "Shopping Cart"
    level: middle
    category: ecommerce
    primary_pattern: persistent-cart-merge
    summary: >
      Корзина: персистентная, для анонимных и авторизованных, слияние корзин,
      конкурентные обновления и Redis.
    requirements:
      - Добавление/удаление товаров
      - Сохранение корзины между устройствами
      - Слияние анонимной и авторизованной корзины
    nfr:
      - Изменения корзины не должны теряться при конкурентности
      - Быстрое чтение корзины
    constraints:
      - Анонимная корзина привязывается к устройству
      - При логине корзины объединяются
    baseline_load:
      carts_active: 10000000
      update_qps: 20000
    topics: [cart, redis, anonymous_users, merge_carts, concurrent_updates, consistency]
    steps: []
    acceptance_criteria:
      - Хранение корзины и конкурентность
      - Слияние корзин
      - Инвалидация/согласованность
    evolution: []
    failure_questions:
      - Пользователь на двух вкладках меняет корзину. Как не потерять изменения?
      - При логине корзины объединились, получив дубли. Как слить корректно?
      - Redis с кэшем корзины упал. Корзина пропала?
    advanced_questions:
      - Как определять каноническую корзину (last write wins vs merge)?
      - Как строить слияние корзин по правилам комбинирования одинаковых SKU?

  - id: order-management
    title: "Order Management System"
    level: senior
    category: ecommerce
    primary_pattern: state-machine
    summary: >
      Управление заказами: конечный автомат состояний, связь с оплатой,
      инвентарём и доставкой, отмена и возвраты.
    requirements:
      - Создание и смена состояний заказа
      - Отмена и возврат средств
      - Связь с инвентарём/доставкой
    nfr:
      - Состояние заказа строго детерминировано
      - Никаких «пишущих» гонок в один заказ
    constraints:
      - Переходы ограничены машиной состояний
      - Операции идемпотентны
    baseline_load:
      orders_per_sec: 200
      active_states: 10
    topics: [state_machine, payment, inventory, delivery, cancellation, refund]
    steps: []
    acceptance_criteria:
      - Машина состояний заказа
      - Идемпотентность операций
      - Отмена/возвраты
    evolution: []
    failure_questions:
      - Вдруг два сервиса меняют состояние заказа одновременно. Как предотвратить?
      - Товар отправлен, но деньги не списаны. Что делать?
      - Заказ отменён в момент комплектации. Как согласовать со складом?
    advanced_questions:
      - Как хранить журнал переходов состояний и аудит изменений?
      - Как строить async-операции с атомарными переходами (optimistic locking)?

  - id: inventory-system
    title: "Inventory System / Overselling"
    level: senior
    category: ecommerce
    primary_pattern: optimistic-locking-reservation
    summary: >
      Классическая задача: 100 единиц товара, 10 000 пользователей хотят купить.
      Гонки, pessimistic/optimistic locking, атомарные операции, резервирование
      и защита от overselling.
    requirements:
      - Удержание ограниченного стока
      - Резервирование на время оформления
      - Возврат невыкупленного резерва
    nfr:
      - Никогда не продать больше остатка
      - Высокая конкурентность покупок
    constraints:
      - Резерв на ограниченный срок (TTL)
      - Продажа и списание должны быть атомарны
    baseline_load:
      stock_max: 100
      concurrent_buyers: 10000
      reserve_ttl_sec: 300
    topics: [race_condition, pessimistic_lock, optimistic_lock, atomic_operation, reservation, overselling, queue]
    steps: []
    acceptance_criteria:
      - Атомарный conditional update (stock-1 where stock>0)
      - Оптимистичный vs пессимистичный лок
      - Резервирование и истечение
    evolution: []
    failure_questions:
      - Два запроса одновременно списали последний товар. Как исключить?
      - Резерв истёк, пользователь оплачивает. Как обработать поздно?
      - Распределённая блокировка на склад падала. Как работает without locking?
    advanced_questions:
      - Как реализовать stock decrement атомарно в PostgreSQL (UPDATE ... WHERE)?
      - Как строить очередь покупок и справедливость между пользователями?

  - id: payment-system
    title: "Payment System"
    level: senior
    category: ecommerce
    primary_pattern: idempotency-keys
    summary: >
      Платёжная система: машина состояний платежа, идемпотентные ключи,
      ретраи, webhooks, защита от двойного списания, авторизация/капчур
      и reconciliation.
    requirements:
      - Инициация и подтверждение платежа
      - Идемпотентность и ретраи
      - Сверка с эквайрингом (reconciliation)
      - Обработка refunds и partial captures
    nfr:
      - Никогда не списать дважды
      - Платёж должен доходить до конечного состояния
    constraints:
      - Внешний платёжный провайдер может отвечать недетерминированно
      - Webhook может прийти дважды и в другом порядке
      - Двойная авторизация и капчур требуют аккуратного жизненного цикла
    baseline_load:
      payments_per_sec: 200
      providers: 2
      webhook_duplicate_pct: 5
    topics: [payment_states, idempotency_keys, retries, webhooks, transaction_consistency, double_charge, reconciliation, auth_capture, refund, psd2]
    steps: []
    acceptance_criteria:
      - Машина состояний платежа и idempotency key
      - Обработка webhook-дублей и порядка
      - Reconciliation и обработка «зависших» платежей
    evolution:
      - id: l1
        name: Простой запрос
        summary: Бэкенд зовёт провайдера и считает платёж успешным по ответу.
        diagram: "Service → Provider → result"
        prompts:
          - Какие риски «посмотрим на ответ» при таймауте провайдера?
          - Почему статус платежа должен быть явной машиной состояний?
      - id: l2
        name: Машина состояний и idempotency
        summary: Платёж проходит по статусам; повторные запросы гасят idempotency key.
        diagram: "Инициация → Auth → Capture → Success; дубли → idempotency key"
        prompts:
          - Как проверить идемпотентность на уровне БД (уникальность ключа)?
          - Какие статусы нужны (pending/authorized/captured/failed/refunded)?
      - id: l3
        name: Webhooks и ретраи
        summary: Асинхронные уведомления провайдера; дедупликация и порядок событий.
        diagram: "Provider → webhook → приём → дедупликация → обновление статуса"
        prompts:
          - Как обрабатывать дубли webhook и нарушенный порядок?
          - Как доводить «зависшие» платежи на финальный статус (polling/reconciliation)?
      - id: l4
        name: Масштаб и надёжность
        summary: Роутинг между провайдерами, авторизация/капчур отдельно, фоновые сверки.
        diagram: "payment → роутер → auth/capture → reconciliation ночью"
        prompts:
          - Как делать роутинг и failover между провайдерами?
          - Как проводить авторизацию и списание (капчур) раздельно и избегать пересписания?
          - Как строить формулу сверки (заказы ↔ провайдерские отчёты)?
    failure_questions:
      - Пользователь дважды нажал «Оплатить». Как не списать дважды?
      - Webhook об оплате пришёл дважды с задержкой. Как дедуплицировать?
      - Платёж «завис» в обработке. Как довести до конца и с чем сверяться ночью?
      - Деньги списались, но статус заказа не обновился. Как восстановить консистентность?
    advanced_questions:
      - Как строить шлюз агрегации провайдеров с роутингом и failover?
      - Как вводить идемпотентность без потери производительности?
      - Как строить refunds и partial captures с сохранением консистентности?

  - id: ticket-booking
    title: "Ticket Booking (кино/авиа/концерт)"
    level: senior
    category: ecommerce
    primary_pattern: seat-reservation-lock
    summary: >
      Продажа билетов с местами: резервирование мест, конкурентные покупки,
      временная блокировка по TTL, таймаут оплаты и защита от overselling.
    requirements:
      - Выбор и бронирование мест
      - Временная блокировка на время оплаты
      - Освобождение при таймауте
    nfr:
      - Никаких двух человек на одном месте
      - Освобождение мест при неоплате
    constraints:
      - Блокировка краткосрочная (TTL)
      - Высокая конкурентность на «горячие» сеансы
    baseline_load:
      seats_per_event: 400
      concurrent_buyers: 5000
      lock_ttl_min: 10
    topics: [seat_reservation, concurrent_users, temporary_lock, ttl, payment_timeout, overselling]
    steps: []
    acceptance_criteria:
      - Резервирование мест и TTL
      - Атомарность назначения места
      - Освобождение при таймауте
    evolution: []
    failure_questions:
      - Два пользователя выбрали одно место. Кто выиграет и как решить атомарно?
      - Платёж затянулся дольше TTL. Место освободилось, деньги списались. Как действовать?
      - Весь концерт раскупают боты. Как смягчить?
    advanced_questions:
      - Как строить справедливую очередь бронирования «горячих» событий?
      - Как проектировать хранение занятости мест под конкурентность?

  # ==========================================================================
  # 9. SEARCH SYSTEMS
  # ==========================================================================

  - id: search-engine
    title: "Search Engine"
    level: senior
    category: search
    primary_pattern: inverted-index-ranking
    summary: >
      Поисковый движок: краулер, индексатор, inverted index, ранжирование,
      шарды и реплики Elasticsearch/OpenSearch.
    requirements:
      - Индексация документов
      - Поиск по запросу с ранжированием
      - Шардирование и репликация индекса
    nfr:
      - p95 поиска < 100 мс
      - Свежесть индекса в минутах
    constraints:
      - Корпус огромный, нужен распределённый индекс
      - Ранжирование комбинирует текст и сигналы
    baseline_load:
      documents: 1000000000
      queries_per_sec: 5000
    topics: [crawler, indexer, inverted_index, ranking, elasticsearch, shards, replicas]
    steps: []
    acceptance_criteria:
      - Построение inverted index
      - Распределение индекса (шарды/реплики)
      - Ранжирование и его сигналы
    evolution: []
    failure_questions:
      - Краулер залил дубли документов. Как дедуплицировать при индексации?
      - Шарда перегружена, а запрос агрегирован по всему индексу. Как зашардировать документы?
      - Множество запросов на «горячее» слово. Как кэшировать топ-запросы?
    advanced_questions:
      - Как строить BM25 и TF-IDF отличия, и когда нужен learning-to-rank?
      - Как индексировать обновления (add/update/delete) с низким лагом?

  - id: autocomplete
    title: "Autocomplete / Typeahead"
    level: middle
    category: search
    primary_pattern: trie-prefix
    summary: >
      Автодополнение запросов: prefix tree (Trie), кэш популярных запросов,
      ранжирование top-k, низкая задержка, обновление трендов и масштаб.
    requirements:
      - Подсказки по префиксу запроса
      - Ранжирование по популярности/персонально
      - Очень низкая задержка при большом RPS
      - Обновление трендов за минуты
    nfr:
      - p99 ответа < 50 мс
      - Постоянная готовность под большим RPS
    constraints:
      - Каждый символ — новый запрос автодополнения
      - Словарь из сотен миллионов запросов
      - Нужно учитывать тренды последних минут (не только месячную статистику)
    baseline_load:
      queries_per_sec: 200000
      dictionary_entries: 100000000
    topics: [trie, prefix_tree, redis, ranking, popular_queries, latency, topk, geo, personalization, data_refresh]
    steps: []
    acceptance_criteria:
      - Структура Trie и варианты хранения (map vs array)
      - Кэш и ранжирование top-k
      - Как обновляются тренды без простоя
    evolution:
      - id: l1
        name: Прямой поиск
        summary: Запрос-префикс против таблицы популярных запросов (SQL LIKE / index).
        diagram: "Client → API → DB (prefix search)"
        prompts:
          - Почему префиксный поиск в БД медленный при миллионах запросов?
          - Какой индекс и какие ограничения?
      - id: l2
        name: Trie в памяти
        summary: Дерево префиксов с хотами популярности; быстрый топ-k по префиксу.
        diagram: "Client → API → Trie (prefix) → top-k"
        prompts:
          - Как устроен узел Trie и его дочерние ссылки (children map)?
          - Как быстро получить top-k по префиксу (precompов hotspot/top per node)?
      - id: l3
        name: Кэш и шардинг
        summary: Горячий кэш топ-запросов; шардирование Trie по первым символам/гео.
        diagram: "Client → CDN → API → Redis, Trie shards → top-k"
        prompts:
          - Как кэшировать top-k под популярные префиксы?
          - Как шардировать Trie (по префиксу, по алфавиту) и пересекать шарды?
      - id: l4
        name: Обновление и персонализация
        summary: Офлайн-пересборка топов из логов, кандидаты по пользователю, гео.
        diagram: "логи запросов → агрегация → обновление топов → кэш"
        prompts:
          - Как пересобирать топы без простоя (two-trie hot swap)?
          - Как учитывать свежие тренды и личную историю в ранжировании?
    failure_questions:
      - Внезапный тренд не в словаре. Как подхватить за секунды?
      - Один префикс стал «горячим». Как не уронить сервис?
      - Дерево огромное. Как хранить компактно и быстро искать?
      - Пересборка топов упала на середине. Как откатиться к прошлой версии?
    advanced_questions:
      - Как строить распределённый Trie и шардировать по первым символам?
      - Как персонализировать автодополнение без потери скорости?
      - Как строить компактное представление Trie (DAWG/radix tree) при сотнях миллионов вершин?

  - id: log-search-system
    title: "Log Search System"
    level: senior
    category: search
    primary_pattern: ingest-index-retention
    summary: >
      Поиск по логам: приём (ingestion) через Kafka, индексация в Elasticsearch,
      партиционирование по времени, retention и перераспределение запросов.
    requirements:
      - Приём миллионов логов в секунду
      - Быстрый поиск по временным окнам
      - Хранение с retention
    nfr:
      - Задержка индексации логов < 30 с
      - Поиск по окну мгновенно
    constraints:
      - Объём огромный и взрывной
      - Хот-данные (последние дни) против холодных
    baseline_load:
      logs_per_sec: 5000000
      retention_days: 30
      index_shards: 48
    topics: [ingestion, kafka, indexing, elasticsearch, retention, partitioning]
    steps: []
    acceptance_criteria:
      - Пайплайн приёма и буферизации
      - Партиционирование по времени
      - Hot/warm/cold хранение
    evolution: []
    failure_questions:
      - Всплеск логов в 50 раз. Как не перегрузить индекс?
      - Старые индексы удаляются. Что с запросами по удалённому периоду?
      - Elasticsearch перегружен агрегациями. Как снизить нагрузку?
    advanced_questions:
      - Как строить retention и ILM-политики без шторма?
      - Как обеспечивать надёжность приёма при недоступности индекса?

  # ==========================================================================
  # 10. СОЦИАЛЬНЫЕ СЕТИ
  # ==========================================================================

  - id: instagram-like
