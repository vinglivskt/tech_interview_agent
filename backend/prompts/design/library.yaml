  - id: pattern-consent
    title: "Паттерн: Consistent Hashing"
    level: senior
    category: pattern
    primary_pattern: hash-ring
    summary: >
      Consistent hashing для распределения ключей: кольцо, vnode, ребалансинг
      O(K/N) при добавлении/удалении нод, хот-споты и репликация на соседях.
    requirements:
      - Маппинг ключа в ноду без глобального реестра
      - Минимальное перемещение ключей при изменении числа нод
      - Равномерное распределение при неоднородных нодах
    nfr:
      - Добавление/удаление ноды трогает O(K/N) ключей
      - Поиск ноды для ключа выполняется за O(log N)
    constraints:
      - Кольцо и виртуальные ноды (vnodes)
      - Репликация на соседних нодах; борьба с хот-спотами
    baseline_load:
      nodes: 20
      keys: 1000000
      expected_rebalance_pct: 10
    topics: [consistent_hashing, hash_ring, ring, vnode, virtual_nodes, rebalancing, hot_spots, rendezvous_hashing]
    steps: []
    acceptance_criteria:
      - Построение кольца и направление обхода
      - Vnode и баланс при неоднородных нодах
      - Репликация и перераспределение при remove/failover
    evolution: []
    failure_questions:
      - Удалена нода. Какие ключи и куда переедут?
      - Ноды неравномерны по мощности. Как взвесить vnodes?
      - Дубликаты при репликации. Как избежать потери при failover?
      - Два соседних узла вышли из строя одновременно. Что с данными в этом сегменте?
    advanced_questions:
      - Сравните consistent hashing и rendezvous hashing (HRW) по балансу и движению ключей?
      - Как сочетать consistent hashing с репликацией и quorum в KV-хранилище?
      - Как бороться с «горячими» ключами (виртуальные шарды, secondary keys)?

