    nfr:
      - Поиск < 100 мс
      - Точность радиуса
    constraints:
      - Границы геохаша
      - Частое обновление позиций
    baseline_load:
      objects: 10000000
      queries_per_sec: 5000
    topics: [geohash, r_tree, quadtree, redis_geo, radius]
    steps: []
    acceptance_criteria:
      - Выбор структуры
      - Геохаш и его ограничения
      - Гибрид с БД
    evolution: []
    failure_questions:
      - Объект на границе геохаша. Как избежать потери в radius-запросе?
      - Обновление локаций частое. Как поддерживать index?
      - Радиус большой. Как масштабировать full-scan?
    advanced_questions:
      - Как строить k-nearest по geohash эффективно?

  - id: pattern-multi-region
    title: "Паттерн: Multi-region"
    level: senior
    category: pattern
    primary_pattern: multi-region
    summary: >
      Приложение в нескольких регионах: маршрутизация, репликация, DR.
    requirements:
      - Обслуживание из нескольких регионов
      - Переживание отказа региона
    nfr:
      - Низкая задержка глобально
      - RPO/RTO малы
    constraints:
      - Асинхронная кросс-регион репликация
      - Локальность данных
    baseline_load:
      regions: 3
      lag_s: 5
    topics: [region, geopdns, replication, dr]
    steps: []
    acceptance_criteria:
      - Модель регионов
      - Репликация и конфликты
      - DR-переключение
    evolution: []
    failure_questions:
      - Регион потерян. Как переключить трафик без потери записей?
      - Запись в A, чтение в B с лагом. Пользователь недоволен. Как сгладить?
      - Два региона обновили одну строку. Как разрешить?
    advanced_questions:
      - Active-active с CRDT vs master-master с LWW: какой подход?

  - id: pattern-time-series
    title: "Паттерн: Time-series DB"
    level: senior
    category: pattern
    primary_pattern: tsdb
    summary: >
      Временные ряды: сэмплы, сжатие, агрегации, retention, query.
    requirements:
      - Хранение сэмплов с таймстемпом
      - Агрегация по времени
      - Retention политики
    nfr:
      - Writing миллионов сэмплов/с
      - Быстрые агрегаты
    constraints:
      - Сэмплы append-only и упорядочены по времени
      - Сжатие обязательно
    baseline_load:
      samples_per_sec: 1000000
      retention_days: 90
    topics: [tsdb, samples, compression, aggregation, retention]
    steps: []
