# Библиотека сценариев системного дизайна (файл-дамп для PostgreSQL).
#
# Этот файл читается при старте через seed_design_scenarios_from_file()
# и загружается в таблицу design_scenarios (INSERT ... ON CONFLICT DO UPDATE по id).
# Пустые steps -> сервис генерирует динамические шаги по evolution:
#   clarify -> evolve-1..N -> failure -> advanced (для senior).
#
# Каждая тема: id, title, level (junior|middle|senior), category, primary_pattern,
# summary, requirements, nfr, constraints, baseline_load, topics, tags,
# steps (обычно пустой), acceptance_criteria, evolution[{id,name,summary,diagram,prompts}],
# failure_questions, advanced_questions.

scenarios:
  # ==========================================================================
  # 1. БАЗОВЫЕ СИСТЕМЫ
  # ==========================================================================

  - id: url-shortener
    title: "URL Shortener"
    level: junior
    category: basics
    primary_pattern: id-generation-cache
    summary: >
      Публичный сервис коротких ссылок: пользователь вставляет длинный URL,
      получает короткий код, по нему происходит редирект с минимальной задержкой.
    requirements:
      - Создание короткой ссылки для длинного URL
      - Быстрый редирект по короткому коду
      - Базовая статистика переходов (аналитика)
    nfr:
      - p99 редиректа не более 100 мс
      - Высокая доступность на чтение; запись можно деградировать
    constraints:
      - Короткий код уникальный и предсказуемой длины
      - Статистика может обновляться асинхронно
    baseline_load:
      rps: 1500
      dau: 100000
      storage_gb: 100
    topics: [api, db, cache, consistency, analytics]
    steps: []
    acceptance_criteria:
      - Чёткая HLA с кэшем перед БД
      - Обоснована генерация кода (Base62, коллизии)
      - Описана асинхронная аналитика
    evolution:
      - id: l1
        name: Одиночная БД
        summary: Один инстанс API пишет и читает из одного PostgreSQL (URL -> short_code).
        diagram: "Client → API → PostgreSQL"
        prompts:
          - Нарисуйте write path и read path на одной БД.
          - Как хранить маппинг code -> url и гарантировать уникальность?
      - id: l2
        name: Балансировщик
        summary: Добавляем балансировщик и несколько stateless API-инстансов.
        diagram: "Client → LB → API(xN) → PostgreSQL"
        prompts:
          - Почему API стал stateless и что теперь хранится только в БД?
          - Что сломается первым при росте нагрузки с одной БД?
      - id: l3
        name: Кэш Redis
        summary: Кэш хит-поверхностных чтений редиректа для снижения нагрузки на БД.
        diagram: "Client → LB → API → Redis → PostgreSQL"
        prompts:
          - Какая стратегия кэша (cache-aside) и какой TTL?
          - Что произойдёт при падении Redis и как защититься от cache stampede?
      - id: l4
        name: Асинхронная аналитика
        summary: События переходов уходят в Kafka, воркеры агрегируют в отдельную аналитическую БД.
        diagram: "API → Kafka → Workers → Analytics DB"
        prompts:
          - Зачем выносить аналитику из основного read/write path?
          - Как обрабатываются дубликаты событий и потерянные события?
      - id: l5
        name: Кластеры и отказоустойчивость
        summary: Кластер Redis + реплики PostgreSQL + CDN/edge для самых горячих ссылок.
        diagram: "Client → CDN → LB → API → Redis Cluster → DB Cluster + Kafka"
        prompts:
          - Какой компонент сломается первым при нагрузке x100 и что предлагаете?
          - Как обеспечить глобальную задержку p99?
    failure_questions:
      - PostgreSQL достигла предела. Что делаем?
      - Redis упал. Что произойдёт и как восстановимся?
      - Два пользователя сгенерировали одинаковый короткий код. Как избежать коллизии?
      - Kafka доставила событие перехода дважды. Что произойдёт со статистикой?
    advanced_questions:
      - Как выберете алгоритм генерации ID (последовательный vs случайный vs хеш URL) и почему?
      - Как масштабировать аналитику на потоки в миллионы событий в секунду?
      - Какие есть ограничения CDN-кэширования редиректов и как их обойти?

  - id: pastebin
    title: "Pastebin / текстовая вставка"
    level: junior
    category: basics
    primary_pattern: object-storage-ttl
    summary: >
      Сервис хранения больших текстовых вставок с короткой ссылкой,
      TTL и expiration. Чтения сильно преобладают над записью.
    requirements:
      - Загрузка текста любого размера
      - Получение текста по короткому ключу
      - TTL и автоматическое удаление устаревших вставок
    nfr:
      - p99 чтения пасты не более 200 мс
      - Высокая доступность чтения
    constraints:
      - Вставки должны удаляться по истечении срока
      - Крупный контент не должен блокировать автора
    baseline_load:
      rps: 300
      dau: 10000
      pct_single_file_gb: 10
    topics: [storage, ttl, cache, db, async]
    steps: []
    acceptance_criteria:
      - Стратегия хранения больших текстов
      - Механизм TTL/expiration
      - Кэш чтения и его инвалидация
    evolution: []
    failure_questions:
      - Пользователь загрузил текст 1 ГБ. Что произойдёт со временем ответа?
      - Тысячи вставок истекают одновременно. Как это массово удалять?
      - Кэш переполнен. Какие строки выселятся первыми?
    advanced_questions:
      - Как сделать выгрузку пасты устойчивой к всплескам больших файлов?
      - Как считать квоты на одного пользователя?

  - id: file-upload
    title: "File Upload Service"
    level: junior
    category: basics
    primary_pattern: object-storage-chunked
    summary: >
      Сервис загрузки файлов с поддержкой multipart, chunked и resumable
      загрузки на объектное хранилище, с метаданными в БД и CDN на раздаче.
    requirements:
      - Загрузка файла целиком и по частям
      - Докачка прерванной загрузки (resumable)
      - Скачивание с CDN и метаданные (размер, тип, владелец)
    nfr:
      - Надёжная загрузка больших файлов без разрыва соединения
      - Раздача через CDN с малым временем первого байта
    constraints:
      - Ограничения по размеру файла и числу активных загрузок
      - Проверка на вирусы обязательна для исполняемых файлов
    baseline_load:
      max_file_gb: 50
      concurrent_uploads: 1000
    topics: [object_storage, upload, async_worker, cdn, metadata]
    steps: []
    acceptance_criteria:
      - Механизм chunked/resumable-загрузки
      - Роль вирусканнера и асинхронных воркеров
      - CDN и инвалидация
    evolution: []
    failure_questions:
      - Прерывание загрузки на середине. Как восстановить?
      - Вирусканнер упал. Пропускаем проверку или блокируем скачивание?
      - CDN отдал устаревшую версию файла после перезаписи. Как инвалидировать?
    advanced_questions:
      - Как выбирается число частей и генерируются presigned URL для прямой загрузки в S3?
      - Как строить resumable upload по стандарту tus?

  - id: image-hosting
    title: "Image Hosting"
    level: middle
    category: basics
    primary_pattern: async-image-processing
    summary: >
      Хостинг изображений с асинхронной обработкой (ресайз, превью, форматы),
      объектным хранилищем, CDN-раздачей и инвалидацией кэша.
    requirements:
      - Загрузка изображений
      - Генерация превью и адаптивных размеров
      - Раздача через CDN
    nfr:
      - Загрузка завершается быстро, обработка — асинхронно
      - p95 раздачи превью не более 100 мс
    constraints:
      - Преобразование - CPU-интенсивная задача, нужны воркеры
      - Инвалидация CDN при перезаписи
    baseline_load:
      images_per_sec: 200
      cdn_read_rps: 100000
    topics: [async_workers, object_storage, cdn, cache_invalidation, queue]
    steps: []
    acceptance_criteria:
      - Асинхронный пайплайн обработки изображений
      - Очередь и ретраи воркеров
      - CDN и инвалидация
    evolution: []
    failure_questions:
      - Очередь обработки забита миллионами задач. Что будет с пользователем?
      - Воркер упал на середине конвертации. Что дальше?
      - Пользователь перезаписал изображение. Как обновить превью по всем CDN?
    advanced_questions:
      - Как выбрать формат (WebP/AVIF) и как управлять качеством под устройство?
      - Как обеспечить детерминизм обработки при параллельных воркерах?

  - id: api-rate-limiter
    title: "API Rate Limiter"
    level: middle
    category: basics
    primary_pattern: token-bucket
    summary: >
      Распределённый rate limiter поверх API: Fixed Window, Sliding Window,
      Token Bucket, Leaky Bucket на Redis с атомарными операциями,
      глобальный лимит в кластере и поведение при падении Redis.
    requirements:
      - Ограничение числа запросов на пользователя/IP/ключ
      - Разные стратегии окна (fixed/sliding/token/leaky)
      - Единое ограничение в кластере из нескольких API-узлов
      - Корректные HTTP-ответы (429) и заголовки лимитов
    nfr:
      - Оверхед < 1 мс на проверку лимита
      - Любая нагрузка должна корректно ограничиваться
    constraints:
      - Точное соблюдение лимита при параллельных запросах
      - Падение Redis не должно ронять весь API
      - Байпас на уровне нескольких узлов недопустим
    baseline_load:
      checks_per_sec: 100000
      keys_total: 10000000
    topics: [redis, atomic, distributed, race_condition, api, token_bucket, fixed_window, sliding_window, leaky_bucket, 429, throttling]
    steps: []
    acceptance_criteria:
      - Чёткое сравнение Fixed/Sliding/Token/Leaky и их компромиссы
      - Как обеспечивается атомарность (INCR/Lua/Redis) в кластере
      - Что с лимитом при падении Redis (fallback-политика)
    evolution:
      - id: l1
        name: Внутри приложения
        summary: Лимитер инстанса в памяти; лимит не является общим между узлами.
        diagram: "App node 1 (local limiter) / App node 2 (local limiter)"
        prompts:
          - Почему в-памяти лимитер не подходит для N инстансов?
          - Какой класс задач он всё же покрывает (per-node throttling)?
      - id: l2
        name: Redis-центр
        summary: Общий счётчик в Redis; атомарные операции INCR и TTL.
        diagram: "API nodes → Redis (INCR + TTL) → 200/429"
        prompts:
          - Как реализовать fixed window и sliding window на INCR?
          - Как обрабатывать «берст» на границе Fixed Window?
      - id: l3
        name: Token Bucket и Lua
        summary: Атомарный token bucket на Lua; глобальный лимит и заголовки.
        diagram: "API nodes → Redis Lua (bucket) → остаток лимита"
        prompts:
          - Почему Lua-скрипт даёт атомарность и как он устроен?
          - Какие заголовки (X-RateLimit-*) вы отдадите клиенту?
      - id: l4
        name: Отказоустойчивость
        summary: Fallback при падении Redis, локальные лимитеры как страховка.
        diagram: "API nodes (+local fallback) → Redis (кластер)"
        prompts:
          - Как вести себя, если Redis недоступен (впускать, блокировать, местный лимит)?
          - Как избежать «гонки вниз» (race to the bottom) при восстановлении Redis?
    failure_questions:
      - Два API-узла одновременно проверяют лимит. Как избежать обхода?
      - Redis недоступен. Пропускаем запросы или блокируем? Какова цена каждого варианта?
      - Fixed Window даёт «берсты» в конце окна. Как перейти на sliding window без потери производительности?
      - Пользователь получил 429 и стал агрессивно ретраить. Как защитить Redis от лавины?
    advanced_questions:
      - Как реализовать token bucket на Redis на Lua за O(1)?
      - Как оценить память на хранение ключей всех пользователей и настраивать TTL?
      - Как масштабировать rate limiter на миллиарды ключей (шардирование)?

  - id: webhook-service
    title: "Webhook Service"
    level: middle
    category: basics
    primary_pattern: delivery-retry-dlq
    summary: >
      Сервис доставки webhook-событий: подписки, retry с exponential backoff,
      dead-letter queue, идемпотентность и проверка подписи.
    requirements:
      - Подписка клиента на события
      - Доставка события с гарантией at-least-once
      - Retry с экспоненциальным backoff и DLQ
      - Идемпотентность и подпись
    nfr:
      - Надёжность доставки важнее задержки
      - Клиент может быть долго недоступен
    constraints:
      - Повторная доставка не должна ломать клиента
      - Нельзя терять события в пределах заданного окна
    baseline_load:
      events_per_sec: 5000
      subscribers: 100000
    topics: [queue, retry, idempotency, security, dlq]
    steps: []
    acceptance_criteria:
      - Пайплайн доставки и ретраев
      - Идемпотентность и подпись
      - DLQ и мониторинг недоставленных
    evolution: []
    failure_questions:
      - Клиент вернул 500 десять раз подряд. Что делаем?
      - Событие доставлено дважды. Как клиент это переживёт?
      - RabbitMQ/Kafka упал. Какие события теряются?
    advanced_questions:
      - Как выбрать стратегию подтверждения доставки (ack/retry per subscriber)?
      - Как гарантировать порядок доставки для одного клиента?

  # ==========================================================================
  # 2. READ-HEAVY НАГРУЗКА
  # ==========================================================================

  - id: news-feed
    title: "News Feed"
    level: middle
    category: read-heavy
    primary_pattern: fan-out
    summary: >
      Персональная лента публикаций подписок в социальной сети с миллионами
      DAU и «звёздами» с десятками миллионов подписчиков.
    requirements:
      - Создание публикаций
      - Подписки
      - Персональная хронологическая лента
      - Лайки и счётчики
    nfr:
      - p99 чтения ленты не более 200 мс
      - Высокая доступность, свежесть новых публикаций
    constraints:
      - Допускается eventual consistency счётчиков
      - Нужно решить проблему celebrity (fan-out на миллионы подписчиков)
    baseline_load:
      dau: 100000000
      feed_reads_rps: 500000
      posts_per_sec: 10000
    topics: [fan_out, cache, ranking, redis, celebrity]
    steps: []
    acceptance_criteria:
      - Fan-out on write vs on read vs hybrid
      - Проблема celebrity и её решение
      - Кэширование таймлайнов и пагинация
    evolution:
      - id: l1
        name: Fan-out on read
        summary: Лента собирается на лету запросом к постам подписок.
        diagram: "Client → API → Read DB (посты друзей по запросу)"
        prompts:
          - Каковы плюсы и минусы собирания ленты на чтение?
          - Что будет с задержкой для пользователя с 1000 подписок?
      - id: l2
        name: Fan-out on write
        summary: При создании поста он раскладывается в ленты всех подписчиков в Redis.
        diagram: "Write: API → Fan-out → Redis (ленты подписчиков)"
        prompts:
          - Что произойдёт при публикации поста «звезды» с 40 млн подписчиков?
          - Сколько записей получится и как это решается (pull для celebrity)?
      - id: l3
        name: Hybrid
        summary: Простые пользователи — на write, «звёзды» — подмешиваются на read.
        diagram: "Лента = Redis(фавориты) + подтягивание постов celebrity при чтении"
        prompts:
          - Как определить порог, за которым автора считают «звездой»?
          - Как слить две части ленты и не сломать пагинацию?
    failure_questions:
      - Звезда опубликовала пост, fan-out не успел. Что увидит подписчик?
      - Redis с лентами упал. Все ленты пропали?
      - Нагрузка на чтение выросла в 100 раз. Что сломается первым?
    advanced_questions:
      - Как ранжировать ленту (хронология vs релевантность) и чем это усложняет кэш?
      - Как устроить виртуальную бесконечную пагинацию без дублей при новых постах?

  - id: product-catalog
    title: "Product Catalog"
    level: middle
    category: read-heavy
    primary_pattern: search-index
    summary: >
      Каталог с миллионами товаров: поиск, фильтры, сортировка, кэширование
      через Elasticsearch/OpenSearch и шардирование БД.
    requirements:
      - Поиск по названию и описанию
      - Фильтры (цена, категория, бренд) и сортировка
      - Список товаров с пагинацией
    nfr:
      - p95 поиска не более 150 мс
      - Чтение многократно преобладает над записью
    constraints:
      - Индекс должен оставаться свежим в пределах минут
      - Миллионы SKU, дубли и варианты товаров
    baseline_load:
      sku: 50000000
      search_qps: 20000
    topics: [search, filtering, sorting, cache, sharding, elasticsearch]
    steps: []
    acceptance_criteria:
      - Роль Elasticsearch и как строится индекс
      - Кэширование на разных уровнях
      - Шардирование основного хранилища
    evolution: []
    failure_questions:
      - Индексатор задерживается, товар не находится. Как снизить риск?
      - Elasticsearch перегружен, а каталог читается всеми. Как разгрузить?
      - Как добавить новый товар так, чтобы он мгновенно появился в поиске?
    advanced_questions:
      - Как совместить фасетные фильтры и агрегации с пагинацией при миллионах товарах?
      - Как назвать схему документов и как решать проблему «горячего» товара?

  - id: blog-platform
    title: "Blog Platform"
    level: middle
    category: read-heavy
    primary_pattern: cache-cdn
    summary: >
      Платформа блогов: посты, комментарии, лайки, ленты, CDN и кэширование
      с корректной пагинацией.
    requirements:
      - Создание/редактирование постов
      - Комментарии и лайки
      - Лента блога и поиск
    nfr:
      - Чтение поста должно быть очень быстрым и отдаваться через CDN
      - Комментарии загружаются независимо от поста
    constraints:
      - Пост может быть прочитан миллионами, но написан один раз
      - Комментарии имеют глубокую вложенность
    baseline_load:
      reads_per_sec: 1000000
      posts_total: 10000000
    topics: [cdn, cache, pagination, comments, likes]
    steps: []
    acceptance_criteria:
      - Кэширование статики поста и CDN
      - Модель комментариев и их пагинация
      - Счётчики лайков
    evolution: []
    failure_questions:
      - Популярный пост перегрузил один кэш-ключ. Как кэшировать горячий ключ?
      - CDN отдал кэшированную версию поста с ошибкой автора. Как исправить быстро?
      - Комментарии растут неограниченно. Как пейджить без пропусков?
    advanced_questions:
      - Как хранить дерево комментариев и считать ответы?
      - Как выстроить личную ленту блога с авторами и темами?

  - id: reddit-like
    title: "Reddit-like System"
    level: senior
    category: read-heavy
    primary_pattern: voting-ranking
    summary: >
      Платформа постов и комментариев с голосованием, жаркими сортировками
      (hot/new/top), кэшированием и партиционированием.
    requirements:
      - Посты и комментарии
      - Голосование (лайки/дизлайки)
      - Сортировки hot/new/top
    nfr:
      - p95 открытия треда не более 200 мс
      - Счёт голосов должен сходиться даже при массе конкурентных голосов
    constraints:
      - Голос конкурентный и критичен; нужна консистентность
      - Сортировка hot должна пересчитываться без full-scan
    baseline_load:
      dau: 100000000
      votes_per_sec: 100000
    topics: [voting, ranking, cache, partitioning, consistency]
    steps: []
    acceptance_criteria:
      - Модель голосования и защита от накрутки
      - Алгоритм hot-сортировки
      - Кэш и партиционирование
    evolution: []
    failure_questions:
      - Два пользователя одновременно голосуют за и против. Кто прав?
      - Миллион голосов прилетел за минуту. Как не потерять счёт?
      - Как накрутчик может продавить алгоритм горячести?
    advanced_questions:
      - Как реализовать алгоритм Reddit hot score и когда его пересчитывать?
      - Как хранить голос пользователя и делать переголосование атомарным?

  - id: video-streaming
    title: "Video Streaming"
    level: senior
    category: read-heavy
    primary_pattern: transcoding-cdn
    summary: >
      Платформа видео: загрузка, транскодинг (HLS/DASH), адаптивный битрейт,
      объектное хранилище и CDN-раздача.
    requirements:
      - Загрузка видео и получение плеем ссылок
      - Транскодинг в несколько битрейтов/разрешений
      - Адаптивный стриминг через HLS/DASH
    nfr:
      - p95 старта воспроизведения не более 3 c
      - Доступность раздачи > 99.9%
    constraints:
      - Обработка видео дорога и должна идти асинхронно
      - Пирамида битрейтов строится по популярности (даже cold start)
    baseline_load:
      videos_per_day: 5000
      plays_per_sec: 100000
    topics: [transcoding, hls, dash, object_storage, cdn, async_processing, abr]
    steps: []
    acceptance_criteria:
      - Пайплайн транскодинга и формирование сегментов
      - Адаптивный битрейт и плейлист
      - CDN и хот-кэширование
    evolution: []
    failure_questions:
      - Видео загружено, но транскодинга нет 10 минут. Что покажет плеер?
      - Ночной пик воспроизведений. Где узкое место?
      - Один видеофайл стал вирусным. Как подготовить CDN заранее?
    advanced_questions:
      - Почему HLS сегменты по 4-6 с и как выбрать размер чанка?
      - Как строить hot-кэш для вирусных видео без потери бюджета на CDN (cold start)?

  # ==========================================================================
  # 3. РЕАЛЬНОЕ ВРЕМЯ
  # ==========================================================================

  - id: chat-system
    title: "Chat System"
    level: middle
    category: realtime
    primary_pattern: websocket-delivery
    summary: >
      Система обмена сообщениями в реальном времени: WebSocket-соединения,
      1-1 и групповые чаты, доставка сообщений, статусы онлайна,
      персистентность истории и гарантии доставки.
    requirements:
      - Отправка и получение сообщений в реальном времени
      - Личные (1-1) и групповые чаты
      - Хранение истории
      - Статус онлайн/офлайн пользователя
    nfr:
      - Задержка доставки < 200 мс в виде пользователя
      - Надёжность доставки at-least-once
    constraints:
      - Пользователь может быть офлайн; сообщения должны быть доставлены позже
      - Порядок сообщений в рамках диалога должен сохраняться
      - Соединения постоянные и долгоживущие — нужен менеджмент
    baseline_load:
      messages_per_sec: 100000
      concurrent_connections: 1000000
    topics: [websocket, connection_management, message_delivery, persistence, order, group_chat, presence, push]
    steps: []
    acceptance_criteria:
      - Управление WebSocket-соединениями и шардинг по connection
      - Гарантии доставки и хранение истории
      - Порядок сообщений в 1-1 и в группе
    evolution:
      - id: l1
        name: HTTP-опрос
        summary: Клиенты опрашивают новые сообщения; просто, но задержки и расход ресурсов.
        diagram: "Client → (polling) → Server"
        prompts:
          - Какие проблемы long-polling и short-polling для чата?
          - Почему при 1 млн соединений polling не масштабируется?
      - id: l2
        name: WebSocket-сервер
        summary: Держим постоянные соединения через WebSocket; сохранение в БД.
        diagram: "Client ↔ WS gateway → Message service → DB"
        prompts:
          - Как масштабировать WS-слой (шардинг соединений, sticky/нет)?
          - Что хранится при записи: инкрементальный ID, статус доставки?
      - id: l3
        name: Очереди и fanout
        summary: Сообщения идут в Kafka; fanout в 1-1 и группы; наличие присутствия.
        diagram: "Sender → WS gateway → Kafka → receiver gateways → доставка"
        prompts:
          - Как гарантировать порядок в 1-1 (партиционирование по conversation_id)?
          - Как устроена доставка офлайн-пользователям и сохранение истории?
      - id: l4
        name: Масштаб и синхронизация
        summary: Чтение статусов «прочитано», typing, push и мультирегиональная маршрутизация.
        diagram: "WS + Push (fallback) → маршрутизация по региону"
        prompts:
          - Как устроены presence-статусы и как их шардировать?
          - Как совместить WebSocket и push при слабой сети?
    failure_questions:
      - Сервер с живыми WebSocket-соединениями упал. Что с подключёнными клиентами?
      - Сообщение доставлено дважды из-за ретрая. Как дедуплицировать?
      - Как обеспечить порядок сообщений при нескольких серверах доставки?
      - Клиент отключился на минуту и вернулся. Какие сообщения и как он получит?
    advanced_questions:
      - Как масштабировать миллионы одновременных WebSocket-соединений?
      - Как устроить доставку офлайн-пользователям и push-уведомления?
      - Как гарантировать total order в групповом чате (sequence, clock-skew)?

  - id: whatsapp-like
    title: "WhatsApp-like System"
    level: senior
    category: realtime
    primary_pattern: realtime-mediators
    summary: >
      Мессенджер уровня WhatsApp: личные и групповые чаты, медиа, галочки
      прочтения, индикаторы набора, push-уведомления и порядок сообщений.
    requirements:
      - Личные и групповые чаты
      - Медиа (изображения/видео) и вложения
      - Read receipts, typing indicators, push
    nfr:
      - Задержка доставки сообщения < 200 мс
      - Порядок сообщений в чате гарантируется
    constraints:
      - Группы до 1024 участников, массивная доставка
      - Хранение медиа отдельно от метаданных
    baseline_load:
      messages_per_sec: 1000000
      users: 2000000000
    topics: [websocket, group_chat, media, read_receipts, push, message_ordering]
    steps: []
    acceptance_criteria:
      - Модель доставки личных и групповых сообщений
      - Медиа и их хранение
      - Чтение/набор и push
    evolution: []
    failure_questions:
      - Группа из 1024 человек; как доставить сообщение всем быстро?
      - Сервер набора текста упал. Ломает ли это доставку сообщений?
      - Медиа загружается медленно. Как ускорить превью?
    advanced_questions:
      - Как обеспечить total order сообщений в группе (ClockSkew, last message id)?
      - Как совместить push и фоновые WebSocket при низкой сети?

  - id: notification-system
    title: "Notification System"
    level: middle
    category: realtime
    primary_pattern: queue-retry-provider
    summary: >
      Мультиканальная система уведомлений: email, SMS, push (APNs/FCM).
      Kafka-очереди, шаблоны, приоритеты, rate limiting по провайдерам,
      ретраи и failover между третьим сторонами.
    requirements:
      - Уведомления по email/SMS/push
      - Шаблоны, приоритеты и предпочтения каналов
      - Retry и failover между провайдерами
      - Контроль недоставленных (DLQ) и наблюдаемость
    nfr:
      - Не терять уведомления (at-least-once)
      - Скорость email не критична, push — секунды
    constraints:
      - Провайдеры могут быть недоступны и деградировать
      - Rate limit у провайдеров нельзя превышать
      - Один и тот же контент может прийти по нескольким каналам (нужна последовательность)
    baseline_load:
      notifications_per_sec: 50000
      channels: 3
    topics: [queue, retry, rate_limit, provider_failover, priority, push, apns, fcm, email, sms, templates, dedup, dlq]
    steps: []
    acceptance_criteria:
      - Пайплайн уведомлений и очереди по каналам
      - Rate limiting и failover провайдеров
      - Идемпотентность, приоритеты и дедупликация
    evolution:
      - id: l1
        name: Синхронная отправка
        summary: Бэкенд напрямую зовёт провайдера при создании уведомления.
        diagram: "Service → Provider (синхронно)"
        prompts:
          - Какие проблемы: задержка запроса, падение провайдера, потеря?
          - Почему необходима асинхронная очередь после первого масштаба?
      - id: l2
        name: Очередь по каналам
        summary: Уведомления идут в Kafka-очередь; воркеры каждого канала шлют сообщения.
        diagram: "Service → Kafka → Channel workers → Providers"
        prompts:
          - Как разделить каналы (топики) и обеспечить приоритеты?
          - Как не потерять уведомление при ретрае воркера?
      - id: l3
        name: Шаблоны и rate limiting
        summary: Шаблонизатор, лимитер на провайдера и fallback по цепочке каналов.
        diagram: "Kafka → template → rate limiter → provider A → fallback B"
        prompts:
          - Как собрать шаблон и язык/локаль получателя?
          - Как распределять лимиты между провайдерами без превышения их quota?
      - id: l4
        name: Масштаб и надёжность
        summary: Hot-каналы, дедупликация, DLQ и observability ретраев.
        diagram: "Kafka (партиции) → workers → providers → DLQ + метрики"
        prompts:
          - Что происходит при бёрсте в 100 раз (массовая рассылка)?
          - Как не задвоить сообщение при повторе и как отслеживать доставку?
    failure_questions:
      - SMS-провайдер перестал отвечать. Как не блокировать остальные каналы?
      - Пользователь отключил push. Как снизить ему email-шум и уважать предпочтения?
      - Огромный бёрст уведомлений. Как приоритизировать доставку по каналам?
      - Одно уведомление доставлено трижды. Как исключить дубликаты на этапе контента?
    advanced_questions:
      - Как строить глобальную дедупликацию уведомлений (idempotency key, TTL)?
      - Как хранить предпочтения каналов и строить fallback-цепочки?
      - Как строить систему подтверждений доставки (receipts) и сверку с провайдерами?

  - id: live-comments
    title: "Live Comments (для стримов/спорта)"
    level: middle
    category: realtime
    primary_pattern: pub-sub-fanout
    summary: >
      Поток живых комментариев на массовое событие (стрим/спорт): WebSocket,
      pub/sub, fan-out, упорядочивание и backpressure.
    requirements:
      - Отправка и показ комментариев в реальном времени
      - Фан-аут на тысячи одновременных зрителей
      - Ограничение/модерация потока
    nfr:
      - Задержка появления комментария < 300 мс у зрителя
      - Выдерживать всплески десятков тысяч сообщений/сек
    constraints:
      - Порядок в рамках одного стрима
      - Backpressure при медленном клиенте
    baseline_load:
      viewers_per_event: 1000000
      comments_per_sec: 20000
    topics: [websocket, pubsub, fanout, ordering, backpressure]
    steps: []
    acceptance_criteria:
      - Pub/sub фан-аут по событиям
      - Упорядочивание и лимиты на клиенте
      - Backpressure и лимит истории
    evolution: []
    failure_questions:
      - Всплеск комментариев во время гола. Как не уронить канал?
      - Медленный клиент тормозит всю трансляцию. Как применить backpressure?
      - Один сервер вещания перегружен. Как шарить по подписке?
    advanced_questions:
      - Как ограничить объём истории комментариев для нового зрителя?
      - Как сочетать модерацию и низкую задержку доставки?

  - id: online-presence
    title: "Online Presence System"
    level: middle
    category: realtime
    primary_pattern: heartbeat-ttl
    summary: >
      Сервис онлайн/офлайн статусов: heartbeat, TTL в Redis, WebSocket,
      распределяемый по нескольким дата-центрам.
    requirements:
      - Показ статуса «онлайн/офлайн» друзьям
      - Heartbeat от клиентов
      - Последняя активность ("был(а) 5 минут назад")
    nfr:
      - Обновление статуса не хуже 30 c
      - Минимальный трафик heartbeat
    constraints:
      - Heartbeat дешёвый и частый
      - Много пользователей пишут, мало читают чужой статус (но часто)
    baseline_load:
      users: 100000000
      heartbeats_per_sec: 2000000
    topics: [redis, ttl, websocket, distributed_presence, heartbeat]
    steps: []
    acceptance_criteria:
      - Модель heartbeat и TTL в Redis
      - Публикация статуса подписчикам
      - Распределённая инфраструктура
    evolution: []
    failure_questions:
      - Ложный офлайн из-за обрыва сети клиента. Как отличить от реального?
      - Redis потерял TTL. Все показываются онлайн бесконечно?
      - Фан-аут статусов на миллионы подписчиков одного аккаунта. Как решить?
    advanced_questions:
      - Как экономить связь при массовом обновлении статусов?
      - Как построить «строгое» распределённое presence через WebSocket-сессии?

  - id: multiplayer-game
    title: "Multiplayer Game Backend"
    level: senior
    category: realtime
    primary_pattern: authoritative-server
    summary: >
      Бэкенд многопользовательской игры: реальное время, WebSocket, матчмейкинг,
      игровые комнаты, синхронизация состояния на авторитетном сервере.
    requirements:
      - Создание/вход в игровые комнаты
      - Синхронизация игрового состояния в реальном времени
      - Матчмейкинг по уровню/региону
    nfr:
      - RTT < 50 мс для механики игры
      - Авторитетный сервер не допускает читов
    constraints:
      - Состояние частично хранится в памяти сервера
      - Потеря соединения должна восстанавливаться
    baseline_load:
      concurrent_players: 500000
      rooms_max: 250000
    topics: [websocket, realtime_state, matchmaking, game_rooms, authoritative]
    steps: []
    acceptance_criteria:
      - Модель игрового сервера и комнат
      - Авторитетная логика и анти-чит
      - Восстановление при падении сервера
    evolution: []
    failure_questions:
      - Игровой сервер с комнатой упал. Как пережить раунд без потери прогресса?
      - Задержка сети игрока выросла. Как компенсировать (prediction/reconciliation)?
      - Тысяча игроков ломанулась в матчмейкинг одновременно. Как не перегрузиться?
    advanced_questions:
      - Как выбрать между TCP и UDP/QUIC и какие алгоритмы компенсации сети?
      - Как масштабировать комнаты и делать матчмейкинг по рейтингу ELO?

  # ==========================================================================
  # 4. ОЧЕРЕДИ И АСИНХРОННОСТЬ
  # ==========================================================================

  - id: job-queue
    title: "Job Queue"
    level: middle
    category: queues
    primary_pattern: broker-ack-visibility
    summary: >
      Универсальная очередь задач: producer/consumer, брокер, ack, retry, DLQ,
      visibility timeout и конкурентные потребители.
    requirements:
      - Постановка задачи и её выполнение воркером
      - Управление ack/retry/DLQ
      - Конкурентные потребители одной очереди
    nfr:
      - Каждая задача выполнится хотя бы раз
      - Visibility timeout для надёжности при падении воркера
    constraints:
      - Дубликаты допустимы, но обрабатываются идемпотентно
      - Одна «плохая» задача не должна блокировать очередь
    baseline_load:
      jobs_per_sec: 5000
      workers: 200
    topics: [queue, broker, ack, retry, dlq, visibility_timeout, competing_consumers]
    steps: []
    acceptance_criteria:
      - Модель очереди и лимит видимости
      - Retry и DLQ
      - Конкурентные потребители и идемпотентность
    evolution: []
    failure_questions:
      - Воркер упал во время выполнения задачи. Что с visibility timeout?
      - Задача приносит exception каждый раз. Как не зациклить retry?
      - Два воркера взяли одну задачу. Как избежать двойного эффекта?
    advanced_questions:
      - Как выбрать между RabbitMQ и Kafka для очереди задач?
      - Как выстроить приоритетные и отложенные (delayed) очереди?

  - id: email-delivery
    title: "Distributed Email Service"
    level: middle
    category: queues
    primary_pattern: queue-provider-fallback
    summary: >
      Пайплайн доставки email: очередь, воркеры, retry, rate limiting,
      переключение между SMTP/API-провайдерами, репутация и идемпотентность.
    requirements:
      - Формирование и отправка email (транзакционные и массовые)
      - Очередь, воркеры и ретраи
      - Rate limit и fallback между провайдерами
      - Трекинг доставки (bounce, open, complaint)
    nfr:
      - Не терять письма (at-least-once)
      - Ограничивать скорость отправки по доменам
    constraints:
      - Провайдер может вернуть отказ; нужен быстрый failover
      - Дубликат письма недопустим
      - Репутация домена критична (спам-фильтры)
    baseline_load:
      emails_per_sec: 10000
      domains: 10000
      delivery_timeout_sec: 300
    topics: [queue, workers, retry, rate_limit, provider_fallback, idempotency, smtp, bounce, complaint, reputation, dlq]
    steps: []
    acceptance_criteria:
      - Пайплайн доставки и ретраев (очередь → воркер → провайдер)
      - Rate limiting по получателю/домену и fallback
      - Идемпотентность, обработка bounces и мониторинг репутации
    evolution:
      - id: l1
        name: Прямая отправка
        summary: Бэкенд отправляет письмо синхронно через один SMTP.
        diagram: "Service → SMTP (синхронно)"
        prompts:
          - Какие проблемы при синхронной отправке (таймауты, повторная отправка)?
          - Почему нужна очередь при массовых рассылках?
      - id: l2
        name: Очередь и воркеры
        summary: Письма в Kafka; воркеры отправляют через провайдеров с ретраями.
        diagram: "Service → Kafka → email workers → provider"
        prompts:
          - Как организованы ретраи и DLQ для «зависших» писем?
          - Как обеспечить отказоустойчивость воркера и дедупликацию?
      - id: l3
        name: Провайдеры и лимиты
        summary: Абстракция провайдера, rate limiter по доменам, failover между ними.
        diagram: "воркер → лимитер домена → provider A → (fallback) B"
        prompts:
          - Как переключаться на резервного провайдера без потери письма?
          - Как контролировать скорость по домену (репутация, списки рассылок)?
      - id: l4
        name: Наблюдаемость и здоровье
        summary: Трекинг bounce/complaint/opens, прогрев доменов, алерты на репутацию.
        diagram: "доставка → события (delivered/bounced/complaint) → аналитика"
        prompts:
          - Как отличать hard bounce от soft и что с ними делать?
          - Как строить метрики здоровья отправки (жалобы, отписки, репутация)?
    failure_questions:
      - Провайдер A отклонил письмо. Как и когда переключиться на B?
      - Домен получателя в чёрном списке. Как приостановить отправку?
      - Бэкенд может отправить письмо дважды. Как защититься?
      - Очередь сообщений выросла в 100 раз (массовая рассылка). Как не сжечь репутацию домена?
    advanced_questions:
      - Как строить поставку по приоритетам (транзакционные против массовых)?
      - Как трактовать жалобы и отписки глобально (preferences, suppression list)?
      - Как строить трекинг доставки end-to-end и сверку с провайдерами?

  - id: video-processing-pipeline
    title: "Video Processing Pipeline"
    level: senior
    category: queues
    primary_pattern: event-driven-transcode
    summary: >
      Асинхронный пайплайн обработки видео по событиям: загрузка -> очередь ->
      транскодинг-воркеры -> статус трекинга -> обработка ошибок.
    requirements:
      - Событие загрузки запускает цепочку обработки
      - Транскодинг на масштабируемых воркерах
      - Статус обработки и ретраи упавших задач
    nfr:
      - Обработка идёт асинхронно, пользователь не блокируется
      - Система должна пережить пик загрузок
    constraints:
      - Транскодинг может занять минуты/часы
      - Упавшие задачи не теряются
    baseline_load:
      videos_per_day: 10000
      workers: 500
    topics: [queue, transcoding, event_driven, status_tracking, retry, failed_jobs]
    steps: []
    acceptance_criteria:
      - Событийный пайплайн и очереди этапов
      - Масштабирование воркеров
      - Статус и DLQ
    evolution: []
    failure_questions:
      - Половина воркеров упала. Что с очередью и лагом?
      - Видео не конвертировалось, а пользователь уже ждёт код. Как уведомить?
      - Занятый воркер завис намертво. Как выявить и перезапустить?
    advanced_questions:
      - Как оркестрировать многоэтапный конвейер (split->transcode->package->publish)?
      - Как масштабировать вертикально/горизонтально именно транскодинг?

  - id: image-processing-pipeline
    title: "Image Processing Pipeline"
    level: middle
    category: queues
    primary_pattern: worker-pool
    summary: >
      Асинхронная обработка изображений: resize, компрессия, водяной знак,
      превью на пуле воркеров с очередью задач.
    requirements:
      - Приём изображения и постановка в очередь
      - Пресеты обработки (размеры, качество, водяной знак)
      - Выдача результата через CDN
    nfr:
      - Загрузка возвращается мгновенно, обработка асинхронна
      - Пул воркеров масштабируется под нагрузку
    constraints:
      - Обработка CPU-интенсивна
      - Нужна детерминированность результата
    baseline_load:
      images_per_sec: 150
      presets: 8
    topics: [queue, worker_pool, resize, compress, watermark, thumbnail]
    steps: []
    acceptance_criteria:
      - Модель очереди и пула воркеров
      - Пресеты обработки
      - Детерминизм и CDN
    evolution: []
    failure_questions:
      - Очередь растёт быстрее, чем обрабатывается. Как масштабировать?
      - Один пресет сломан и генерит ошибки. Как не забить DLQ?
      - Как гарантировать, что превью создастся для каждого оригинала?
    advanced_questions:
      - Как выбирать размер воркер-пула под стоимость CPU vs скорость?
      - Как строить цепочки зависимостей между пресетами?

  - id: data-import
    title: "Data Import System"
    level: middle
    category: queues
    primary_pattern: batch-import-validation
    summary: >
      Импорт данных из CSV: загрузка, валидация, парсинг, батч-обработка,
      прогресс и обработка ошибочных записей с retry.
    requirements:
      - Загрузка CSV пользователя
      - Валидация и парсинг строк
      - Батч-вставка и отчёт об ошибках
    nfr:
      - Пользователь видит прогресс и список ошибок
      - Большие файлы обрабатываются асинхронно
    constraints:
      - Ошибочные строки не блокируют остальной импорт
      - Объём импорта может быть миллионы строк
    baseline_load:
      max_rows: 10000000
      imports_per_day: 1000
    topics: [csv, validation, parsing, batch, progress, failed_records, retry]
    steps: []
    acceptance_criteria:
      - Пайплайн импорта и парсинга
      - Валидация и обработка ошибок
      - Прогресс и идемпотентность повторного импорта
    evolution: []
    failure_questions:
      - Файл с 1 млн строк, 100 с ошибками. Как обработать без повторного парсинга?
      - Пользователь загрузил тот же файл дважды. Как избежать дублей?
      - Пайплайн упал на 40%. С чего продолжить?
    advanced_questions:
      - Как строить идемпотентный импорт с чеками прогресса?
      - Как выполнять батч-вставку эффективно в PostgreSQL?

  - id: background-task-system
    title: "Background Task System (Celery-like)"
    level: middle
    category: queues
    primary_pattern: celery-architecture
    summary: >
      Система фоновых задач в стиле Celery: task queue, воркеры, планировщик,
      приоритеты, retry, DLQ.
    requirements:
      - Отложенные и периодические задачи
      - Воркеры с retry и приоритетом
      - DLQ для стабильно падающих задач
    nfr:
      - Задачи не теряются при падении воркера
      - Периодические задачи запускаются в нужное время
    constraints:
      - Одна задача не должна блокировать очередь
      - Приоритетные задачи обгоняют фоновые
    baseline_load:
      tasks_per_sec: 3000
      workers: 100
    topics: [task_queue, workers, scheduling, retry, priority_queues, dlq]
    steps: []
    acceptance_criteria:
      - Модель брокера и воркеров
      - Приоритетные/отложенные задачи
      - Гарантия выполнения
    evolution: []
    failure_questions:
      - Воркер завис на задаче. Как определить и освободить воркера?
      - Cron-задача пропущена из-за простоя кластера. Как догнать?
      - Приоритетные задачи «голодают» из-за фоновых. Как гарантировать порядок?
    advanced_questions:
      - Как реализовать отложенные задачи с точностью до секунды?
      - Как гарантировать единственное исполнение периодической задачи в кластере?

  # ==========================================================================
  # 5. DISTRIBUTED SYSTEMS
  # ==========================================================================

  - id: distributed-cache
    title: "Distributed Cache"
    level: middle
    category: distributed
    primary_pattern: cache-aside
    summary: >
      Распределённый кэш: стратегии (cache-aside, read-through, write-through,
      write-behind), TTL, eviction LRU/LFU, защита от stampede/penetration/avalanche.
    requirements:
      - Кэширование с разными стратегиями
      - Инвалидация и eviction
      - Защита от аномальных кэш-нагрузок
    nfr:
      - Хит-рейт высокий, задержка < 1 мс
      - Падение кэша не кладёт всю систему
    constraints:
      - Нужно защищаться от stampede, penetration и avalanche
      - Консистентность кэша и БД (staleness)
    baseline_load:
      read_qps: 1000000
      keys: 50000000
    topics: [cache_aside, read_through, write_through, write_behind, ttl, eviction, lru, lfu, stampede, penetration, avalanche, distributed_lock]
    steps: []
    acceptance_criteria:
      - Плюсы/минусы стратегий кэширования
      - Защита от cache stampede, penetration, avalanche
      - Инвалидация и согласованность с БД
    evolution: []
    failure_questions:
      - Все ключи истекли одновременно. Как избежать лавины в БД?
      - Атакующий шлёт запросы на несуществующие ключи. Как защититься (bloom)?
      - Падение кластера Redis. Как не уронить БД массовым запросом?
    advanced_questions:
      - Как реализовать cache stampede (single-flight, mutex, probabilistic TTL)?
      - Как строить write-behind безопасно и с потерянными обновлениями?

  - id: distributed-lock
    title: "Distributed Lock"
    level: senior
    category: distributed
    primary_pattern: lease-fencing
    summary: >
      Распределённая блокировка: Redis lock, DB lock, ZooKeeper, lease/TTL,
      fencing token, проблема Redlock и split-brain.
    requirements:
      - Взаимное исключение в кластере
      - TTL/lease и автоматическое освобождение
      - Защита от «мёртвой» блокировки
    nfr:
      - Блокировка не должна висеть вечно
      - Должно защищаться от одновременного владения
    constraints:
      - Часы и сети ненадёжны; block надо делать устойчивым
      - Нельзя допускать фальшивое владение после паузы GC
    baseline_load:
      lock_ops_per_sec: 1000
      ttl_sec: 30
    topics: [redis_lock, database_lock, zookeeper, lease, ttl, fencing_token, redlock, split_brain]
    steps: []
    acceptance_criteria:
      - Механизм lease/TTL освобождения
      - Fencing token против фальшивого владения
      - Ограничения Redlock
    evolution: []
    failure_questions:
      - Владелец блокировки завис на GC на 5 секунд и блок кончился. Кто получит лояльность?
      - Сеть разорвалась между нодами. Два узла считают себя владельцами. Как отличить?
      - Redis-мастер упал после выдачи блокировки. Пропала ли блокировка?
    advanced_questions:
      - Почему Redlock спорен и когда он приемлем?
      - Как реализовать fencing token на БД/хранилище?

  - id: distributed-counter
    title: "Distributed Counter"
    level: middle
    category: distributed
    primary_pattern: sharded-atomic-counter
    summary: >
      Счётчик просмотров/лайков в масштабе: atomic INCR в Redis, шардированные
      счётчики, eventual consistency, батчинг и агрегация записи.
    requirements:
      - Инкремент счётчика
      - Чтение актуального значения
      - Сброс/архивация за период
    nfr:
      - Высокая пропускная способность инкрементов
      - Малая ошибка в реальном времени допустима
    constraints:
      - Один «горячий» ключ — узкое место
      - Нельзя потерять инкременты при падении
    baseline_load:
      increments_per_sec: 1000000
      counters: 10000000
    topics: [atomic_increment, redis_incr, sharded_counters, eventual_consistency, batching, write_aggregation]
    steps: []
    acceptance_criteria:
      - Атомарный инкремент и шардирование
      - Батчинг/агрегация записей
      - Восстановление реального значения
    evolution: []
    failure_questions:
      - Один вирусный пост создаёт миллион инкрементов в секунду на один ключ. Как шардировать?
      - Redis потерял часть инкрементов. Как восстановить точность?
      - Как считать итог по месяцу без дорогого sum всех счётчиков?
    advanced_questions:
      - Как строить иерархические агрегаты (минута -> час -> день)?
      - Как обеспечить стойкость к потере и восстановление из журнала?

  - id: distributed-id-generator
    title: "Distributed ID Generator"
    level: middle
    category: distributed
    primary_pattern: snowflake
    summary: >
      Генерация уникальных ID в кластере: UUID, auto-increment, Snowflake,
      ticket-сервис, worker ID, sequence, clock drift и упорядочивание.
    requirements:
      - Генерация уникальных ID без коллизий
      - Постоянная производительность
      - Приблизительная упорядоченность по времени
    nfr:
      - Миллионы ID в секунду
      - Офлайн-генерация без единой точки отказа
    constraints:
      - ID не должны конфликтовать между нодами
      - Порядок ID приблизительно соответствует времени создания
      - Требования к ID зависят от того, что это: ключ БД, ссылка, сообщение в очереди
    baseline_load:
      ids_per_sec: 1000000
      nodes: 1000
    topics: [uuid, auto_increment, snowflake, timestamp, worker_id, sequence, clock_drift, ordering, ticket_server, caching_sequence]
    steps: []
    acceptance_criteria:
      - Сравнение UUID vs auto-increment vs Snowflake vs ticket-сервис
      - Формат Snowflake и его поля (битовые размеры)
      - Обработка clock drift и коллизий, масштабирование через range
    evolution:
      - id: l1
        name: Монотонная БД
        summary: Один БД-счётчик или auto-increment; просто, но одна точка и узкое место.
        diagram: "App → DB serial (одна точка инкремента)"
        prompts:
          - Что ломается при пиковой нагрузке записи?
          - Как обеспечить отказоустойчивость, если это единственный источник ID?
      - id: l2
        name: UUID/случайные
        summary: UUID v4/случайные 128 бит; без координации, но беспорядочен и большой.
        diagram: "App → UUID (без обращения к серверу)"
        prompts:
          - Какие проблемы UUID как ключа БД (размер, фрагментация индексов)?
          - Когда случайность допустима, а когда нужна упорядоченность по времени?
      - id: l3
        name: Snowflake
        summary: timestamp + worker_id + sequence в 64 битах; локально, порядок и уникальность.
        diagram: "Node → snowflake(timestamp | worker | sequence)"
        prompts:
          - Как устроена битовая раскладка и почему 64 бита?
          - Что происходит при clock drift назад и при переполнении sequence?
      - id: l4
        name: Масштаб через ticket/range
        summary: Тicket-сервер или заранее выделенные диапазоны ID (range) для нод.
        diagram: "Ticket server → range [a,b) → нода кэширует диапазон"
        prompts:
          - Как range-выделение снижает нагрузку на центр?
          - Каков компромисс: дыры в ID, предсказуемость, потери при рестарте?
    failure_questions:
      - Часы ноды «уехали» назад. Как не сгенерировать дубликат ID?
      - Выделено 10 бит на worker id, а нод 2000. Что делать?
      - Нужна строгая упорядоченность ID по времени. Почему это невозможно в масштабе?
      - Тicket-сервер упал на полминуты. Как продолжать генерацию?
    advanced_questions:
      - Как сравнить Snowflake и UUID v7 (time-ordered) по свойствам?
      - Как обеспечить глобальную видимость порядка через центральный sequencer?
      - Как выбирать размеры полей timestamp/worker/sequence под горизонт в 10+ лет?
    advanced_questions:
      - Как построить Snowflake из 64 бит с учётом эпохи и rollover?
      - Как комбинировать ID со встроенной информацией (регион/шарда)?

  - id: distributed-scheduler
    title: "Distributed Scheduler"
    level: senior
    category: distributed
    primary_pattern: leader-election-ownership
    summary: >
      Планировщик периодических задач: cron в кластере, leader election,
      владение задачей (ownership), retry и защита от дубликатов.
    requirements:
      - Запуск задач по расписанию
      - Только один узел выполняет задачу
      - Пропущенные задачи догоняются
    nfr:
      - Задача в нужный момент и только один раз
      - Кластер переживает падение лидера
    constraints:
      - Нельзя запустить задачу дважды в одном окне
      - Расписание может меняться
    baseline_load:
      jobs: 100000
      runs_per_min: 5000
    topics: [cron, scheduler, leader_election, distributed_lock, ownership, retry, missed_jobs, dedup]
    steps: []
    acceptance_criteria:
      - Leader election и ownership
      - Защита от дублей выполнения
      - Обработка пропущенных задач
    evolution: []
    failure_questions:
      - Лидер упал после старта задачи, но до завершения. Кто выполнит её заново?
      - Два узла считают себя лидерами. Как предотвратить дубль?
      - Задача пропущена из-за долгого простоя. Как отработать catch-up?
    advanced_questions:
      - Как реализовать распределённый cron с кварцевой точностью (Lease-based leader)?
      - Как хранить журнал запусков и аудит?

  - id: distributed-kv-store
    title: "Distributed Key-Value Store"
    level: senior
    category: distributed
    primary_pattern: consistent-hashing-replication
    summary: >
      KV-хранилище уровня Dynamo/Cassandra: consistent hashing, партиционирование,
      репликация, quorum, read repair, hinted handoff, anti-entropy,
      gossip и хранение (SST/LSM, WAL, compaction).
    requirements:
      - PUT/GET по ключу
      - Партиционирование и репликация поверх узлов
      - Переносимость отказа ноды и вставки новых узлов
    nfr:
      - Масштабируемость и устойчивость к отказам
      - Доступность в ряде сценариев важнее строгой консистентности
    constraints:
      - Ноды могут падать и сеть делиться
      - Eventual consistency допустима
    baseline_load:
      nodes: 100
      kv_qps: 1000000
      value_size_kb: 4
    topics: [consistent_hashing, partitioning, replication, quorum, read_repair, hinted_handoff, anti_entropy, gossip, sst, lsm_tree, wal, compaction, versioning]
    steps: []
    acceptance_criteria:
      - Consistent hashing и vnode
      - Quorum и выбор (R+W > N), read repair, hinted handoff, anti-entropy
      - Хранение: вставка, обновление и удаление через LSM/SST, compaction
    evolution:
      - id: l1
        name: Один узел
        summary: KV в памяти или на диске одного процесса; бенчмарки, но нет масштаба.
        diagram: "Client → KV node (in-memory)"
        prompts:
          - Что ломается первым при росте данных и нагрузки?
          - Как пережить отказ единственного узла?
      - id: l2
        name: Шардирование по consistent hashing
        summary: Ключи распределяются по кольцу; добавление узла двигает минимум ключей.
        diagram: "Client → ring (nodes) → vnode → шард"
        prompts:
          - Почему chosen consistent hashing вместо hash(key) % N?
          - Как вводятся vnodes и что происходит при добавлении узла?
      - id: l3
        name: Репликация и quorum
        summary: N репликаций на соседних нодах; R+W > N; hiсka и hint-перессылка.
        diagram: "write W → N replicas; read R → свежая версия"
        prompts:
          - Как выбираются N, R, W (как в Dynamo) и какой tradeoff?
          - Что делает hinted handoff и когда данные «уезжают» на край?
          - Как читатель определяет свежую версию (векторные часы)?
      - id: l4
        name: Anti-entropy и storage
        summary: Фоновое сравнение хешей (Merkle-деревья), ремонт копий, LSM-хранение со сжатием.
        diagram: "фоновые воркеры → compare (Merkle) → repair; SST + compaction"
        prompts:
          - Чем read repair отличается от антиэнтропийного фонового ремонта?
          - Зачем LSM/SST и как работает compaction (SST-структура, WAL)?
          - Как строить tombstone/удаление без потери консистентности?
    failure_questions:
      - Добавили ноду. Как мигрируют данные без простоя и без «шторма»?
      - Реплика вернула stale данные. Как читатель узнает, чему верить?
      - Сеть разделилась на два кластера. Что с консистентностью и как это выходит наружу?
      - Удалёный узел долго отсутствовал и вернулся со старыми данными. Как ремонтировать?
    advanced_questions:
      - Как выбрать N, R, W под требования консистентности и доступности?
      - Как реализовать gossip и anti-entropy эффективно (Merkle-деревья)?
      - Как строить версионирование и разрешение конфликтов (vector clocks, last-write-wins)?

  - id: distributed-file-storage
    title: "Distributed File Storage"
    level: senior
    category: distributed
    primary_pattern: chunk-replication-erasure
    summary: >
      Распределённое файловое хранилище: разбивка на чанки, metadata-сервер,
      репликация, erasure coding, консистентность и восстановление.
    requirements:
      - Запись/чтение больших файлов
      - Хранение метаданных (чанки, местоположения)
      - Устойчивость к потере нод
    nfr:
      - Гарантированная целостность при отказе N нод
      - Масштаб до петабайт
    constraints:
      - Метаданные и данные в разных подсистемах
      - Восстановление из реплик/erasure
    baseline_load:
      total_pb: 50
      files_per_sec: 1000
    topics: [chunks, metadata_server, replication, erasure_coding, object_storage, consistency, recovery]
    steps: []
    acceptance_criteria:
      - Хранение чанков и метаданных
      - Репликация vs erasure coding
      - Восстановление после отказа
    evolution: []
    failure_questions:
      - Metadata-сервер упал. Как читать файлы без него?
      - Нода с несколькими чанками сгорела. Как восстановить недостающие куски?
      - Два файла ссылаются на один чанк. Как счётчик ссылок и сборка мусора?
    advanced_questions:
      - Как выбрать коэффициент erasure coding (k,m) под надёжность и стоимость?
      - Как строить ребалансировку без шторма сетевого трафика?

  # ==========================================================================
  # 6. DATABASE SYSTEM DESIGN
  # ==========================================================================

  - id: database-scaling
    title: "Database Scaling"
    level: middle
    category: db
    primary_pattern: replicas-partitioning
    summary: >
      Эволюция одной БД: vertical scaling, read replicas, репликация,
      партиционирование/шардирование, кэш и CQRS.
    requirements:
      - Приём растущей нагрузки чтения и записи
      - Горизонтальное масштабирование
      - Обеспечение отказоустойчивости
    nfr:
      - Задержка p95 < 50 мс при росте
      - База не должна быть единой точкой отказа
    constraints:
      - Сначала дешёвые меры (реплики/кэш), потом шардирование
      - Нужно балансировать между сложностью и масштабом
    baseline_load:
      read_qps: 100000
      write_qps: 5000
      data_gb: 500
    topics: [vertical_scaling, read_replicas, replication, partitioning, sharding, caching, cqrs]
    steps: []
    acceptance_criteria:
      - Пошаговая стратегия масштабирования
      - Когда нужен шардинг, а когда кэш/реплики
      - Чтение/запись и лаг репликации
    evolution:
      - id: l1
        name: Одна машина
        summary: Всё на одном PostgreSQL, вертикальный масштаб ограничен.
        diagram: "App → PostgreSQL (single)"
        prompts:
          - Что первым упирается в лимиты? Как считаем capacity?
      - id: l2
        name: Read replicas
        summary: Разделяем чтение и запись, реплики для чтения.
        diagram: "App → Primary (write) + Read Replicas"
        prompts:
          - Что с replication lag при read-after-write?
          - Как маршрутизировать запросы?
      - id: l3
        name: Кэш
        summary: Снижаем нагрузку на БД через кэш горячих данных.
        diagram: "App → Cache → Primary + Read Replicas"
        prompts:
          - Какой кэш помогает, а какой нет?
      - id: l4
        name: Шардирование
        summary: Разбиваем по ключу шарда; решаем cross-shard запросы.
        diagram: "App → Shards (0..N)"
        prompts:
          - Какой shard key? Какие запросы ломаются?
      - id: l5
        name: CQRS
        summary: Отдельные модели чтения и записи для сложных чтений.
        diagram: "Write model → Event → Read model"
        prompts:
          - Когда CQRS оправдан и как обновлять read model?
    failure_questions:
      - Read replica отстала, пользователь не увидел свою запись. Как это исправить?
      - Шард переполнен по данным. Как решардировать без простоя?
      - Primary упал. Как быстро переключиться и что с потерянными транзакциями?
    advanced_questions:
      - Как рассчитать, когда вертикальный предел достигнут и нужен шардинг?
      - Как построить горячий standby и automatic failover (Patroni)?

  - id: sharded-database
    title: "Sharded Database"
    level: senior
    category: db
    primary_pattern: shard-key-consistent-hashing
    summary: >
      Глубокий разбор шардирования: выбор shard key, hash vs range, consistent
      hashing, hot spot, решардинг и cross-shard запросы.
    requirements:
      - Горизонтальное распределение данных
      - Равномерная нагрузка по шардам
      - Работа при добавлении/удалении шардов
    nfr:
      - Минимальные cross-shard запросы
      - Решардинг без длительного простоя
    constraints:
      - Shard key выбирается заранее и менять его дорого
      - Часть запросов по не-shard-ключу проблематична
    baseline_load:
      shards: 64
      data_tb: 20
      qps: 500000
    topics: [shard_key, hash_sharding, range_sharding, consistent_hashing, hotspot, resharding, cross_shard]
    steps: []
    acceptance_criteria:
      - Выбор и обоснование shard key
      - Способы шардирования (hash/range/consistent)
      - Решардинг и hot spot
    evolution: []
    failure_questions:
      - Пользователи распределены неравномерно по ключу. Как найти и устранить hot spot?
      - Нужно добавить 10 новых шардов. Как минимизировать перемещение данных?
      - Запрос требует данные из двух шардов. Как его перепроектировать?
    advanced_questions:
      - Как строить lookup-таблицу и глобальные вторичные индексы поверх шардов?
      - Как реализовать распределённые транзакции между шардами и стоит ли?

  - id: distributed-sql-db
    title: "Distributed SQL Database"
    level: senior
    category: db
    primary_pattern: consensus-raft
    summary: >
      Построение БД, переживающей отказ дата-центра: репликация, quorum,
      consensus (Raft), leader election и консистентность.
    requirements:
      - Приём транзакций при отказе части нод
      - Репликация с консенсусом
      - Полностью переживать отказ дата-центра
    nfr:
      - Линейная консистентность для ключевых операций
      - Доступность при потере дата-центра
    constraints:
      - Нужен консенсус, а не «на глазок» синхронизация
      - Компромисс задержки между регионами
    baseline_load:
      regions: 3
      tx_per_sec: 10000
    topics: [replication, quorum, consensus, raft, leader_election, consistency, failover]
    steps: []
    acceptance_criteria:
      - Роль Raft/consensus и leader election
      - Quorum и голосование
      - Переживание отказа дата-центра
    evolution: []
    failure_questions:
      - Потеряли одного из трёх членов Raft. Кластер жив? Как выбрать нового лидера?
      - Network partition разделил кластер. Что с записями в меньшей части?
      - Задержка до Raft-лидера из европейского региона большая. Как ускорить чтения без потери консистентности?
    advanced_questions:
      - Почему в распределённой БД теряют линейную консистентность под partition?
      - Как сочетать multi-region synced репликацию и локальные чтения?

  - id: read-replica-architecture
    title: "Read Replica Architecture"
    level: junior
    category: db
    primary_pattern: read-replicas-lag
    summary: >
      Отделение чтения от записи: первичный узел, реплики, replication lag,
      read-after-write consistency и маршрутизация запросов.
    requirements:
      - Масштабирование чтения репликами
      - Обработка лага репликации
      - Маршрутизация запросов
    nfr:
      - Чтение масштабируется добавлением реплик
      - Пользователь видит собственные записи сразу
    constraints:
      - Репликация асинхронная -> возможен лаг
      - Маршрутизация на уровне приложения или прокси
    baseline_load:
      read_qps: 80000
      write_qps: 3000
      replicas: 4
    topics: [primary, replicas, replication_lag, read_after_write, routing]
    steps: []
    acceptance_criteria:
      - Механизм синхронизации реплик
      - Обработка replication lag и read-after-write
      - Failover первичного узла
    evolution: []
    failure_questions:
      - Реплика отстала на 10 минут. Пользователь увидел старую версию. Как не допустить?
      - Первичный узел упал. Как поднять реплику в primary быстро?
      - Реплика перегружена. Как снять лишний трафик?
    advanced_questions:
      - Как реализовать session-consistency (replica read после собственной записи)?
      - Как наблюдать и алертить replication lag безопасно?

  - id: cqrs-system
    title: "CQRS System"
    level: senior
    category: db
    primary_pattern: cqrs-projections
    summary: >
      Разделение команд и запросов: command (write model) -> event -> read model
      (projection), eventual consistency и перестройка проекций.
    requirements:
      - Запись через command model
      - Чтение через оптимизированную read model
      - Синхронизация моделей событиями
    nfr:
      - Чтение жёстко оптимизировано под запросы
      - Раздельное масштабирование чтения и записи
    constraints:
      - Read model eventually consistent
      - Проекции надо уметь перестраивать
    baseline_load:
      command_qps: 1000
      query_qps: 50000
    topics: [command_model, query_model, event_propagation, eventual_consistency, rebuilding_projections]
    steps: []
    acceptance_criteria:
      - Две модели и поток событий между ними
      - Построение/перестройка проекций
      - Компромисс с консистентностью
    evolution: []
    failure_questions:
      - Команда выполнилась, но событие потерялось. Read model устарела. Как восстановить?
      - Нужно перестроить проекцию с нуля. Как сделать без простоя?
      - Пользователь видит старые данные. Какие сценарии требуют строгой консистентности?
    advanced_questions:
      - Как строить идемпотентные обработчики событий для проекций?
      - Когда CQRS избыточен, а когда оправдан?

  # ==========================================================================
  # 7. KAFKA / EVENT-DRIVEN
  # ==========================================================================

  - id: event-bus
    title: "Event Bus (Kafka)"
    level: middle
    category: kafka
    primary_pattern: topic-partition-consumer-group
    summary: >
      Основы событийной шины: producer, consumer, topic, partition, consumer
      group, offset, упорядочивание и масштабирование потребления.
    requirements:
      - Публикация и потребление событий
      - Группировка потребителей
      - Управление offset
    nfr:
      - Высокая пропускная способность
      - At-least-once доставка
    constraints:
      - Порядок только в пределах одной партиции
      - Число потребителей ограничено числом партиций
    baseline_load:
      events_per_sec: 500000
      partitions_per_topic: 24
    topics: [producer, consumer, topic, partition, consumer_group, offset, ordering]
    steps: []
    acceptance_criteria:
      - Модель партиций и групп
      - Гарантии порядка и доставки
      - Масштабирование потребителей
    evolution: []
    failure_questions:
      - Потребитель отстал и offset очень большой. Как нагнать без потери?
      - Порядок событий сломан между партициями. Почему и как это влияет на бизнес?
      - Потребитель умер между чтением и commit. Повторная обработка события. Как быть?
    advanced_questions:
      - Как выбрать число партиций под ключ упорядочивания?
      - Как строить idempotent producer и гарантировать отсутствие дубликатов?

  - id: event-driven-microservices
    title: "Event-Driven Microservices"
    level: senior
    category: kafka
    primary_pattern: choreography-orchestration
    summary: >
      Разделение микросервисов событиями (Order->Payment->Inventory->Delivery):
      события против команд, хореография против оркестрации.
    requirements:
      - Координация сервисов событиями
      - Независимое масштабирование
      - Обработка сбоев шага
    nfr:
      - Сервисы слабо связаны
      - Отказ одного шага не роняет остальные
    constraints:
      - Нужно решить: хореография или оркестрация
      - Дубликаты и потеря событий обрабатываются
    baseline_load:
      services: 8
      events_per_sec: 20000
    topics: [event, command, choreography, orchestration]
    steps: []
    acceptance_criteria:
      - События vs команды
      - Хореография vs оркестрация
      - Обработка сбоев
    evolution: []
    failure_questions:
      - Сервис Payment недоступен. Как система реагирует при хореографии?
      - Событие оплаты обработалось дважды (дубль). Как защититься (идемпотентно)?
      - Несколько сервисов подписались на одно событие. Кто должен реагировать?
    advanced_questions:
      - Когда выбрать сагу, а когда хореографию и в чём риск каскадов?
      - Как обеспечить observability в распределённой событийной цепочке?

  - id: event-sourcing
    title: "Event Sourcing"
    level: senior
    category: kafka
    primary_pattern: event-store-aggregate
    summary: >
      Хранение состояния как последовательности событий: event store, aggregate,
      snapshots, replay и проекции.
    requirements:
      - История всех изменений состояния
      - Восстановление состояния через replay
      - Построение проекций
    nfr:
      - Полный аудит изменений
      - Чтение текущего состояния быстрее через snapshot
    constraints:
      - События иммутабельны и не удаляются
      - Нужно решать проблему версионирования событий
    baseline_load:
      events_per_sec: 10000
      events_per_aggregate: 10000
    topics: [event_store, aggregate, events, snapshots, replay, projections]
    steps: []
    acceptance_criteria:
      - Модель event store и aggregate
      - Snapshotting и replay
      - Проекции и миграция событий
    evolution: []
    failure_questions:
      - Событий столько, что replay слишком долгий. Как ускорить?
      - Схема события изменилась. Как обработать старые события?
      - Обработчик проекции упал на полпути. Как перестроить без повторов?
    advanced_questions:
      - Как обеспечить idempotent обработку событий в проекциях?
      - Как сочетать Event Sourcing с CQRS и transactional outbox?

  - id: transactional-outbox
    title: "Transactional Outbox"
    level: senior
    category: kafka
    primary_pattern: outbox-cdc
    summary: >
      Надёжная публикация событий из транзакции БД: бизнес-данные + outbox-событие
      в одной транзакции, затем CDC/воркер публикует в Kafka.
    requirements:
      - Не терять события, публикуемые после транзакции
      - Событие и бизнес-запись — атомарны
      - Публикация в Kafka с гарантией
    nfr:
      - Никаких «двойных публикаций» и потерь
      - Задержка публикации минимальна
    constraints:
      - Нужна атомарность записи события с бизнес-данными
      - Публикация не должна упираться в транзакцию БД
    baseline_load:
      events_per_sec: 5000
      processing_lag: 2s
    topics: [outbox, cdc, transaction, kafka, worker, delivery_guarantee]
    steps: []
    acceptance_criteria:
      - Паттерн атомарного outbox
      - CDC vs воркер как реле
      - Решения по дубликатам и идемпотентности
    evolution: []
    failure_questions:
      - Воркер-реле упал. События лежат в outbox. Что дальше?
      - Обработчик прочитал outbox дважды. Как избежать двойной публикации?
      - Транзакция коммитится, но выгрузка события падает. Как гарантировать?
    advanced_questions:
      - CDC (Debezium) vs батч-поллинг outbox: плюсы/минусы?
      - Как построить идемпотентный потребляющий сервис поверх outbox-событий?

  - id: saga-pattern
    title: "Saga Pattern"
    level: senior
    category: kafka
    primary_pattern: saga-compensation
    summary: >
      Распределённая транзакция через сагу: хореография/оркестрация,
      компенсирующие транзакции и обработка сбоев на каждом шаге.
    requirements:
      - Выполнение бизнес-процесса через несколько сервисов
      - Откат через компенсации при сбое
      - Координация шагов
    nfr:
      - Не блокировать ресурсы долгими транзакциями
      - Отказ одного шага компенсируется
    constraints:
      - ACID транзакция невозможна между сервисами
      - Компенсации должны быть идемпотентны
    baseline_load:
      sagas_per_sec: 500
      steps_per_saga: 6
    topics: [distributed_transaction, choreography, orchestration, compensating_transactions, failure_handling]
    steps: []
    acceptance_criteria:
      - Хореография vs оркестрация
      - Компенсирующие транзакции
      - Обработка сбоя на конкретном шаге
    evolution: []
    failure_questions:
      - Inventory подтвердил бронь, но Payment упал. Как откатить бронь?
      - Компенсация сама упала. Кто её повторит и как (DLQ)?
      - Дубль вызова компенсации. Как не откатить дважды?
    advanced_questions:
      - Как реализовать оркестратор-сагу с persist состояния?
      - Как обеспечить компенсации без промежуточного состояния «дыры»?

  - id: exactly-once-processing
    title: "Exactly-Once Processing"
    level: senior
    category: kafka
    primary_pattern: idempotency-effective-once
    summary: >
      Гарантии доставки и обработки: at-most-once, at-least-once, effectively-once,
      идемпотентность потребителя и дедупликация.
    requirements:
      - Обработка без дублей и потерь
      - Потребитель устойчив к повторным доставкам
      - Согласованность с внешними системами
    nfr:
      - Не потерять ни одного события при сбое
      - Не дублировать побочные эффекты
    constraints:
      - Истинный «exactly once» недостижим между системами
      - Идемпотентность достигается на уровне приложения
    baseline_load:
      events_per_sec: 50000
      unique_keys: 10000000
    topics: [at_most_once, at_least_once, effectively_once, idempotency, deduplication]
    steps: []
    acceptance_criteria:
      - Различие гарантий доставки
      - Достижение effectively-once
      - Дедупликация и идемпотентность
    evolution: []
    failure_questions:
      - Потребитель добавил деньги дважды из-за ретрая. Как защититься?
      - Дедупликационный кэш сбросился. Что с дублями?
      - Как трактовать exactly-once в Kafka (transactions) и его ограничения?
    advanced_questions:
      - Насколько реален exactly-once через идемпотентный вывод?
      - Как строить распределённую дедупликацию без единой точки отказа?

  # ==========================================================================
  # 8. E-COMMERCE
  # ==========================================================================

  - id: ecommerce-backend
    title: "E-commerce Backend"
    level: middle
    category: ecommerce
    primary_pattern: order-inventory-payment
    summary: >
      Бэкенд интернет-магазина: пользователи, каталог, корзина, заказы,
      платежи и склад как единая система.
    requirements:
