      - Персонализированные рекомендации
      - Высокая доступность раздачи
    nfr:
      - Старт воспроизведения < 3 c
      - Задержка плейбэка без буферизации
    constraints:
      - Контент-каталог большой и распределён
      - Холодный старт популярных тайтлов
    baseline_load:
      subscribers: 250000000
      bitrates: 8
    topics: [abr, transcoding, recommendations, cdn, cold_start, resilience]
    steps: []
