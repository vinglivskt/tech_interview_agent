  - id: ddos-protection
    title: "DDoS Protection"
    level: senior
    category: security
    primary_pattern: edge-scrub
    summary: >
      Защита от DDoS: edge-абсорбция, rate limiting, WAF, фильтрация,
      sinkhole и масштабирование ёмкости.
    requirements:
      - Поглощение объёмных DDoS атак
      - Фильтрация вредоносного трафика
      - Сохранение доступности легитимных клиентов
    nfr:
      - Легитимный трафик переживает атаку
      - Идентификация ботов/CRC
    constraints:
      - Огромные объёмы трафика нельзя обслуживать на origin
      - Нужен вендор с большой ёмкостью и scrub-центрами
    baseline_load:
      attack_volume_gbps: 1000
      legit_rps: 500000
    topics: [edge, rate_limiting, waf, dns, sinkhole, capacity]
    steps: []
    acceptance_criteria:
      - Стратегия поглощения атаки
      - WAF и rate limiting
      - Идентификация легитимного трафика
    evolution: []
    failure_questions:
      - Объёмная атака в 1 Tbps. Где взять ёмкость?
      - Л7-атака овощими запросами обошла rate limit. Как фильтровать?
      - Боты маскируются под легитим. Как отличить?
    advanced_questions:
      - Как строить self-serve масштабирование и аутентификацию ботов (challenge)?

  - id: api-security
    title: "API Security"
    level: middle
    category: security
    primary_pattern: authz-input-validation
    summary: >
      Безопасность API: аутентификация/авторизация, валидация входных данных,
      защита от IDOR/Injection, rate limiting и секреты.
    requirements:
      - Аутентификация и авторизация запросов
      - Защита от распространённых атак (IDOR, injection, XSS)
      - Аудит доступа
    nfr:
      - Минимальные привилегии
      - Валидация на границе
    constraints:
      - Запрещено доверять входным данным
      - Нужно логировать доступ
    baseline_load:
      api_rps: 300000
      key_rotation_days: 30
    topics: [authn, authz, input_validation, idor, injection, rate_limiting, secrets]
    steps: []
    acceptance_criteria:
      - Авторизация и контроль доступа
      - Валидация входных данных
      - Логирование и детект аномалий
    evolution: []
    failure_questions:
      - Пользователь подставил чужой ID (IDOR). Как предотвратить?
      - SQL-инъекция через параметр. Как обезопасить запросы?
      - Ключ API утёк в логи. Как ротировать без простоя?
    advanced_questions:
      - Как строить WAF-агентства для специфических атак и авторизации через OAuth?

  - id: secrets-management
    title: "Secrets Management"
    level: middle
    category: security
    primary_pattern: vault-rotation
    summary: >
      Управление секретами: безопасное хранение, шифрование, ротация,
      доступ по политике и аудит.
    requirements:
      - Хранение паролей/ключей/токенов
      - Шифрование в покое и передаче
      - Ротация секретов
    nfr:
      - Секреты не в коде и не в логах
      - Ротация автоматизирована
    constraints:
      - Доступ к секретам по минимальным привилегиям
      - Аудит доступа обязателен
    baseline_load:
      secrets: 10000
      rotation_hours: 24
    topics: [vault, encryption, rotation, policies, audit, kms]
    steps: []
    acceptance_criteria:
      - Централизованное хранилище и шифрование
      - Ротация и аренда секретов
      - Политики доступа и аудит
    evolution: []
    failure_questions:
      - Ключ шифрования похищен. Как ротировать и перешифровать данные?
      - Секрет попал в репозиторий. Как быстро найти и инвалидировать?
      - Разработчик не должен видеть прод-ключ. Как построить RBAC по секретам?
    advanced_questions:
      - Как строить dynamic secrets с ограниченным сроком жизни (Vault)?

  - id: audit-log-system
    title: "Audit Log System"
    level: senior
    category: security
    primary_pattern: append-only-integrity
    summary: >
      Журнал аудита: append-only хранение, целостность (immutable), запросы
      по событиям и retention.
    requirements:
      - Фиксация событий доступа/изменений
      - Целостность и невозможность подделки
      - Запрос по юзеру/событию
    nfr:
      - Никогда не изменять историю
      - Быстрый поиск по событиям
    constraints:
      - Журнал огромный и append-only
      - Целостность через hash chain
    baseline_load:
      events_per_sec: 50000
      retention_years: 3
    topics: [audit, append_only, hash_chain, integrity, search, retention]
    steps: []
    acceptance_criteria:
      - Модель журнала и guarantee integrity
      - Поиск и фильтрация
      - Retention и архивирование
    evolution: []
    failure_questions:
      - Событие подделано. Как доказать целостность (hash chain)?
      - Журнал содержит перс. данные. Как соответствовать GDPR с retention?
      - Запрос «что делал юзер» по 3 млрд событий. Как ускорить?
    advanced_questions:
      - Как строить кольцевой timestamped журнал с cryptographically verifiable цепочкой?

  - id: permission-system
    title: "Permission / RBAC-ABAC System"
    level: senior
    category: security
    primary_pattern: rbac-abac
    summary: >
      Система прав доступа: RBAC (роли), ABAC (атрибуты), политики, hierarchical
      разрешения и оценка на лету.
    requirements:
      - Назначение ролей/разрешений юзерам
      - Проверка доступа на операцию
      - Политики по атрибутам (ABAC)
    nfr:
      - Короткий путь проверки (в < 5 мс)
      - Масштабируемость на миллионы юзеров
    constraints:
      - Проверка на лету при каждом запросе
      - Политики меняются без простоя
    baseline_load:
      users: 10000000
      pmz_checks_per_sec: 200000
    topics: [rbac, abac, policy, access_control, hierarchical, evaluation]
    steps: []
    acceptance_criteria:
      - Сравнение RBAC и ABAC
      - Хранилище политик и кэш
      - Производительность проверки
    evolution: []
    failure_questions:
      - Роль отозвана, но кэш разрешений устарел. Есть риск несанкционированного доступа?
      - Миллион юзеров с динамическими атрибутами. Как эффективно оценивать ABAC?
      - Иерархические права отдел -> проект -> сущность. Как построить без дуболомности?
    advanced_questions:
      - Как строить реестр политик (policy engine) с версионированием и аудитом?

