# Alembic configuration for tech_interview_agent.
#
# Database URL is read from the DATABASE_URL environment variable.
# In Docker it defaults to: postgresql+asyncpg://interview:interview@postgres:5432/interview

[alembic]
script_location = backend/alembic
prepend_sys_path = .
sqlalchemy.url =

# File template for new revisions.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
