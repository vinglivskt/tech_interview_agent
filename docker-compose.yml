# Qdrant: vector DB
# postgres: persistent user statistics
# api: FastAPI + RAG
# frontend: Vite dev server (proxies /api to api:8000)
#
# Usage:
#   docker compose up                       # все 4 сервиса
#   docker compose watch                    # dev с hot reload
#   docker compose up api qdrant postgres   # backend + vector DB + stats DB

services:
  qdrant:
    image: qdrant/qdrant:v1.16.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  postgres:
    image: postgres:18-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-interview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interview}
      POSTGRES_DB: ${POSTGRES_DB:-interview}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-interview} -d ${POSTGRES_DB:-interview}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: tech-interview-agent:api
    ports:
      - "8000:8000"
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_TIMEOUT_SEC: ${OLLAMA_TIMEOUT_SEC:-120}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-interview_qa}
      QDRANT_SHARD_NUMBER: ${QDRANT_SHARD_NUMBER:-2}
      QDRANT_REPLICATION_FACTOR: ${QDRANT_REPLICATION_FACTOR:-1}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      VECTORIZATION_MAX_CHUNK_CHARS: ${VECTORIZATION_MAX_CHUNK_CHARS:-1000}
      VECTORIZATION_OVERLAP: ${VECTORIZATION_OVERLAP:-100}
      INTERVIEW_TOP_K: ${INTERVIEW_TOP_K:-5}
      INTERVIEW_DOCX_PATH: /app/src/interview_questions.docx
      SYSTEM_PROMPT_PATH: /app/prompts/chat/system.md
      DESIGN_SCENARIOS_PATH: /app/prompts/design/scenarios.yaml
      INGEST_STATE_PATH: ${INGEST_STATE_PATH:-data/interview_ingest_state.json}
      INGEST_INTERVAL_HOURS: ${INGEST_INTERVAL_HOURS:-1}
      DATABASE_URL: postgresql+asyncpg://interview:interview@postgres:5432/interview
      DATABASE_ECHO: ${DATABASE_ECHO:-false}
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    develop:
      watch:
        - path: ./backend/src
          target: /app/src
          action: sync+restart
        - path: ./backend/prompts
          target: /app/prompts
          action: sync
        - path: ./backend/alembic
          target: /app/alembic
          action: sync
        - path: ./backend/alembic.ini
          target: /app/alembic.ini
          action: sync

  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://api:8000
    volumes:
      - ./frontend:/app:rw
      - frontend_node_modules:/app/node_modules:rw
    depends_on:
      - api
    develop:
      watch:
        - path: ./frontend/src
          target: /app/src
          action: sync+restart
        - path: ./frontend/index.html
          target: /app/index.html
          action: sync

volumes:
  qdrant_storage:
  frontend_node_modules:
  postgres_data:
